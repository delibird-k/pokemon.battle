            }
        }
    }


    return score;
}


// ============================================================
// 攻撃技の評価
// ============================================================

function aiV3AttackScore(
    move,
    attacker,
    defender
) {

    if (!move || !attacker || !defender) {
        return -Infinity;
    }


    const damage =
        aiV3Damage(
            move,
            attacker,
            defender
        );

    const expected =
        aiV3ExpectedDamage(
            move,
            attacker,
            defender
        );

    const accuracy =
        aiV3Num(
            getAIAccuracy(move),
            1
        );

    const effectiveness =
        aiV3Effectiveness(
            move,
            attacker,
            defender
        );

    const hits =
        aiV3HitsToKO(
            move,
            attacker,
            defender
        );


    let score = 0;


    // ========================================================
    // 基本ダメージ
    // ========================================================

    score +=
        expected *
        ULTIMATE_AI_V3.DAMAGE_WEIGHT;


    score +=
        (
            damage /
            Math.max(
                1,
                aiV3Num(defender.maxHp)
            )
        ) *
        12000;


    // ========================================================
    // 命中率
    // ========================================================

    score *=
        0.65 +
        accuracy * 0.35;


    // ========================================================
    // タイプ相性
    // ========================================================

    if (effectiveness >= 4) {

        score +=
            ULTIMATE_AI_V3.SUPER_EFFECTIVE_BONUS * 2;

    } else if (effectiveness >= 2) {

        score +=
            ULTIMATE_AI_V3.SUPER_EFFECTIVE_BONUS;

    } else if (effectiveness === 0) {

        score -=
            ULTIMATE_AI_V3.IMMUNE_PENALTY;

    } else if (effectiveness <= 0.5) {

        score -=
            ULTIMATE_AI_V3.RESIST_BONUS;
    }


    // ========================================================
    // KO
    // ========================================================

    if (hits === 1) {

        score +=
            ULTIMATE_AI_V3.KO_BONUS;

    } else if (hits === 2) {

        score +=
            ULTIMATE_AI_V3.TWO_HIT_BONUS;
    }


    // ========================================================
    // 先制技
    // ========================================================

    if (
        aiV3Num(move.priority) > 0
    ) {

        score +=
            ULTIMATE_AI_V3.PRIORITY_BONUS;
    }


    // ========================================================
    // 反動技
    // ========================================================

    try {

        score -=
            aiV3Num(
                getAIRecoilPenalty(
                    move,
                    attacker,
                    defender
                )
            );

    } catch (e) {}


    // ========================================================
    // 現在の既存AI評価も利用
    // ========================================================

    try {

        score +=
            aiV3Num(
                evaluateAIMove(
                    move,
                    attacker,
                    defender
                )
            ) * 0.45;

    } catch (e) {}


    // ========================================================
    // 自分が次ターン倒されるか
    // ========================================================

    const enemyAttack =
        aiV3BestEnemyAttack(
            defender,
            attacker
        );


    if (enemyAttack) {

        if (
            enemyAttack.ko &&
            !aiV3IsKO(
                move,
                attacker,
                defender
            )
        ) {

            score -=
                ULTIMATE_AI_V3.DEATH_PENALTY;
        }


        // 今の技で相手を倒せるなら
        // 次ターンの反撃を受けない

        if (
            aiV3IsKO(
                move,
                attacker,
                defender
            )
        ) {

            score += 15000;
        }
    }


    return score;
}


// ============================================================
// 技全体の評価
// ============================================================

function aiV3EvaluateMove(
    move,
    attacker,
    defender
) {

    if (!move) {
        return -Infinity;
    }


    if (aiV3IsAttack(move)) {

        return aiV3AttackScore(
            move,
            attacker,
            defender
        );

    }


    return aiV3StatusMoveScore(
        move,
        attacker,
        defender
    );
}


// ============================================================
// 「相手がこの技を受けた後」に
// 相手が何をするか予測
// ============================================================

function aiV3PredictEnemyResponse(
    move,
    attacker,
    defender
) {

    if (!move || !attacker || !defender) {
        return {
            score: 0,
            move: null
        };
    }


    // --------------------------------------------------------
    // 仮想的な相手HP
    // --------------------------------------------------------

    let virtualEnemyHp =
        aiV3Num(
            defender.currentHp
        );


    if (aiV3IsAttack(move)) {

        virtualEnemyHp =
            Math.max(
                0,
                virtualEnemyHp -
                aiV3ExpectedDamage(
                    move,
                    attacker,
                    defender
                )
            );
    }


    // KOなら相手は行動できない

    if (virtualEnemyHp <= 0) {

        return {
            score: 40000,
            move: null,
            ko: true
        };
    }


    // --------------------------------------------------------
    // 相手の次の最善攻撃を探す
    // --------------------------------------------------------

    const enemyMoves =
        getAIEffectiveMoves(
            defender,
            attacker
        ) || [];


    let bestEnemyMove = null;
    let bestEnemyScore = -Infinity;


    for (
        const enemyMove
        of enemyMoves
    ) {

        let score =
            aiV3EvaluateMove(
                enemyMove,
                defender,
                attacker
            );


        // 実際にはこちらの技を受けた後なので
        // HPが減った分だけKOされやすくなる

        const enemyDamage =
            aiV3ExpectedDamage(
                enemyMove,
                defender,
                attacker
            );


        if (
            enemyDamage >=
            aiV3Num(attacker.currentHp)
        ) {

            score += 30000;
        }


        if (
            score >
            bestEnemyScore
        ) {

            bestEnemyScore =
                score;

            bestEnemyMove =
                enemyMove;
        }
    }


    return {

        score: bestEnemyScore,
        move: bestEnemyMove,
        virtualEnemyHp
    };
}


// ============================================================
// 2手先読み
//
// 自分:
//   技A
//
// 相手:
//   最善反撃B
//
// 自分:
//   次にどれくらい有利か
// ============================================================

function aiV3TwoPlyScore(
    move,
    attacker,
    defender
) {

    if (!move) {
        return -Infinity;
    }


    const immediate =
        aiV3EvaluateMove(
            move,
            attacker,
            defender
        );


    const response =
        aiV3PredictEnemyResponse(
            move,
            attacker,
            defender
        );


    let score =
        immediate;


    // ========================================================
    // 相手の反撃を評価
    // ========================================================

    if (
        response &&
        response.move
    ) {

        const enemyMove =
            response.move;


        const enemyDamage =
            aiV3ExpectedDamage(
                enemyMove,
                defender,
                attacker
            );


        // 相手から受けるダメージはマイナス

        score -=
            enemyDamage *
            ULTIMATE_AI_V3.SURVIVAL_WEIGHT;


        // 自分が倒される

        if (
            enemyDamage >=
            aiV3Num(attacker.currentHp)
        ) {

            score -=
                ULTIMATE_AI_V3.DEATH_PENALTY;
        }


        // 逆に相手を倒せる

        if (
            response.virtualEnemyHp <= 0
        ) {

            score +=
                ULTIMATE_AI_V3.KO_BONUS;
        }
    }


    // ========================================================
    // HP評価
    // ========================================================

    const predictedOwnHp =
        Math.max(
            0,
            aiV3Num(attacker.currentHp) -
            (
                response?.move
                    ? aiV3ExpectedDamage(
                        response.move,
                        defender,
                        attacker
                    )
                    : 0
            )
        );


    score +=
        (
            predictedOwnHp /
            Math.max(
                1,
                aiV3Num(attacker.maxHp)
            )
        ) *
        10000;


    // ========================================================
    // 相手HP評価
    // ========================================================

    if (
        response &&
        response.virtualEnemyHp !== undefined
    ) {

        score +=
            (
                1 -
                response.virtualEnemyHp /
                Math.max(
                    1,
                    aiV3Num(defender.maxHp)
                )
            ) *
            10000;
    }


    return score;
}


// ============================================================
// 3vs3全体評価
// ============================================================

function aiV3BattlePositionScore() {

    if (
        !playerPokemon ||
        !opponentPokemon
    ) {

    }


    let score = 0;

        ) *

    // --------------------------------------------------------

    score +=
        (
            aiV3AliveCount(opponentTeam) -
            aiV3AliveCount(playerTeam)
        ) *
        12000;


    // --------------------------------------------------------
    // 状態異常
    // --------------------------------------------------------

    if (
        opponentPokemon.status
    ) {

    }

    if (
        playerPokemon.status
    ) {

        score += 2500;
    }


    return score;
}


// ============================================================
// 最終技決定
// ============================================================

function aiV3ChooseBestMove(
    attacker,
    defender
) {

    if (!attacker || !defender) {
        return null;
    }


    const moves =
        getAIEffectiveMoves(
            attacker,
            defender
        ) || [];


    if (!moves.length) {
        return null;
    }


    let bestMove = null;
    let bestScore = -Infinity;


    const results = [];


    for (
        const move
        of moves
    ) {

        let score;


        // ----------------------------------------------------
        // HARD
        // ----------------------------------------------------

        if (
            difficulty === "hard"
        ) {

            score =
                aiV3TwoPlyScore(
                    move,
                    attacker,
                    defender
                );

        }

        // ----------------------------------------------------
        // NORMAL
        // ----------------------------------------------------

        else if (
            difficulty === "normal" ||
            difficulty === "ノーマル"
        ) {

            score =
                aiV3EvaluateMove(
                    move,
                    attacker,
                    defender
                ) * 0.8;

        }

        // ----------------------------------------------------
        // EASY
        // ----------------------------------------------------

        else {

            score =
                aiV3EvaluateMove(
                    move,
                    attacker,
                    defender
                ) * 0.45;
        }


        // ----------------------------------------------------
        // 既存AIとの融合
        // ----------------------------------------------------

        try {

            score +=
                aiV3Num(
                    getAIPersonalityBonus(
                        move,
                        attacker,
                        defender
                    )
                );

        } catch (e) {}


        results.push({
            move,
            score
        });


        if (
            score >
            bestScore
        ) {

            bestScore =
                score;

            bestMove =
                move;
        }
    }


    if (!bestMove) {
        return moves[0];
    }


    // ========================================================
    // NORMAL
    // 少しだけランダム性を残す
    // ========================================================

    if (
        difficulty === "normal" ||
        difficulty === "ノーマル"
    ) {

        results.sort(
            (a, b) =>
                b.score -
                a.score
        );


        const top =
            results.slice(
                0,
                Math.min(
                    2,
                    results.length
                )
            );


        if (
            top.length > 1 &&
            Math.random() < 0.20
        ) {

            return top[1].move;
        }
    }


    // ========================================================
    // EASY
    // ========================================================

    if (
        difficulty === "easy"
    ) {

        const shuffled =
            [...results].sort(
                () => Math.random() - 0.5
            );


        const top =
            shuffled
                .sort(
                    (a, b) =>
                        b.score -
                        a.score
                )
                .slice(
                    0,
                    Math.min(
                        3,
                        shuffled.length
                    )
                );


        if (
            top.length > 1
        ) {

            return top[
                Math.floor(
                    Math.random() *
                    top.length
                )
            ].move;
        }
    }


    return bestMove;
}


// ============================================================
// 🔥 V3 getOpponentMove

const aiV3_originalGetOpponentMove =

    ) {

    }


    const moves =

        ) || [];


    if (!moves.length) {

        return (
            aiV3_originalGetOpponentMove()
        );
    }


    // ========================================================
    // 確定KOは最優先
    // ========================================================

    const koMoves =
        moves.filter(
            move =>
                aiV3IsKO(
                    move,
                    attacker,
                    defender
                )
        );


    if (
        koMoves.length === 1
    ) {

        return koMoves[0];
    }


    // 複数KO技ならV3で選ぶ

    if (
        koMoves.length > 1
    ) {

        return aiV3ChooseBestMove(
            attacker,
            defender
        );
    }


    // ========================================================
    // V3本体
    // ========================================================

    const bestMove =
        aiV3ChooseBestMove(
            attacker,
            defender
        );


    if (bestMove) {

        return bestMove;
    }


    return (
        aiV3_originalGetOpponentMove()
    );
};


// ============================================================
// 🔥 V3 交代判断
// ============================================================

function aiV3EvaluateSwitch(
    candidate
) {

    if (
        !candidate ||
        !playerPokemon
    ) {

        return -Infinity;
    }


    let score = 0;


    // ========================================================
    // HP
    // ========================================================

    score +=
        aiV3HpRate(candidate) *
        5000;


    // ========================================================
    // 相手への最大火力
    // ========================================================

    const attack =
        aiV3BestEnemyAttack(
            candidate,
            playerPokemon
        );


    if (attack) {

        score +=
            attack.expected *
            3;


        if (attack.ko) {

            score +=
                30000;
        }


        const effectiveness =
            aiV3Effectiveness(
                attack.move,
                candidate,
                playerPokemon
            );


        if (effectiveness >= 2) {

            score += 5000;
        }

        if (effectiveness === 0) {

            score -= 10000;
        }
    }


    // ========================================================
    // 相手から受けるダメージ
    // ========================================================

    const enemyAttack =
        aiV3BestEnemyAttack(
            playerPokemon,
            candidate
        );


    if (enemyAttack) {

        score -=
            enemyAttack.expected *
            3;


        if (enemyAttack.ko) {

            score -= 50000;
        }


        const effectiveness =
            aiV3Effectiveness(
                enemyAttack.move,
                playerPokemon,
                candidate
            );


        if (effectiveness <= 0.5) {

            score += 4000;
        }

        if (effectiveness >= 2) {

            score -= 4000;
        }
    }


    return score;
}


// ============================================================
// V3 交代先決定
// ============================================================

function aiV3ChooseBestSwitch() {

    if (
        !Array.isArray(opponentTeam)
    ) {

        return -1;
    }


    let bestIndex = -1;
    let bestScore = -Infinity;


    opponentTeam.forEach(
        (pokemon, index) => {

            if (!pokemon) {
                return;
            }


            if (
                index ===
                opponentActiveIndex
            ) {

                return;
            }


            if (
                aiV3Num(
                    pokemon.currentHp
                ) <= 0
            ) {

                return;
            }


            const score =
                aiV3EvaluateSwitch(
                    pokemon
                );


            if (
                score >
                bestScore
            ) {

                bestScore =
                    score;

                bestIndex =
                    index;
            }
        }
    );


    return bestIndex;
}


// ============================================================
// V3 通常交代判断
// ============================================================

const aiV3_originalShouldOpponentSwitch =
    shouldOpponentSwitch;


shouldOpponentSwitch = function() {

    if (
        difficulty === "easy"
    ) {

        return false;
    }


    if (
        opponentSwitchedLastTurn
    ) {

        return false;
    }


    if (
        !opponentPokemon ||
        !playerPokemon
    ) {

        return false;
    }


    const candidates =
        opponentTeam.filter(
            (pokemon, index) =>
                index !== opponentActiveIndex &&
                pokemon.currentHp > 0
        );


    if (!candidates.length) {

        return false;
    }


    // ========================================================
    // 今のポケモンが戦い続ける価値
    // ========================================================

    const stayAttack =
        aiV3BestEnemyAttack(
            opponentPokemon,
            playerPokemon
        );


    const stayDefense =
        aiV3BestEnemyAttack(
            playerPokemon,
            opponentPokemon
        );


    let stayScore = 0;


    if (stayAttack) {

        stayScore +=
            stayAttack.expected * 3;


        if (stayAttack.ko) {

            stayScore += 50000;
        }
    }


    if (stayDefense) {

        stayScore -=
            stayDefense.expected * 3;


        if (stayDefense.ko) {

            stayScore -= 50000;
        }
    }


    // ========================================================
    // 交代先
    // ========================================================

    const switchIndex =
        aiV3ChooseBestSwitch();


    if (
        switchIndex === -1
    ) {

        return false;
    }


    const switchPokemon =
        opponentTeam[switchIndex];


    const switchScore =
        aiV3EvaluateSwitch(
            switchPokemon
        );


    // ========================================================
    // 交代が明確に得なら交代
    // ========================================================

    const advantage =
        switchScore -
        stayScore;


    if (
        difficulty === "hard"
    ) {

        return advantage > 3000;
    }


    return advantage > 7000;
};


// ============================================================
// V3 交代先をゲーム本体にも使用させる

const aiV3_originalChooseBestOpponentSwitch =
    chooseBestOpponentSwitch;


chooseBestOpponentSwitch = function() {

    const v3Index =
        aiV3ChooseBestSwitch();


    if (
        v3Index !== -1
    ) {

        return v3Index;
    }


    return (
        aiV3_originalChooseBestOpponentSwitch()
    );
};

// ============================================================
// 数値安全処理
// ============================================================

function aiV4Num(value, fallback = 0) {

    const n = Number(value);

    return Number.isFinite(n)
        ? n
        : fallback;
}


// ============================================================
// HP割合
// ============================================================

function aiV4HpRate(pokemon) {

    if (
        !pokemon ||
        aiV4Num(pokemon.maxHp) <= 0
    ) {
        return 0;
    }

    return Math.max(
        0,
        Math.min(
            1,
            aiV4Num(pokemon.currentHp) /
            aiV4Num(pokemon.maxHp)
        )
    );
}


// ============================================================
// 生存数
// ============================================================

function aiV4AliveCount(team) {

    if (!Array.isArray(team)) {
        return 0;
    }

    return team.filter(
        pokemon =>
            pokemon &&
            aiV4Num(pokemon.currentHp) > 0
    ).length;
}


// ============================================================
// 技一覧
// ============================================================

function aiV4GetMoves(
    attacker,
    defender
) {

    if (
        !attacker ||
        !defender
    ) {
        return [];
    }

    try {

        return (
            getAIEffectiveMoves(
                attacker,
                defender
            ) || []
        );

    } catch (e) {

        return [];
    }
}


// ============================================================
// ダメージ
// ============================================================

function aiV4Damage(
    move,
    attacker,
    defender
) {

    try {

        return Math.max(
            0,
            aiV4Num(
                getAIDamage(
                    move,
                    attacker,
                    defender
                )
            )
        );

    } catch (e) {

        return 0;
    }
}


// ============================================================
// 命中率
// ============================================================

function aiV4Accuracy(move) {

    try {

        return Math.max(
            0,
            Math.min(
                1,
                aiV4Num(
                    getAIAccuracy(move),
                    1
                )
            )
        );

    } catch (e) {

        return 1;
    }
}


// ============================================================
// 期待ダメージ
// ============================================================

function aiV4ExpectedDamage(
    move,
    attacker,
    defender
) {

    return (
        aiV4Damage(
            move,
            attacker,
            defender
        ) *
        aiV4Accuracy(move)
    );
}


// ============================================================
// タイプ相性
// ============================================================

function aiV4Effectiveness(
    move,
    attacker,
    defender
) {

    try {

        return aiV4Num(
            getAITypeEffectiveness(
                move,
                attacker,
                defender
            ),
            1
        );

    } catch (e) {

        return 1;
    }
}


// ============================================================
// KO判定
// ============================================================

function aiV4KO(
    move,
    attacker,
    defender
) {

    return (
        aiV4Damage(
            move,
            attacker,
            defender
        ) >=
        aiV4Num(defender?.currentHp)
    );
}


// ============================================================
// 何発でKO
// ============================================================

function aiV4Hits(
    move,
    attacker,
    defender
) {

    const damage =
        aiV4Damage(
            move,
            attacker,
            defender
        );

    if (damage <= 0) {
        return Infinity;
    }

    return Math.ceil(
        aiV4Num(defender.currentHp) /
        damage
    );
}


// ============================================================
// 素早さ
// ============================================================

function aiV4Speed(pokemon) {

    if (!pokemon) {
        return 0;
    }

    try {

        return aiV4Num(
            getAIEffectiveStat(
                pokemon,
                "speed"
            )
        );

    } catch (e) {

        return aiV4Num(
            pokemon.speed
        );
    }
}


// ============================================================
// 行動順
// ============================================================

function aiV4GoesFirst(
    move,
    attacker,
    defender
) {

    const priority =
        aiV4Num(
            move?.priority
        );

    const defenderMoves =
        aiV4GetMoves(
            defender,
            attacker
        );

    let enemyPriority = 0;

    for (
        const enemyMove
        of defenderMoves
    ) {

        enemyPriority =
            Math.max(
                enemyPriority,
                aiV4Num(
                    enemyMove.priority
                )
            );
    }

    if (
        priority >
        enemyPriority
    ) {
        return true;
    }

    if (
        priority <
        enemyPriority
    ) {
        return false;
    }

    return (
        aiV4Speed(attacker) >=
        aiV4Speed(defender)
    );
}

function aiV4StatusValue(

// ============================================================
// 1つの技を盤面評価
// ============================================================

function aiV4EvaluateAction(
    move,
    attacker,
    defender
) {

    if (
        !move ||
        !attacker ||
        !defender
    ) {
        return -Infinity;
    }


    let score = 0;


    // ========================================================
    // 攻撃技
    // ========================================================

    if (
        move.category !== "status"
    ) {

        const damage =
            aiV4Damage(
                move,
                attacker,
                defender
            );

        const expected =
            aiV4ExpectedDamage(
                move,
                attacker,
                defender
            );

        const effectiveness =
            aiV4Effectiveness(
                move,
                attacker,
                defender
            );

        const hits =
            aiV4Hits(
                move,
                attacker,
                defender
            );


        // 基本火力

        score +=
            expected *
            ULTIMATE_AI_V4.DAMAGE_WEIGHT;


        // HP割合

        score +=
            (
                damage /
                Math.max(
                    1,
                    aiV4Num(
                        defender.maxHp
                    )
                )
            ) *
            ULTIMATE_AI_V4.HP_WEIGHT;


        // 命中率

        score *=
            0.55 +
            aiV4Accuracy(move) *
            0.45;


        // 相性

        if (
            effectiveness >= 4
        ) {

            score +=
                ULTIMATE_AI_V4.SUPER_EFFECTIVE * 2;

        } else if (
            effectiveness >= 2
        ) {

            score +=
                ULTIMATE_AI_V4.SUPER_EFFECTIVE;

        } else if (
            effectiveness === 0
        ) {

            score +=
                ULTIMATE_AI_V4.IMMUNE;

        } else if (
            effectiveness <= 0.5
        ) {

            score -=
                ULTIMATE_AI_V4.RESIST;
        }


        // KO

        if (
            hits === 1
        ) {

            score +=
                ULTIMATE_AI_V4.KO_BONUS;

        } else if (
            hits === 2
        ) {

            score +=
                ULTIMATE_AI_V4.TWO_HIT_BONUS;
        }


        // 先制

        if (
            aiV4Num(move.priority) > 0
        ) {

            score +=
                ULTIMATE_AI_V4.SPEED;
        }


        // ----------------------------------------------------
        // 自分が次に倒されるか
        // ----------------------------------------------------

        const enemyBest =
            aiV4BestAttack(
                defender,
                attacker
            );


        if (enemyBest) {

            if (
                enemyBest.ko &&
                !aiV4KO(
                    move,
                    attacker,
                    defender
                )
            ) {

                score -= 90000;

            } else if (
                enemyBest.ko &&
                aiV4KO(
                    move,
                    attacker,
                    defender
                )
            ) {

                score += 40000;
            }
        }


    } else {

        // ====================================================
        // 補助技
        // ====================================================

        score +=
            aiV4StatusValue(
                move,
                attacker,
                defender
            );


        // みがわり

        if (
            move.name === "みがわり"
        ) {

            if (
                !attacker.hasSubstitute &&
                aiV4HpRate(attacker) > 0.4
            ) {

                score += 7000;

            } else {

                score -= 5000;
            }
        }


        // まもる

        if (
            move.name === "まもる" ||
            move.name === "キングシールド"
        ) {

            const enemyBest =
                aiV4BestAttack(
                    defender,
                    attacker
                );

            if (
                enemyBest &&
                enemyBest.ko
            ) {

                score += 30000;

            } else if (
                enemyBest &&
                enemyBest.expected >
                attacker.currentHp * 0.4
            ) {

                score += 7000;

            } else {

                score -= 2500;
            }
        }
    }


    // ========================================================
    // 既存AIの評価を少し混ぜる
    // ========================================================

    try {

        score +=
            aiV4Num(
                evaluateAIMove(
                    move,
                    attacker,
                    defender
                )
            ) * 0.30;

    } catch (e) {}


    return score;
}


// ============================================================
// 最善攻撃
// ============================================================

function aiV4BestAttack(
    attacker,
    defender
) {

    const moves =
        aiV4GetMoves(
            attacker,
            defender
        );


    let best = null;
    let bestScore = -Infinity;


    for (
        const move
        of moves
    ) {

        if (
            move.category === "status"
        ) {
            continue;
        }


        const damage =
            aiV4Damage(
                move,
                attacker,
                defender
            );

        const expected =
            aiV4ExpectedDamage(
                move,
                attacker,
                defender
            );


        let score =
            expected;


        if (
            damage >=
            aiV4Num(defender.currentHp)
        ) {

            score += 100000;
        }


        if (
            score >
            bestScore
        ) {

            bestScore = score;

            best = {
                move,
                damage,
                expected,
                ko:
                    damage >=
                    aiV4Num(
                        defender.currentHp
                    )
            };
        }
    }


    return best;
}


// ============================================================
// 仮想的に技を使った後の評価
// ※実際のポケモンデータは変更しない
// ============================================================

function aiV4VirtualStateScore(
    move,
    attacker,
    defender
) {

    if (
        !move ||
        !attacker ||
        !defender
    ) {
        return -Infinity;
    }


    const damage =
        aiV4ExpectedDamage(
            move,
            attacker,
            defender
        );


    const enemyHpAfter =
        Math.max(
            0,
            aiV4Num(
                defender.currentHp
            ) -
            damage
        );


    // ========================================================
    // KOなら即座に大幅加点
    // ========================================================

    if (
        enemyHpAfter <= 0
    ) {

        return (
            ULTIMATE_AI_V4.WIN / 2
        );
    }


    let score = 0;


    // 相手HP

    score +=
        (
            1 -
            enemyHpAfter /
            Math.max(
                1,
                aiV4Num(
                    defender.maxHp
                )
            )
        ) *
        ULTIMATE_AI_V4.HP_WEIGHT;


    // 自分HP

    score +=
        aiV4HpRate(attacker) *
        ULTIMATE_AI_V4.HP_WEIGHT;


    // ========================================================
    // 相手の最善反撃
    // ========================================================

    const enemyBest =
        aiV4BestAttack(
            defender,
            attacker
        );


    if (enemyBest) {

        score -=
            enemyBest.expected *
            ULTIMATE_AI_V4.DAMAGE_WEIGHT;


        if (
            enemyBest.ko
        ) {

            score -=
                ULTIMATE_AI_V4.KO_BONUS;
        }
    }


    // ========================================================
    // 状態異常
    // ========================================================

    if (
        attacker.status
    ) {

        score -= 4000;
    }

    if (
        defender.status
    ) {

        score += 4000;
    }


    return score;
}


// ============================================================
// 相手側から見た「最善の反撃」
// ============================================================

function aiV4FindBestResponse(
    defender,
    attacker
) {

    const moves =
        aiV4GetMoves(
            defender,
            attacker
        );


    let best = null;
    let bestScore = -Infinity;


    for (
        const move
        of moves
    ) {

        const score =
            aiV4EvaluateAction(
                move,
                defender,
                attacker
            );


        if (
            score >
            bestScore
        ) {

            bestScore =
                score;

            best = {
                move,
                score
            };
        }
    }


    return best;
}


// ============================================================
// MINIMAX
//
// COMの技
// ↓
// プレイヤーの最善反応
// ↓
// COMがどれくらい得するか
// ============================================================

function aiV4Minimax(
    move,
    attacker,
    defender,
    depth
) {

    if (
        depth <= 0
    ) {

        return aiV4VirtualStateScore(
            move,
            attacker,
            defender
        );
    }


    // ========================================================
    // COMがこの技を使った直後
    // ========================================================

    let score =
        aiV4EvaluateAction(
            move,
            attacker,
            defender
        );


    // ========================================================
    // 相手の最善反応を探す
    // ========================================================

    const response =
        aiV4FindBestResponse(
            defender,
            attacker
        );


    if (
        !response ||
        !response.move
    ) {

        return score;
    }


    const enemyMove =
        response.move;


    const enemyDamage =
        aiV4ExpectedDamage(
            enemyMove,
            defender,
            attacker
        );


    // ========================================================
    // 相手からの反撃を減点
    // ========================================================

    score -=
        enemyDamage *
        3;


    // 相手にKOされるなら非常に大きく減点

    if (
        enemyDamage >=
        aiV4Num(attacker.currentHp)
    ) {

        score -=
            ULTIMATE_AI_V4.KO_BONUS;
    }


    // ========================================================
    // 反撃後にCOMが使える最善技
    // ========================================================

    const nextMoves =
        aiV4GetMoves(
            attacker,
            defender
        );


    let nextBest =
        -Infinity;


    for (
        const nextMove
        of nextMoves
    ) {

        const nextScore =
            aiV4EvaluateAction(
                nextMove,
                attacker,
                defender
            );


        if (
            nextScore >
            nextBest
        ) {

            nextBest =
                nextScore;
        }
    }


    if (
        Number.isFinite(nextBest)
    ) {

        score +=
            nextBest * 0.55;
    }


    return score;
}


// ============================================================
// 3vs3全体評価
// ============================================================

function aiV4TeamEvaluation() {

    let score = 0;


    // COM側

    const opponentAlive =
        aiV4AliveCount(
            opponentTeam
        );


    // プレイヤー側

    const playerAlive =

        );

    score +=
        (
            opponentAlive -
            playerAlive
        ) *
        ULTIMATE_AI_V4.TEAM_WEIGHT;


    // 現在HP

    if (
        opponentPokemon
    ) {

        score +=
            aiV4HpRate(
                opponentPokemon
            ) *
            ULTIMATE_AI_V4.HP_WEIGHT;
    }


    if (
        playerPokemon
    ) {

        score -=
            aiV4HpRate(
                playerPokemon
            ) *
            ULTIMATE_AI_V4.HP_WEIGHT;
    }


    // 状態異常

    if (
        opponentPokemon?.status
    ) {

        score -= 4000;
    }


    if (
        playerPokemon?.status
    ) {

        score += 4000;
    }


    return score;
}

        ) {

                aiV4Minimax(
                    move,
                    attacker,
                    defender,
                    ULTIMATE_AI_V4.DEPTH
                );

        }

        // NORMAL
        else if (
            difficulty === "normal" ||
            difficulty === "ノーマル"
        ) {

            score =
                aiV4EvaluateAction(
                    move,
                    attacker,
                    defender
                );

        }

        // EASY
        else {

            score =
                aiV4EvaluateAction(
                    move,
                    attacker,
                    defender
                ) * 0.45;
        }


        // 性格

        try {

            score +=
                aiV4Num(
                    getAIPersonalityBonus(
                        move,
                        attacker,
                        defender
                    )
                );

        } catch (e) {}


        results.push({
            move,
            score
        });


        if (
            score >
            bestScore
        ) {

            bestScore =
                score;

            bestMove =
                move;
        }
    }


    // ========================================================
    // HARD
    // ========================================================

    if (
        difficulty === "hard"
    ) {

        console.log(
            "🔥 V4 AI:",
            results
                .map(
                    x =>
                        `${x.move.name}:${Math.round(x.score)}`
                )
                .join(" / ")
        );

        return bestMove;
    }


    // ========================================================
    // NORMAL
    // ========================================================

    if (
        difficulty === "normal" ||
        difficulty === "ノーマル"
    ) {

        results.sort(
            (a, b) =>
                b.score -
                a.score
        );


        if (
            results.length >= 2 &&
            Math.random() < 0.15
        ) {

            return results[1].move;
        }
    }


    // ========================================================
    // EASY
    // ========================================================

    if (
        difficulty === "easy"
    ) {

        const top =
            results
                .sort(
                    (a, b) =>
                        b.score -
                        a.score
                )
                .slice(
                    0,
                    Math.min(
                        3,
                        results.length
                    )
                );


        return top[
            Math.floor(
                Math.random() *
                top.length
            )
        ].move;
    }


    return bestMove;
}

getOpponentMove = function() {

    if (

        !playerPokemon
    ) {

        return null;
    }


    const moves =
        aiV4GetMoves(
            opponentPokemon,
            playerPokemon
        );


    if (!moves.length) {

        return aiV4_previousGetOpponentMove();
    }


    // ========================================================

    const koMoves =
        moves.filter(
            move =>
                aiV4KO(
                    move,
                    opponentPokemon,

                )
        );


    if (
        koMoves.length === 1
    ) {

    // ========================================================

    // ========================================================

    const best =
        aiV4ChooseBestMove(
            opponentPokemon,

        );


    if (best) {

    }


    return (
        aiV4_previousGetOpponentMove()
    );
};


// ============================================================
// V4 交代評価
// ============================================================

function aiV4SwitchScore(
    pokemon
) {

    if (
        !pokemon ||
        !playerPokemon
    ) {

        return -Infinity;
    }


    let score = 0;


    // --------------------------------------------------------
    // HP
    // --------------------------------------------------------

    score +=
        aiV4HpRate(pokemon) *
        7000;


    // --------------------------------------------------------
    // 相手への攻撃
    // --------------------------------------------------------

    const attack =
        aiV4BestAttack(
            pokemon,
            playerPokemon
        );


    if (attack) {

        score +=
            attack.expected *
            5;


        if (
            attack.ko
        ) {

            score += 60000;
        }


        const effectiveness =
            aiV4Effectiveness(
                attack.move,
                pokemon,
                playerPokemon
            );


        if (
            effectiveness >= 2
        ) {

            score += 6000;
        }


        if (
            effectiveness === 0
        ) {

            score -= 12000;
        }
    }


    // --------------------------------------------------------
    // 相手から受ける攻撃
    // --------------------------------------------------------

    const defense =
        aiV4BestAttack(
            playerPokemon,
            pokemon
        );


    if (defense) {

        score -=
            defense.expected *
            4;


        if (
            defense.ko
        ) {

            score -= 60000;
        }


        const effectiveness =
            aiV4Effectiveness(
                defense.move,
                playerPokemon,
                pokemon
            );


        if (
            effectiveness <= 0.5
        ) {

            score += 5000;
        }


        if (
            effectiveness >= 2
        ) {

            score -= 5000;
        }
    }


    return score;
}


// ============================================================
// V4 最善交代
// ============================================================

function aiV4ChooseSwitch() {

    if (
        !Array.isArray(opponentTeam)
    ) {

        return -1;
    }


    let bestIndex = -1;
    let bestScore = -Infinity;


    opponentTeam.forEach(
        (pokemon, index) => {

            if (!pokemon) {
                return;
            }


            if (
                index ===
                opponentActiveIndex
            ) {

                return;
            }


            if (
                aiV4Num(
                    pokemon.currentHp
                ) <= 0
            ) {

                return;
            }


            const score =
                aiV4SwitchScore(
                    pokemon
                );


            if (
                score >
                bestScore
            ) {

                bestScore =
                    score;

                bestIndex =
                    index;
            }
        }
    );


    return bestIndex;
}

const aiV4_previousShouldSwitch =
    shouldOpponentSwitch;


shouldOpponentSwitch = function() {

    if (
        difficulty === "easy"
    ) {

        return false;
    }


    if (
        opponentSwitchedLastTurn
    ) {

        return false;
    }


    if (
        !opponentPokemon ||
        !playerPokemon
    ) {

        return false;
    }


    const switchIndex =
        aiV4ChooseSwitch();


    if (
        switchIndex === -1
    ) {

        return false;
    }


    const switchPokemon =
        opponentTeam[
            switchIndex
        ];


    const switchScore =
        aiV4SwitchScore(
            switchPokemon
        );


    // --------------------------------------------------------
    // 現在のポケモン
    // --------------------------------------------------------

    const currentAttack =
        aiV4BestAttack(
            opponentPokemon,
            playerPokemon
        );


    const currentDefense =
        aiV4BestAttack(
            playerPokemon,
            opponentPokemon
        );


    let stayScore = 0;


    if (currentAttack) {

        stayScore +=
            currentAttack.expected *
            5;


        if (
            currentAttack.ko
        ) {

            stayScore += 60000;
        }
    }


    if (currentDefense) {

        stayScore -=
            currentDefense.expected *
            5;


        if (
            currentDefense.ko
        ) {

            stayScore -= 60000;
        }
    }


    // ========================================================
    // 交代と居座りを比較
    // ========================================================

    const advantage =
        switchScore -
        stayScore;


    if (
        difficulty === "hard"
    ) {

        return advantage > 5000;
    }


    return advantage > 9000;
};


// ============================================================
// V4 交代先
// ============================================================

const aiV4_previousChooseSwitch =
    chooseBestOpponentSwitch;


chooseBestOpponentSwitch = function() {

    const index =
        aiV4ChooseSwitch();


    if (
        index !== -1
    ) {

        return index;
    }


    return (
        aiV4_previousChooseSwitch()
    );
};

                attacker.hasSubstitute =
                    true;

                attacker.substituteHp =
                    cost;
            }
        }

        /* ==========================================
           まもる
           ========================================== */

        if (
            name === "まもる"
        ) {

            attacker.isProtected =
                true;
        }

        /* ==========================================
           状態異常
           ========================================== */

        if (
            move.secondary &&
            move.secondary.effect ===
            "status"
        ) {

            const chance =
                v5Num(
                    move.secondary.chance,
                    0
                );

            /*
             * AIの期待値計算では
             * 確率を完全には固定せず、
             * 状態異常が発生したケースも評価する。
             */

            if (chance >= 50) {

                defender.status =
                    move.secondary.status;

                if (
                    move.secondary.status ===
                    "paralyze"
                ) {
                    defender.paralysis =
                        true;
                }

                if (
                    move.secondary.status ===
                    "burn"
                ) {
                    defender.burn =
                        true;
                }

                if (
                    move.secondary.status ===
                    "poison"
                ) {
                    defender.poison =
                        true;
                }
            }
        }

        /* ==========================================
           secondary stat
           ========================================== */

        if (
            move.secondary &&
            move.secondary.effect ===
            "stat"
        ) {

            const chance =
                v5Num(
                    move.secondary.chance,
                    0
                );

            if (chance >= 50) {

                const stat =
                    move.secondary.stat;

                v5SetStage(
                    defender,
                    stat,
                    v5StatStage(
                        defender,
                        stat
                    ) +
                    v5Num(
                        move.secondary.stage,
                        0
                    )
                );
            }
        }
    }

    /* ========================================================
       仮想的に技を使う
       ======================================================== */

    function v5SimulateMove(
        attacker,
        defender,
        move
    ) {

        const a =
            v5Clone(attacker);

        const d =
            v5Clone(defender);

        const damage =
            v5Damage(
                a,
                d,
                move
            );

        const expected =
            damage *
            v5Accuracy(move);

        /*
         * 実際の1回のシミュレーションでは
         * 最大ダメージを使用。
         * 評価関数側で命中率を掛ける。
         */
        v5ApplyMoveEffects(
            null,
            a,
            d,
            move,
            damage
        );

        return {
            attacker: a,
            defender: d,
            damage,
            expectedDamage: expected
        };
    }

    /* ========================================================
       行動評価
       ======================================================== */

    function v5ActionScore(
        attacker,
        defender,
        move
    ) {

        if (!move) {
            return -Infinity;
        }

        const name =
            String(move.name || "");

        let score = 0;

        const damage =
            v5Damage(
                attacker,
                defender,
                move
            );

        const expected =
            damage *
            v5Accuracy(move);

        const effectiveness =
            v5Effectiveness(
                move,
                attacker,
                defender
            );

        /* ==========================================
           KO
           ========================================== */

        if (
            damage >=
            v5Hp(defender)
        ) {

            score +=
                100000;

        } else if (
            damage * 2 >=
            v5Hp(defender)
        ) {

            score +=
                2200;

        } else {

            score +=
                expected *
                8;
        }

        /* ==========================================
           タイプ相性
           ========================================== */

        if (effectiveness >= 2) {
            score += 450;
        }

        if (effectiveness === 0) {
            score -= 10000;
        }

        /* ==========================================
           先制技
           ========================================== */

        const priority =
            v5Num(
                move.priority,
                0
            );

        if (priority > 0) {

            if (
                v5Hp(defender) <=
                damage
            ) {
                score += 10000;
            } else {
                score += 120;
            }
        }

        /* ==========================================
           速度関係
           ========================================== */

        const mySpeed =
            v5Num(
                attacker.speed ??
                attacker.baseSpeed,
                0
            ) *
            v5StageMultiplier(
                v5StatStage(
                    attacker,
                    "speed"
                )
            );

        const enemySpeed =
            v5Num(
                defender.speed ??
                defender.baseSpeed,
                0
            ) *
            v5StageMultiplier(
                v5StatStage(
                    defender,
                    "speed"
                )
            );

        if (
            priority <= 0 &&
            mySpeed >= enemySpeed
        ) {
            score += 100;
        }

        /* ==========================================
           HP差
           ========================================== */

        score +=
            (
                v5HpRatio(defender) -
                v5HpRatio(attacker)
            ) * 250;

        /* ==========================================
           状態異常・補助技
           ========================================== */

        score +=
            v5StatusScore(
                move,
                attacker,
                defender
            );

        /* ==========================================
           反動・能力下降の警戒
           ========================================== */

        if (
            move.self &&
            Array.isArray(move.self.stats)
        ) {

            for (
                const effect
                of move.self.stats
            ) {

                if (
                    v5Num(
                        effect.stage,
                        0
                    ) < 0
                ) {

                    score -=
                        Math.abs(
                            v5Num(
                                effect.stage,
                                0
                            )
                        ) * 140;
                }
            }
        }

        /* ==========================================
           りゅうせいぐん系
           ========================================== */

        if (
            name === "りゅうせいぐん" ||
            name === "サイコブースト"
        ) {

            /*
             * KOできるなら能力下降を許容。
             * KOできないなら連打性能をかなり下げる。
             */
            if (
                damage <
                v5Hp(defender)
            ) {

                score -=
                    260;
            }
        }

        /* ==========================================
           インファイト
           ========================================== */

        if (
            name === "インファイト"
        ) {

            if (
                damage <
                v5Hp(defender)
            ) {

                score -=
                    180;
            }
        }

        /* ==========================================
           ミスによる危険
           ========================================== */

        if (
            v5Accuracy(move) < 1
        ) {

            score *=
                (
                    0.65 +
                    0.35 *
                    v5Accuracy(move)
                );
        }

        return score;
    }

    /* ========================================================
       盤面評価
       ======================================================== */

    function v5BoardScore(
        attacker,
        defender,
        attackerTeam,
        defenderTeam
    ) {

        let score = 0;

        if (!attacker || !defender) {
            return -Infinity;
        }

        /* ==========================================
           現在HP
           ========================================== */

        score +=
            v5HpRatio(attacker) *
            700;

        score -=
            v5HpRatio(defender) *
            700;

        /* ==========================================
           生存数
           ========================================== */

        if (Array.isArray(attackerTeam)) {

            for (const p of attackerTeam) {

                if (v5Alive(p)) {
                    score += 420;
                }
            }
        }

        if (Array.isArray(defenderTeam)) {

            for (const p of defenderTeam) {

                if (v5Alive(p)) {
                    score -= 420;
                }
            }
        }

        /* ==========================================
           能力ランク
           ========================================== */

        const offensiveStats = [
            "attack",
            "spAttack",
            "speed"
        ];

        for (
            const stat
            of offensiveStats
        ) {

            score +=
                v5StatStage(
                    attacker,
                    stat
                ) * 45;

            score -=
                v5StatStage(
                    defender,
                    stat
                ) * 45;
        }

        /* ==========================================
           状態異常
           ========================================== */

        if (
            attacker.status ||
            attacker.paralysis ||
            attacker.burn ||
            attacker.poison
        ) {
            score -= 180;
        }

        if (
            defender.status ||
            defender.paralysis ||
            defender.burn ||
            defender.poison
        ) {
            score += 180;
        }

        /* ==========================================
           みがわり
           ========================================== */

        if (attacker.hasSubstitute) {
            score += 150;
        }

        if (defender.hasSubstitute) {
            score -= 150;
        }

        /* ==========================================
           即時KO可能性
           ========================================== */

        const myDamage =
            v5ExpectedBestDamage(
                attacker,
                defender
            );

        const enemyDamage =
            v5ExpectedBestDamage(
                defender,
                attacker
            );

        if (
            myDamage >=
            v5Hp(defender)
        ) {
            score += 900;
        }

        if (
            enemyDamage >=
            v5Hp(attacker)
        ) {
            score -= 900;
        }

        return score;
    }

    /* ========================================================
       相手の最善手を読む
       ======================================================== */

    function v5FindBestEnemyResponse(
        attacker,
        defender
    ) {

        const moves =
            v5Moves(
                attacker,
                defender
            );

        if (moves.length === 0) {
            return null;
        }

        let best = null;
        let bestScore = -Infinity;

        for (const move of moves) {

            const result =
                v5SimulateMove(
                    attacker,
                    defender,
                    move
                );

            const score =
                v5ActionScore(
                    attacker,
                    defender,
                    move
                );

            if (
                score >
                bestScore
            ) {

                bestScore =
                    score;

                best = {
                    move,
                    result,
                    score
                };
            }
        }

        return best;
    }

    /* ========================================================
       3手先読み
       ======================================================== */

    function v5Search(
        attacker,
        defender,
        attackerTeam,
        defenderTeam,
        depth,
        maximizing
    ) {

        if (
            !v5Alive(attacker) ||
            !v5Alive(defender)
        ) {

            if (!v5Alive(defender)) {
                return 100000;
            }

            if (!v5Alive(attacker)) {
                return -100000;
            }

            return 0;
        }

        if (depth <= 0) {

            return v5BoardScore(
                attacker,
                defender,
                attackerTeam,
                defenderTeam
            );
        }

        const moves =
            v5Moves(
                attacker,
                defender
            );

        if (moves.length === 0) {

            return v5BoardScore(
                attacker,
                defender,
                attackerTeam,
                defenderTeam
            );
        }

        /*
         * まず有力な技だけ残す。
         * これによって3手先読みでも重くなりにくい。
         */

        const ranked =
            moves
                .map(move => ({
                    move,
                    score:
                        v5ActionScore(
                            attacker,
                            defender,
                            move
                        )
                }))
                .sort(
                    (a, b) =>
                        b.score -
                        a.score
                )
                .slice(
                    0,
                    AI_V5.beamWidth
                );

        let best =
            maximizing
                ? -Infinity
                : Infinity;

        for (const item of ranked) {

            const move =
                item.move;

            const result =
                v5SimulateMove(
                    attacker,
                    defender,
                    move
                );

            let value;

            if (
                !v5Alive(
                    result.defender
                )
            ) {

                value =
                    100000 +
                    (
                        10000 *
                        depth
                    );

            } else {

                value =
                    v5Search(
                        result.defender,
                        result.attacker,
                        defenderTeam,
                        attackerTeam,
                        depth - 1,
                        !maximizing
                    );

                value +=
                    item.score * 0.35;
            }

            if (maximizing) {

                best =
                    Math.max(
                        best,
                        value
                    );

            } else {

                best =
                    Math.min(
                        best,
                        value
                    );
            }
        }

        return best;
    }

    /* ========================================================
       V5 最終技選択
       ======================================================== */

    function v5ChooseMove(
        attacker,
        defender
    ) {

        const moves =
            v5Moves(
                attacker,
                defender
            );

        if (
            moves.length === 0
        ) {
            return null;
        }

        const attackerTeam =
            Array.isArray(
                opponentTeam
            )
                ? opponentTeam
                : [];

        const defenderTeam =
            Array.isArray(
                playerTeam
            )
                ? playerTeam
                : [];

        const candidates =
            moves
                .map(move => ({
                    move,
                    immediate:
                        v5ActionScore(
                            attacker,
                            defender,
                            move
                        )
                }))
                .sort(
                    (a, b) =>
                        b.immediate -
                        a.immediate
                )
                .slice(
                    0,
                    AI_V5.beamWidth
                );

        let bestMove =
            candidates[0].move;

        let bestScore =
            -Infinity;

        for (const candidate of candidates) {

            const move =
                candidate.move;

            const result =
                v5SimulateMove(
                    attacker,
                    defender,
                    move
                );

            let score =
                candidate.immediate;

            if (
                !v5Alive(
                    result.defender
                )
            ) {

                score +=
                    100000;

            } else {

                /*
                 * この技を使った後、
                 * 相手が最善手を使った場合を読む。
                 */

                const enemyResponse =
                    v5FindBestEnemyResponse(
                        result.defender,
                        result.attacker
                    );

                if (enemyResponse) {

                    const afterEnemy =
                        enemyResponse.result;

                    if (
                        !v5Alive(
                            afterEnemy.defender
                        )
                    ) {

                        score -=
                            90000;

                    } else {

                        score +=
                            v5BoardScore(
                                afterEnemy.defender,
                                afterEnemy.attacker,
                                defenderTeam,
                                attackerTeam
                            ) *
                            0.75;
                    }
                }

                /*
                 * さらにもう1手。
                 */

                score +=
                    v5Search(
                        result.defender,
                        result.attacker,
                        defenderTeam,
                        attackerTeam,
                        2,
                        false
                    ) *
                    0.45;
            }

            if (
                score >
                bestScore
            ) {

                bestScore =
                    score;

                bestMove =
                    move;
            }
        }

        return bestMove;
    }

    /* ========================================================
       V5 交代評価
       ======================================================== */

    function v5ChooseSwitch() {

        if (
            !Array.isArray(
                opponentTeam
            )
        ) {
            return -1;
        }

        if (
            typeof opponentActiveIndex !==
            "number"
        ) {
            return -1;
        }

        let bestIndex = -1;
        let bestScore = -Infinity;

        for (
            let i = 0;
            i < opponentTeam.length;
            i++
        ) {

            if (
                i ===
                opponentActiveIndex
            ) {
                continue;
            }

            const candidate =
                opponentTeam[i];

            if (
                !v5Alive(candidate)
            ) {
                continue;
            }

            let score = 0;

            /* ======================================
               相手の攻撃を受けたとき
               ====================================== */

            const incoming =
                v5ExpectedBestDamage(
                    playerPokemon,
                    candidate
                );

            score -=
                incoming /
                v5MaxHp(candidate) *
                800;

            /* ======================================
               こちらが相手に与えるダメージ
               ====================================== */

            const outgoing =
                v5ExpectedBestDamage(
                    candidate,
                    playerPokemon
                );

            score +=
                outgoing /
                v5MaxHp(playerPokemon) *
                850;

            /* ======================================
               KOできるなら非常に高評価
               ====================================== */

            if (
                outgoing >=
                v5Hp(playerPokemon)
            ) {
                score +=
                    25000;
            }

            /* ======================================
               相性
               ====================================== */

            const candidateMoves =
                v5Moves(
                    candidate,
                    playerPokemon
                );

            for (
                const move
                of candidateMoves
            ) {

                if (!move.power) {
                    continue;
                }

                const eff =
                    v5Effectiveness(
                        move,
                        candidate,
                        playerPokemon
                    );

                if (eff >= 2) {
                    score += 300;
                }

                if (eff === 0) {
                    score -= 100;
                }
            }

            /* ======================================
               HP
               ====================================== */

            score +=
                v5HpRatio(candidate) *
                300;

            if (
                candidate.status ||
                candidate.paralysis ||
                candidate.burn ||
                candidate.poison
            ) {
                score -= 120;
            }

            if (
                score >
                bestScore
            ) {

                bestScore =
                    score;

                bestIndex =
                    i;
            }
        }

        return bestIndex;
    }

    /* ========================================================
       交代するべきか
       ======================================================== */

    function v5ShouldSwitch() {

        if (
            !opponentPokemon ||
            !playerPokemon
        ) {
            return false;
        }

        const hp =
            v5HpRatio(
                opponentPokemon
            );

        const incoming =
            v5ExpectedBestDamage(
                playerPokemon,
                opponentPokemon
            );

        const lethal =
            incoming >=
            v5Hp(opponentPokemon);

        const switchIndex =
            v5ChooseSwitch();

        if (
            switchIndex < 0
        ) {
            return false;
        }

        /*
         * HPが少なく、交代先の方が明らかに有利
         */
        if (
            hp <= 0.30 &&
            lethal
        ) {
            return true;
        }

        /*
         * 相手からの攻撃で大ダメージを受ける
         */
        if (
            incoming >=
            v5MaxHp(opponentPokemon) *
            0.55
        ) {

            const candidate =
                opponentTeam[
                    switchIndex
                ];

            const candidateIncoming =
                v5ExpectedBestDamage(
                    playerPokemon,
                    candidate
                );

            if (
                candidateIncoming <
                incoming * 0.65
            ) {
                return true;
            }
        }

        return false;
    }

    /* ========================================================
       既存AIをV5に接続
       ======================================================== */

    const oldGetOpponentMove =
        typeof getOpponentMove ===
        "function"
            ? getOpponentMove
            : null;

    window.getOpponentMove =
        function () {

            /*
             * easyは完全ランダムを維持。
             */
            if (
                typeof difficulty !==
                "undefined" &&
                difficulty === "easy"
            ) {

                if (
                    oldGetOpponentMove
                ) {
                    return oldGetOpponentMove();
                }

                return null;
            }

            try {

                const move =
                    v5ChooseMove(
                        opponentPokemon,
                        playerPokemon
                    );

                if (move) {

                    console.log(
                        "[AI V5] selected:",
                        move.name
                    );

                    return move;
                }

            } catch (error) {

                console.error(
                    "[AI V5] move error:",
                    error
                );
            }

            /*
             * V5で何か問題が起きても
             * ゲームそのものを止めない。
             */

            if (
                oldGetOpponentMove
            ) {
                return oldGetOpponentMove();
            }

            return null;
        };

    /* ========================================================
       shouldOpponentSwitch
       ======================================================== */

    window.shouldOpponentSwitch =
        function () {

            if (
                typeof difficulty !==
                "undefined" &&
                difficulty === "easy"
            ) {
                return false;
            }

            try {

                return v5ShouldSwitch();

            } catch (error) {

                console.error(
                    "[AI V5] switch error:",
                    error
                );

                return false;
            }
        };

    /* ========================================================
       chooseBestOpponentSwitch
       ======================================================== */

    window.chooseBestOpponentSwitch =
        function () {

            try {

                const index =
                    v5ChooseSwitch();

                console.log(
                    "[AI V5] switch:",
                    index
                );

                return index;

            } catch (error) {

                console.error(
                    "[AI V5] switch selection error:",
                    error
                );

                return -1;
            }
        };

    /* ========================================================
       デバッグ用
       ======================================================== */

    window.AI_V5_DEBUG = {

        chooseMove:
            v5ChooseMove,

        chooseSwitch:
            v5ChooseSwitch,

        shouldSwitch:
            v5ShouldSwitch,

        damage:
            v5Damage,

        actionScore:
            v5ActionScore,

        boardScore:
            v5BoardScore,

        search:
            v5Search
    };

    console.log(
        "%c[ULTIMATE AI V5] Virtual Battle Simulator loaded.",
        "font-weight:bold;"
    );

})();
// ============================================================
// ULTIMATE AI V6
// 仮想盤面シミュレーションAI
//
// V6:
// ・仮想ポケモンを作成
// ・HPを仮想的に減らす
// ・状態異常を仮想適用
// ・能力ランクを仮想適用
// ・みがわりを仮想適用
// ・まもるを仮想適用
// ・回復を仮想適用
// ・天候/フィールドを仮想評価
// ・持ち物を仮想評価
// ・能力を仮想評価
// ・KO / 2HKO / 3HKO
// ・素早さ
