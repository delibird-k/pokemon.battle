    <style>
        body {
            font-family: 'Press+Start+2P', cursive;
            touch-action: manipulation;
        }
        .sub-marker {
        display: none;
        background: #98FB98;
        color: block;
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 4px;
        margin-top: 2px;
    }
        .nes-container {
            border: 4px solid black;
            border-radius: 8px;
            box-shadow: 0 6px 0 black;
        }
        .hp-bar-container {
            background-color: #e5e7eb;
            border: 2px solid #1f2937;
            border-radius: 8px;
            overflow: hidden;
            height: 20px;
        }
        .hp-bar {
            height: 100%;
            transition: width 1.1s ease-in-out; /* HPの減少速度を調整 */
            background-color: #22c55e;
        }
        .hp-bar.low {
            background-color: #facc15;
        }
        .hp-bar.critical {
            background-color: #ef4444;
        }
        .sprite-shake {
            animation: shake 0.5s;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .pokemon-card, .item-card, .difficulty-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .pokemon-card:hover, .item-card:hover, .difficulty-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 8px black;
        }
        .sprite-faint {
            transition: opacity 1s ease-out, transform 1s ease-out;
            opacity: 0;
            transform: translateY(50px);
        }
        #screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-in;
            z-index: 20;
        }
        #screen-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .status-badge {
            font-size: 0.6rem;
            padding: 2px 4px;
            border-radius: 4px;
            color: white;
            margin-left: 4px;
        }
        body {
    background-image: url("sensyutu.png");
    background-size: cover;        /* 画面いっぱいに表示 */
    background-position: center;   /* 中央に配置 */
    background-repeat: no-repeat;  /* 繰り返さない */
    background-attachment: fixed;  /* スクロールしても固定 */
}
        .text-outline {
    color: white;
    text-shadow:
        1px 0 black,
       -1px 0 black,
        0 1px black,
        0 -1px black;
}
        #selection-screen,
#item-selection-screen,
#opponent-selection-screen,
#opponent-item-selection-screen,
#difficulty-selection-screen{
    background: transparent !important;
}
            #battle-screen{
        background-image: url("kusa.jpeg");
        background-size: cover;
        background-position: center;
    }
    </style>

// ===== 威力計算 =====
function getZPower(basePower) {
  if (basePower <= 55) return 100;
  if (basePower <= 60) return 120;
  if (basePower <= 70) return 140;  
  if (basePower <= 80) return 160;
  if (basePower <= 90) return 175;
  if (basePower <= 100) return 180;
  if (basePower <= 110) return 185;
  if (basePower <= 120) return 190;
  if (basePower <= 130) return 195;
  return 200;
}

// ===== 初期化時に呼ぶ（重要）=====
function initZData(pokemon) {
  const firstMove = pokemon.moves[0];

  if (!firstMove) {
    pokemon.zMoveBase = null;
    return;
  }

  if (firstMove.category !== "physical" && firstMove.category !== "special" && firstMove.category !== "status") {
    pokemon.zMoveBase = null;
    return;
  }

  pokemon.zMoveBase = {
    type: firstMove.type,
    power: firstMove.power,
    category: firstMove.category
  };
}

// ===== 使用可能判定 =====
function canUseZMove(pokemon) {
    return (
        !pokemon.usedZMove &&
        pokemon.item?.name === "Zクリスタル"
    );
}

function canMegaEvolve(pokemon) {
    if (pokemon.megaEvolved) return false;

    const mega = MEGA_DATA[pokemon.name];
    if (!mega) return false;

    return pokemon.item?.name === mega.stone;
}
    

function createZMove(move) {

    if (move.category === "status") {
        return {
            name: move.name,
            type: move.type,
            power: 0,
            accuracy: 999,
            category: "status",
            priority: move.priority || 0,   
            pp: 1,
            currentPp: 1,
            isZMove: true
        };
    }

    if (
        move.category !== "physical" &&
        move.category !== "special"
    ) return null;

    return {
        name: Z_MOVE_NAMES[move.type],
        type: move.type,
        power: getZPower(move.power),
        accuracy: 999,
        category: move.category,
        pp:1,
        currentPp:1,
        isZMove:true
    };
}

function useZMove(pokemon){

    if(
        pokemon.usedZMove ||
        !pokemon.selectedZMove
    ) return null;

    pokemon.usedZMove=true;

    return createZMove(
        pokemon.selectedZMove
    );
}

};

        instance.hasSubstitute = false;

    function calculateStats(basePokemon) {
        const level = 50;
        const pokemon = { ...basePokemon };
        
        const ivs = { hp: 31, attack: 31, defense: 31, spAttack: 31, spDefense: 31, speed: 31 };
        if (basePokemon.baseSpAttack > basePokemon.baseAttack) { ivs.attack = 0; }

        const defaultEVs = {
            hp: 4,
            atk: basePokemon.baseAttack >= basePokemon.baseSpAttack ? 252 : 0,
            def: 0,
            spa: basePokemon.baseSpAttack > basePokemon.baseAttack ? 252 : 0,
            spd: 0,
            spe: 252
        };
        const evs = { ...defaultEVs, ...basePokemon.evs };
        pokemon.maxHp = Math.floor(((2 * basePokemon.baseHp + ivs.hp + Math.floor(evs.hp / 4)) * level) / 100) + level + 10;
        const calcOtherStat = (base, iv, ev) => Math.floor((((2 * base + iv + Math.floor(ev / 4)) * level) / 100) + 5);
        pokemon.attack = calcOtherStat(basePokemon.baseAttack, ivs.attack, evs.atk);
        pokemon.defense = calcOtherStat(basePokemon.baseDefense, ivs.defense, evs.def);
        pokemon.spAttack = calcOtherStat(basePokemon.baseSpAttack, ivs.spAttack, evs.spa);
        pokemon.spDefense = calcOtherStat(basePokemon.baseSpDefense, ivs.spDefense, evs.spd);
        pokemon.speed = calcOtherStat(basePokemon.baseSpeed, ivs.speed, evs.spe);
       const nature = natures[pokemon.nature];

if (nature) {
    if (nature.up) {
        pokemon[nature.up] = Math.floor(pokemon[nature.up] * 1.1);
    }
    if (nature.down) {
        pokemon[nature.down] = Math.floor(pokemon[nature.down] * 0.9);
    }
}
        return pokemon;
    }

    element.textContent = text.trim();
}

    opponentItemSelectionTitle.textContent =
        `${currentOpponentPokemon ? currentOpponentPokemon.name : "ポケモン"}の もちものを えらんでくれ！`;

    for (const key in items) {

        const item = items[key];

        const card = document.createElement('button');

        card.className =
            "nes-container bg-white p-4 text-center cursor-pointer item-card w-48";

        card.onclick = () =>
            handleOpponentItemSelect(item.name);

        card.innerHTML = `
            <p class="text-sm font-bold">
                ${item.name}
            </p>

            <p class="mt-2 text-xs">
                ${item.description}
            </p>
        `;

        opponentItemSelectionGrid.appendChild(card);
    }
}
    
function handleOpponentItemSelect(itemName) {

    selectedOpponentItemNames.push(itemName);

    currentOpponentItemIndex++;

    // まだ3匹分の持ち物を選んでいない
    if (currentOpponentItemIndex < 3) {
        showOpponentItemSelection();
        return;
    }

    // 3匹分選び終わった
    showDifficultySelection();
}
    
    function showDifficultySelection() {
        opponentSelectionScreen.style.display = 'none';
        opponentItemSelectionScreen.style.display = 'none';
        difficultySelectionScreen.style.display = 'block';

        difficultySelectionGrid.innerHTML = '';
        for (const key in difficulties) {
            const diff = difficulties[key];
            const card = document.createElement('button');
            card.className = "nes-container bg-white p-4 text-center cursor-pointer difficulty-card w-48";
            card.onclick = () => startGame(key);
            card.innerHTML = `<p class="text-sm font-bold">${diff.name}</p><p class="mt-2 text-xs">${diff.description}</p>`;
            difficultySelectionGrid.appendChild(card);
        }
    }

    function resetStatDisplays() {
    document.getElementById('player-stat-display').textContent = '';
    document.getElementById('opponent-stat-display').textContent = '';
}
    
function startGame(difficultyLevel) {
    difficulty = difficultyLevel;

    // 新しい試合なのでステルスロックをリセット
    playerStealthRock = false;
    opponentStealthRock = false;

    // ========================================================
    // 3匹のチームを作成
    // ========================================================

    playerTeam = selectedPlayerKeys.map((key, index) => {

        const pokemon = createPokemonInstance(
            pokemonBaseData[key]
        );

        pokemon.item = {
            name: selectedPlayerItemNames[index],
            used: false
        };

        pokemon.usedZMove = false;
        pokemon.pendingMega = false;
        pokemon.megaEvolved = false;

        applyIllusion(pokemon);
        initZData(pokemon);

        return pokemon;
    });

    opponentTeam = selectedOpponentKeys.map((key, index) => {

        const pokemon = createPokemonInstance(
            pokemonBaseData[key]
        );

        const itemName =
            selectedOpponentItemNames[index] === 'random'
                ? determineOpponentItem(
                    pokemonBaseData[key]
                )
                : selectedOpponentItemNames[index];

        pokemon.item = {
            name: itemName,
            used: false
        };

        pokemon.usedZMove = false;
        pokemon.pendingMega = false;
        pokemon.megaEvolved = false;

        applyIllusion(pokemon);
        initZData(pokemon);

        return pokemon;
    });


    // ========================================================
    // 最初に場に出すポケモン
    // ========================================================

    playerActiveIndex = 0;
    opponentActiveIndex = 0;

    playerPokemon = playerTeam[playerActiveIndex];
    opponentPokemon = opponentTeam[opponentActiveIndex];


    // ========================================================
    // バトル画面
    // ========================================================

    difficultySelectionScreen.style.display = 'none';
    battleScreen.style.display = 'block';

    const bg =
        backgroundImages[
            Math.floor(
                Math.random() *
                backgroundImages.length
            )
        ];

    battleScreen.style.backgroundImage =
        `url('${bg}')`;


    // ========================================================
    // UI初期化
    // ========================================================

    resetStatDisplays();

    initBattleUI();

    updateSubstituteMarkers();

    startBattleSequence();

    updateRating();

    updateRatingDisplay();
}

    function applyIllusion(pokemon) {

    if (pokemon.ability !== "イリュージョン")
        return;

    const candidates =
        Object.values(pokemonBaseData).filter(
            p =>
                p.name !== "ゾロアーク" &&
                p.name !== "ヒスイゾロアーク"
        );

    pokemon.disguiseData =
        candidates[
            Math.floor(
                Math.random() * candidates.length
            )
        ];
}
    
    function has4xWeakness(types) {
        for (const attackingType in typeChart) {
            let totalMultiplier = 1;
            types.forEach(defendingType => {
                totalMultiplier *= typeChart[attackingType]?.[defendingType] ?? 1;
            });
            if (totalMultiplier >= 4) {
                return true;
            }
        }
        return false;
    }

    function getSpriteUrl(pokemon, back = false) {
        if (pokemon.megaEvolved && pokemon.megaSpriteFront) {
            return back ? pokemon.megaSpriteBack : pokemon.megaSpriteFront;
        }
        if (pokemon.disguiseBroken && pokemon.bustedSpriteFront) {
            return back ? pokemon.bustedSpriteBack : pokemon.bustedSpriteFront;
        }
        if (typeof pokemon.id === 'string') {
             const baseUrl = "https://play.pokemonshowdown.com/sprites/";
             const folder = back ? "ani-back" : "ani";
             const shiny = pokemon.isShiny ? "-shiny" : "";
             return `${baseUrl}${folder}${shiny}/${pokemon.id}.gif`;
        } else {
             const shinyFolder = pokemon.isShiny ? 'shiny/' : '';
             const backFolder = back ? 'back/' : '';
             return `${POKE_API_BASE_URL}${backFolder}${shinyFolder}${pokemon.id}.gif`;
        }
    }

    function generateEffectDescription(secondary) {

function showUTurnSwitchSelection() {
    return new Promise((resolve) => {

        battleMenu.style.display = "none";
        movesContainer.style.display = "grid";

        movesContainer.classList.remove("grid-cols-2");
        movesContainer.classList.add("grid-cols-3");

        movesContainer.innerHTML = "";

        playerTeam.forEach((pokemon, index) => {

            // 今出ているポケモンは選べない
            if (index === playerActiveIndex) {
                return;
            }

            // 瀕死も選べない
            if (pokemon.currentHp <= 0) {
                return;
            }

            const button = document.createElement("button");

            button.className =
                "border-2 border-gray-800 rounded p-2 bg-green-200 hover:bg-green-300";

            const hpRate =
                pokemon.maxHp > 0
                    ? Math.floor(
                        pokemon.currentHp /
                        pokemon.maxHp *
                        100
                    )
                    : 0;

            button.innerHTML = `
                <div class="font-bold">
                    ${pokemon.name}
                </div>

                <div class="text-xs mt-1">
                    HP ${pokemon.currentHp} / ${pokemon.maxHp}
                </div>

                <div class="text-xs">
                    ${hpRate}%
                </div>
            `;

            button.onclick = async () => {

                button.disabled = true;

                await executeUTurnSwitch(index);

                resolve();
            };

            movesContainer.appendChild(button);
        });
    });
}

// AI：通常ターンの交代判断

function shouldOpponentSwitch() {

    // 交代先を選ぶ
    const nextIndex = chooseBestOpponentSwitch();

    if (nextIndex === -1) {
        return false;
    }

    const nextPokemon =
        opponentTeam[nextIndex];

    // 現在のポケモンがプレイヤーを確定KOできるなら
    // 無理に交代しない
    const currentBestAttack =
        getAIBestAttack(
            opponentPokemon,
            playerPokemon
        );

    if (
        currentBestAttack &&
        currentBestAttack.damage >=
        playerPokemon.currentHp
    ) {
        return false;
    }

    // 現在のポケモンが受ける最大ダメージ
    const currentIncoming =
        getAIBestAttack(
            playerPokemon,
            opponentPokemon
        );

    if (!currentIncoming) {
        return false;
    }

    // 交代先が受ける最大ダメージ
    const nextIncoming =
        getAIBestAttack(
            playerPokemon,
            nextPokemon
        );

    // 交代先が出た瞬間に倒されるなら交代しない
    if (
        nextIncoming &&
        nextIncoming.damage >=
        nextPokemon.currentHp
    ) {
        return false;
    }

    // 現在のポケモンの攻撃性能
    const currentOffense =
        currentBestAttack
            ? currentBestAttack.expected
            : 0;

    // 交代先の攻撃性能
    const nextBestAttack =
        getAIBestAttack(
            nextPokemon,
            playerPokemon
        );

    const nextOffense =
        nextBestAttack
            ? nextBestAttack.expected
            : 0;

    const currentDamage =
        currentIncoming.expected;

    const nextDamage =
        nextIncoming
            ? nextIncoming.expected
            : 0;

    // ========================================================
    // 交代条件
    // ========================================================
    //
    // 現在のポケモンがかなり不利
    // ＋
    // 交代先のほうが被ダメージを大きく抑えられる
    // ＋
    // 交代先にも攻撃手段がある
    //
    if (
        currentDamage >=
            opponentPokemon.currentHp * 0.30 &&
        nextDamage <=
            currentDamage * 0.65 &&
        nextOffense >=
            currentOffense * 0.85
    ) {
        return true;
    }

    return false;
}

    if (
        attacker?.ability === "スカイスキン" &&
        types.includes("ノーマル") &&
        move.category !== "status"
    ) {
        types = types.map(t =>
            t === "ノーマル" ? "ひこう" : t
        );
    }

    // フェアリースキン
    if (
        attacker?.ability === "フェアリースキン" &&
        types.includes("ノーマル") &&
        move.category !== "status"
    ) {
        types = types.map(t =>
            t === "ノーマル" ? "フェアリー" : t
        );
    }

    return [...new Set(types)];
}


function getAIMoveType(move, attacker) {
    return getAIMoveTypes(move, attacker)[0] ?? move?.type;
}


// ============================================================
// AI：タイプ相性
// 実戦側の多タイプ技の挙動に合わせて
// 「技側のタイプのうち最も有効なもの」を採用
// ============================================================

function getAITypeEffectiveness(move, attackerOrDefender, maybeDefender) {

    let attacker;
    let defender;

    // 旧形式
    if (maybeDefender === undefined) {
        attacker = opponentPokemon;
        defender = attackerOrDefender;
    } else {
        attacker = attackerOrDefender;
        defender = maybeDefender;
    }

    if (!move || !defender) return 1;

    const moveTypes =
        getAIMoveTypes(move, attacker);

    const defenderTypes =
        Array.isArray(defender.types)
            ? defender.types
            : [defender.types];

    let best = 0;

    for (const moveType of moveTypes) {

        // ふゆう
        if (
            moveType === "じめん" &&
            defender.ability === "ふゆう"
        ) {
            continue;
        }

        // ちくでん
        if (
            moveType === "でんき" &&
            defender.ability === "ちくでん"
        ) {
            continue;
        }

        // コンデンサー
        if (
            moveType === "でんき" &&
            defender.ability === "コンデンサー"
        ) {
            continue;
        }

        let multiplier = 1;

        for (const defenderType of defenderTypes) {
            multiplier *=
                typeChart[moveType]?.[defenderType] ?? 1;
        }

        // きもったま
        if (
            multiplier === 0 &&
            attacker?.ability === "きもったま" &&
            defenderTypes.includes("ゴースト") &&
            (
                moveType === "ノーマル" ||
                moveType === "かくとう"
            )
        ) {
            multiplier = 1;
        }

        best = Math.max(best, multiplier);
    }

    return best;
}


// ============================================================
// AI：実質ステータス
// ============================================================

function getAIEffectiveStat(pokemon, statName) {

    if (!pokemon) return 1;

    const stat =
        Number(pokemon[statName] ?? 1);

    const stage =
        Number(
            pokemon.statStages?.[statName] ?? 0
        );

    return Math.max(
        1,
        stat * getStatModifier(stage)
    );
}


// ============================================================
// AI：命中率
// ============================================================

function getAIAccuracy(move) {

    if (!move) return 0;

    if (
        move.accuracy === undefined ||
        move.accuracy === null ||
        move.accuracy >= 101
    ) {
        return 1;
    }

    return Math.max(
        0,
        Math.min(1, move.accuracy / 100)
    );
}


// ============================================================
// AI：技の期待ダメージ
// ============================================================

function getAIDamage(move, attacker, defender) {

    if (
        !move ||
        move.category === "status" ||
        !move.power
    ) {
        return 0;
    }

    if (!attacker || !defender) {
        return 0;
    }

    const moveTypes =
        getAIMoveTypes(move, attacker);

    if (moveTypes.length === 0) {
        return 0;
    }

    const effectiveness =
        getAITypeEffectiveness(
            move,
            attacker,
            defender
        );

    if (effectiveness <= 0) {
        return 0;
    }

    let power =
        Number(move.power);

    // すいりゅうれんだ
    if (move.name === "すいりゅうれんだ") {
        power = 75;
    }

    // コンデンサー
    if (
        attacker.ability === "コンデンサー" &&
        move.power <= 100
    ) {
        power *= 1.5;
    }

    if (
        attacker.ability === "コンデンサー" &&
        (
            moveTypes.includes("でんき") ||
            moveTypes.includes("はがね")
        )
    ) {
        power *= 2;
    }

    // ブレインフォース
    if (
        attacker.ability === "ブレインフォース"
    ) {
        power *= 1.25;
    }

    // アナライズ
    if (
        attacker.ability === "アナライズ" &&
        move.category === "special"
    ) {
        power *= 1.3;
    }

    // マルチタイプ
    if (
        attacker.ability === "マルチタイプ" &&
        move.power <= 70
    ) {
        power *= 1.5;
    }

    // スカイスキン
    if (
        attacker.ability === "スカイスキン" &&
        moveTypes.includes("ひこう") &&
        move.type === "ノーマル"
    ) {
        power *= 1.2;
    }

    // フェアリースキン
    if (
        attacker.ability === "フェアリースキン" &&
        moveTypes.includes("フェアリー") &&
        move.type === "ノーマル"
    ) {
        power *= 1.2;
    }

    // こんじょう
    if (
        attacker.ability === "こんじょう" &&
        attacker.status &&
        attacker.status !== "none" &&
        move.category === "physical"
    ) {
        power *= 1.5;
    }
    else if (
        attacker.status === "burn" &&
        move.category === "physical" &&
        move.name !== "ボディプレス"
    ) {
        power *= 0.5;
    }

    // 天候
    if (
        typeof weather !== "undefined" &&
        weather
    ) {

        if (weather.type === "rain") {

            if (moveTypes.includes("みず")) {
                power *= 1.5;
            }

            if (moveTypes.includes("ほのお")) {
                power *= 0.5;
            }
        }

        if (weather.type === "sun") {

            if (moveTypes.includes("ほのお")) {
                power *= 1.5;
            }

            if (moveTypes.includes("みず")) {
                power *= 0.5;
            }
        }
    }

    // フィールド
    if (
        typeof field !== "undefined" &&
        field
    ) {

        if (
            field.type === "psyco" &&
            moveTypes.includes("エスパー")
        ) {
            power *= 1.6;
        }

        if (
            field.type === "psyco" &&
            (move.priority ?? 0) > 0
        ) {
            power *= 0.0001;
        }
    }

    let attackStat;
    let defenseStat;

    if (move.name === "ボディプレス") {

        attackStat =
            getAIEffectiveStat(
                attacker,
                "defense"
            );

    }
    else if (move.category === "special") {

        attackStat =
            getAIEffectiveStat(
                attacker,
                "spAttack"
            );

    }
    else {

        attackStat =
            getAIEffectiveStat(
                attacker,
                "attack"
            );
    }

    if (move.name === "ボディプレス") {

        defenseStat =
            getAIEffectiveStat(
                defender,
                "defense"
            );

    }
    else if (move.category === "special") {

        defenseStat =
            getAIEffectiveStat(
                defender,
                "spDefense"
            );

    }
    else {

        defenseStat =
            getAIEffectiveStat(
                defender,
                "defense"
            );
    }

    // 基本ダメージ
    let damage =
        Math.floor(
            Math.floor(
                Math.floor(
                    (
                        (2 * 50 / 5 + 2) *
                        power *
                        attackStat /
                        defenseStat
                    )
                ) / 50
            ) + 2
        );

    // STAB
    const attackerTypes =
        Array.isArray(attacker.types)
            ? attacker.types
            : [attacker.types];

    if (
        moveTypes.some(
            type => attackerTypes.includes(type)
        )
    ) {

        damage *=
            attacker.ability === "てきおうりょく"
                ? 2
                : 1.5;
    }

    // マルチスケイル
    if (
        defender.ability === "マルチスケイル" &&
        defender.currentHp === defender.maxHp &&
        !defender.hasSubstitute
    ) {
        damage *= 0.5;
    }

    // あついしぼう
    if (
        defender.ability === "あついしぼう" &&
        (
            moveTypes.includes("ほのお") ||
            moveTypes.includes("こおり")
        )
    ) {
        damage *= 0.5;
    }

    damage *= effectiveness;

    // ブレインフォース
    if (
        attacker.ability === "ブレインフォース" &&
        effectiveness > 1
    ) {
        damage *= 1.25;
    }

    // オーロラベール
    if (
        defender.auroraVeil &&
        defender.auroraVeil > 0
    ) {
        damage *= 0.5;
    }

    // 平均乱数
    damage *= 0.925;

    return Math.max(
        1,
        Math.floor(damage)
    );
}


// ============================================================
// AI：命中率込み期待ダメージ
// ============================================================

function getAIExpectedDamage(
    move,
    attacker,
    defender
) {

    const damage =
        getAIDamage(
            move,
            attacker,
            defender
        );

    const accuracy =
        getAIAccuracy(move);

    return damage * accuracy;
}


// ============================================================
// AI：KO判定
// ============================================================

function isAIKO(
    move,
    attacker,
    defender
) {

    return (
        getAIDamage(
            move,
            attacker,
            defender
        ) >= defender.currentHp
    );
}


// ============================================================
// AI：何発で倒せるか
// ============================================================

function getAIHitsToKO(
    move,
    attacker,
    defender
) {

    const damage =
        getAIDamage(
            move,
            attacker,
            defender
        );

    if (damage <= 0) {
        return 999;
    }

    return Math.ceil(
        defender.currentHp / damage
    );
}


// ============================================================
// AI：先制判定
// ============================================================

function doesAIMoveGoFirst(
    move,
    attacker,
    defender
) {

    const priority =
        move?.priority ?? 0;

    const defenderBest =
        getAIBestAttack(
            defender,
            attacker
        );

    if (!defenderBest) {
        return priority > 0;
    }

    const defenderPriority =
        defenderBest.move?.priority ?? 0;

    if (priority !== defenderPriority) {
        return priority > defenderPriority;
    }

    return (
        getAIEffectiveStat(
            attacker,
            "speed"
        ) >=
        getAIEffectiveStat(
            defender,
            "speed"
        )
    );
}


// ============================================================
// AI：最強攻撃
// ============================================================

function getAIBestAttack(
    attacker,
    defender
) {

    if (!attacker?.moves) {
        return null;
    }

    const usableMoves =
        attacker.moves.filter(
            move =>
                (move.currentPp ?? 0) > 0 &&
                move.category !== "status" &&
                move.power
        );

    let best = null;

    for (const move of usableMoves) {

        const damage =
            getAIDamage(
                move,
                attacker,
                defender
            );

        const expected =
            getAIExpectedDamage(
                move,
                attacker,
                defender
            );

        if (
            !best ||
            expected > best.expected
        ) {
            best = {
                move,
                damage,
                expected
            };
        }
    }

    return best;
}


// ============================================================
// AI：状態異常評価
// ============================================================

function getAIStatusScore(
    move,
    attacker,
    defender
) {

    if (!move || !move.name) {
        return 0;
    }

    if (
        defender.status &&
        defender.status !== "none"
    ) {
        return -500;
    }

    // どくどく
    if (move.name === "どくどく") {

        if (
            defender.types?.includes("どく") ||
            defender.types?.includes("はがね")
        ) {
            return -1000;
        }

        return 180;
    }

    // でんじは
    if (move.name === "でんじは") {

        if (
            defender.types?.includes("でんき") ||
            defender.types?.includes("じめん")
        ) {
            return -1000;
        }

        // 相手が高速なら価値大
        const speed =
            getAIEffectiveStat(
                defender,
                "speed"
            );

        if (speed >= 100) {
            return 230;
        }

        return 150;
    }

    // 眠り
    if (
        move.name === "ねむりごな" ||
        move.name === "きのこのほうし"
    ) {

        if (
            defender.types?.includes("くさ")
        ) {
            return -1000;
        }

        return 260;
    }

    return 0;
}


// ============================================================
// AI：変化技
// ============================================================

function getAIStatusMoveScore(
    move,
    attacker,
    defender
) {

    if (!move) return -1000;

    const hpRate =
        attacker.currentHp /
        attacker.maxHp;

    let score = 0;

    // めいそう
    if (move.name === "めいそう") {

        if (
            attacker.statStages.spAttack >= 5 ||
            hpRate < 0.35
        ) {
            return -1000;
        }

        score += 100;

        if (
            defender.moves?.some(
                m =>
                    m.category === "special" &&
                    m.power
            )
        ) {
            score += 100;
        }
    }

    // てっぺき
    if (move.name === "てっぺき") {

        if (
            attacker.statStages.defense >= 5 ||
            hpRate < 0.35
        ) {
            return -1000;
        }

        score += 100;

        if (
            defender.moves?.some(
                m =>
                    m.category === "physical" &&
                    m.power
            )
        ) {
            score += 100;
        }
    }

    // つるぎのまい
    if (move.name === "つるぎのまい") {

        if (
            attacker.statStages.attack >= 5 ||
            hpRate < 0.35
        ) {
            return -1000;
        }

        score += 130;

        if (
            getAIBestAttack(
                attacker,
                defender
            )
        ) {
            score += 100;
        }
    }

    // わるだくみ
    if (move.name === "わるだくみ") {

        if (
            attacker.statStages.spAttack >= 5 ||
            hpRate < 0.35
        ) {
            return -1000;
        }

        score += 140;
    }

    // やどりぎ
    if (move.name === "やどりぎのたね") {

        if (
            defender.seeded ||
            defender.types?.includes("くさ")
        ) {
            return -1000;
        }

        score += 180;
    }

    // みがわり
    if (move.name === "みがわり") {

        if (
            attacker.hasSubstitute ||
            hpRate <= 0.30
        ) {
            return -1000;
        }

        score += 90;

        if (
            defender.status &&
            defender.status !== "none"
        ) {
            score += 100;
        }
    }

// まもる
if (move.name === "まもる") {

    // 前のターンに成功したまもるの直後は使わない
    if (attacker.protectUsed) {
        return -1000;
    }

    const enemyBest =
        getAIBestAttack(
            defender,
            attacker
        );

    if (!enemyBest) {
        return 20;
    }

    if (
        enemyBest.damage >=
        attacker.currentHp
    ) {
        score += 450;
    }
    else if (
        hpRate <= 0.30
    ) {
        score += 180;
    }
    else {
        score += 20;
    }
}

    return score;
}


// ============================================================
// AI：反動技
// ============================================================

function getAIRecoilPenalty(
    move,
    attacker
) {

    const recoilMoves = [
        "フレアドライブ",
        "ワイルドボルト",
        "ブレイブバード",
        "もろはのずつき",
        "すてみタックル",
        "ボルテッカー",
        "ウェーブタックル"
    ];

    if (
        !recoilMoves.includes(move.name)
    ) {
        return 0;
    }

    const hpRate =
        attacker.currentHp /
        attacker.maxHp;

    if (hpRate <= 0.20) {
        return 500;
    }

    if (hpRate <= 0.35) {
        return 220;
    }

    return 40;
}


// ============================================================
// AI：攻撃技評価
// ============================================================

function evaluateAIAttack(
    move,
    attacker,
    defender
) {

    const damage =
        getAIDamage(
            move,
            attacker,
            defender
        );

    const expectedDamage =
        getAIExpectedDamage(
            move,
            attacker,
            defender
        );

    if (damage <= 0) {
        return -100000;
    }

    const hp =
        defender.currentHp;

    const myHpRate =
        attacker.currentHp /
        attacker.maxHp;

    const enemyHpRate =
        defender.currentHp /
        defender.maxHp;

    let score = 0;

    // 基本火力
    score += expectedDamage * 2.2;

    // 削ったHPそのもの
    score +=
        (damage / defender.maxHp) *
        1800;

    // 命中率
    score +=
        (getAIAccuracy(move) - 1) *
        500;

    // ========================================================
    // KO
    // ========================================================

    if (damage >= hp) {

        score += 15000;

        // 命中不安定KOは少しだけ下げる
        score +=
            getAIAccuracy(move) * 2500;
    }

    // 2発圏内
    const hits =
        getAIHitsToKO(
            move,
            attacker,
            defender
        );

    if (hits === 2) {
        score += 1200;
    }

    if (hits === 3) {
        score += 350;
    }

    // ========================================================
    // 相手の次の攻撃を考える
    // ========================================================

    const enemyBest =
        getAIBestAttack(
            defender,
            attacker
        );

    if (enemyBest) {

        const enemyDamage =
            enemyBest.damage;

        // 自分が次ターン倒される
        if (
            enemyDamage >=
            attacker.currentHp
        ) {

            // 今の攻撃で相手を倒せるなら問題なし
            if (damage >= hp) {
                score += 10000;
            }
            else {
                score -= 5000;
            }
        }

        // 相手の攻撃を耐えられる
        else {

            const remainingHp =
                attacker.currentHp -
                enemyDamage;

            score +=
                (remainingHp /
                attacker.maxHp) *
                700;
        }
    }

// ========================================================
// 先制技
// ========================================================

if ((move.priority ?? 0) > 0) {

    // 先制技は「先に動ける」だけでは高評価しない
    // 相手を倒せる場合のみ大きく評価
    if (damage >= hp) {
        score += 4000;
    }

    // 相手のHPがかなり少なく、
    // 先制技で倒せる可能性が高い場合のみ評価
    if (
        enemyHpRate <= 0.20 &&
        damage > 0
    ) {
        score += 500;
    }
}

    // ========================================================
    // STAB
    // ========================================================

    const attackerTypes =
        Array.isArray(attacker.types)
            ? attacker.types
            : [attacker.types];

    const moveTypes =
        getAIMoveTypes(
            move,
            attacker
        );

    if (
        moveTypes.some(
            t => attackerTypes.includes(t)
        )
    ) {
        score += 100;
    }

    // ========================================================
    // タイプ相性
    // 「効果抜群だから偉い」だけにはしない
    // KO・生存・期待ダメージを優先
    // ========================================================

    const effectiveness =
        getAITypeEffectiveness(
            move,
            attacker,
            defender
        );

    if (effectiveness === 4) {
        score += 180;
    }
    else if (effectiveness === 2) {
        score += 90;
    }
    else if (effectiveness === 0.5) {
        score -= 50;
    }
    else if (effectiveness === 0.25) {
        score -= 120;
    }

    // ========================================================
    // 反動
    // ========================================================

    score -=
        getAIRecoilPenalty(
            move,
            attacker
        );

    // ========================================================
    // HP差
    // ========================================================

    score +=
        (1 - enemyHpRate) *
        250;

    score +=
        myHpRate *
        120;

    return score;
}


// ============================================================
// AI：変化技込み総合評価
// ============================================================

function evaluateAIMove(
    move,
    attacker = opponentPokemon,
    defender = playerPokemon
) {

    if (!move) {
        return -Infinity;
    }

    if (
        move.currentPp !== undefined &&
        move.currentPp <= 0
    ) {
        return -Infinity;
    }

    if (
        move.category !== "status" &&
        move.power
    ) {

        return evaluateAIAttack(
            move,
            attacker,
            defender
        );
    }

    let score =
        getAIStatusMoveScore(
            move,
            attacker,
            defender
        );

    score +=
        getAIStatusScore(
            move,
            attacker,
            defender
        );

    return score;
}


// ============================================================
// AI：仮想的に相手のHPを削った場合の評価
// ============================================================

function getAIFutureScore(move) {

    const attacker =
        opponentPokemon;

    const defender =
        playerPokemon;

    let score =
        evaluateAIMove(
            move,
            attacker,
            defender
        );

    if (!Number.isFinite(score)) {
        return -Infinity;
    }

    // --------------------------------------------------------
    // 攻撃後の仮想HP
    // --------------------------------------------------------

    let predictedEnemyHp =
        defender.currentHp;

    if (
        move.category !== "status" &&
        move.power
    ) {

        predictedEnemyHp =
            Math.max(
                0,
                predictedEnemyHp -
                getAIDamage(
                    move,
                    attacker,
                    defender
                )
            );
    }

    // 即KO
    if (predictedEnemyHp <= 0) {
        return score + 30000;
    }

    // --------------------------------------------------------
    // 相手の次の最善手
    // --------------------------------------------------------

    const enemyBest =
        getAIBestAttack(
            defender,
            attacker
        );

    if (enemyBest) {

        const enemyDamage =
            enemyBest.damage;

        let predictedMyHp =
            Math.max(
                0,
                attacker.currentHp -
                enemyDamage
            );

        // 次ターン確定で死ぬ
        if (
            predictedMyHp <= 0
        ) {

            // 今の技で相手を倒せないなら大きく減点
            score -= 7000;

            // ただしこちらが先制して倒せる可能性
            if (
                (move.priority ?? 0) > 0 &&
                predictedEnemyHp <=
                defender.currentHp * 0.35
            ) {
                score += 3500;
            }
        }
        else {

            score +=
                (predictedMyHp /
                attacker.maxHp) *
                900;
        }
    }

    // --------------------------------------------------------
    // 相手の残HP
    // --------------------------------------------------------

    score +=
        (
            1 -
            predictedEnemyHp /
            defender.maxHp
        ) * 1200;

    // --------------------------------------------------------
    // 自分の残HP
    // --------------------------------------------------------

    score +=
        (
            attacker.currentHp /
            attacker.maxHp
        ) * 500;

    return score;
}


// ============================================================
// AI：読み合い用スコア
// 相手が最善手を選ぶことを想定
// ============================================================

function getAIMinimaxScore(move) {

    const currentScore =
        getAIFutureScore(move);

    if (
        !Number.isFinite(currentScore)
    ) {
        return -Infinity;
    }

    const predictedEnemyHp =
        (
            move.category !== "status" &&
            move.power
        )
            ? Math.max(
                0,
                playerPokemon.currentHp -
                getAIDamage(
                    move,
                    opponentPokemon,
                    playerPokemon
                )
            )
            : playerPokemon.currentHp;

    // KOなら最優先
    if (predictedEnemyHp <= 0) {
        return currentScore + 50000;
    }

    // 相手が次に使える最善技
    const enemyBestMoves =
        playerPokemon.moves.filter(
            m =>
                (m.currentPp ?? 0) > 0
        );

    let worstCase = 0;

    for (const enemyMove of enemyBestMoves) {

        let responseScore = 0;

        if (
            enemyMove.category !== "status" &&
            enemyMove.power
        ) {

            const damage =
                getAIDamage(
                    enemyMove,
                    playerPokemon,
                    opponentPokemon
                );

            const expected =
                getAIExpectedDamage(
                    enemyMove,
                    playerPokemon,
                    opponentPokemon
                );

            // 自分を倒せる反撃
            if (
                damage >=
                opponentPokemon.currentHp
            ) {
                responseScore -= 12000;
            }

            responseScore -=
                expected * 1.5;
        }
        else {

            responseScore +=
                getAIStatusScore(
                    enemyMove,
                    playerPokemon,
                    opponentPokemon
                ) * -0.5;
        }

        worstCase =
            Math.min(
                worstCase,
                responseScore
            );
    }

    return (
        currentScore +
        worstCase
    );
}


// ============================================================
// AI：性格補正
// ============================================================

function getAIPersonalityBonus(
    move,
    attacker,
    defender
) {

    const personality =
        attacker.ai;

    if (!personality) {
        return 0;
    }

    let bonus = 0;

    const damage =
        getAIDamage(
            move,
            attacker,
            defender
        );

    const hpRate =
        attacker.currentHp /
        attacker.maxHp;

    const enemyHpRate =
        defender.currentHp /
        defender.maxHp;

    if (
        personality === "aggressive"
    ) {

        if (move.power) {
            bonus += 100;
        }

        if (damage >= defender.currentHp) {
            bonus += 500;
        }
    }

    if (
        personality === "defensive"
    ) {

        if (
            move.category === "status"
        ) {
            bonus += 120;
        }

        if (hpRate < 0.40) {
            bonus +=
                move.name === "まもる"
                    ? 250
                    : 0;
        }
    }

    if (
        personality === "smart"
    ) {

        if (
            getAIAccuracy(move) >= 0.9
        ) {
            bonus += 50;
        }

        if (
            damage >= defender.currentHp
        ) {
            bonus += 250;
        }
    }

    if (
        personality === "setup"
    ) {

        if (
            move.category === "status"
        ) {
            bonus += 150;
        }
    }

    if (
        personality === "finisher"
    ) {

        if (
            enemyHpRate <= 0.35 &&
            move.power
        ) {
            bonus += 250;
        }
    }

    return bonus;
}

                };
            }
        );

    );

    // ========================================================

    if (
        difficulty === "hard"
    ) {

        // 基本は完全最善手

    }

    // NORMAL

// ============================================================
// AI：最強人間AI 設定
// ============================================================

const HUMAN_AI_CONFIG = {
    // どれくらい先まで考えるか
    lookAhead: 2,

    // 人間らしい読みの強さ
    predictionWeight: 1.0,

    // リスクをどれだけ嫌うか
    riskWeight: 1.0,

    // 同じ技を連打することへの軽いペナルティ
    repetitionPenalty: 80,

    // 明確な最善手にどれだけ固定するか
    bestMoveThreshold: 180,

    // 最善手以外を選ぶ可能性
    humanVariance: 0.04
};


// ============================================================
// AI：HP割合
// ============================================================

function getAIHpRate(pokemon) {

    if (!pokemon || !pokemon.maxHp) {
        return 0;
    }

    return Math.max(
        0,
        Math.min(
            1,
            pokemon.currentHp / pokemon.maxHp
        )
    );
}


// ============================================================
// AI：相手を倒せるか
// ============================================================

function canAIKO(move, attacker, defender) {

    if (!move || !attacker || !defender) {
        return false;
    }

    if (
        move.category === "status" ||
        !move.power
    ) {
        return false;
    }

    if (
        move.currentPp !== undefined &&
        move.currentPp <= 0
    ) {
        return false;
    }

    const damage =
        getAIDamage(
            move,
            attacker,
            defender
        );

    return damage >= defender.currentHp;
}


// ============================================================
// AI：相手の攻撃で自分が倒されるか
// ============================================================

function canAIDieToMove(move, attacker, defender) {

    if (!move || !attacker || !defender) {
        return false;
    }

    if (
        move.category === "status" ||
        !move.power
    ) {
        return false;
    }

    const damage =
        getAIDamage(
            move,
            attacker,
            defender
        );

    return damage >= defender.currentHp;
}


// ============================================================
// AI：確実に使える攻撃技
// ============================================================

function getAILegalMoves(attacker, defender) {

    if (!attacker || !attacker.moves) {
        return [];
    }

    return attacker.moves.filter(move => {

        if (!move) {
            return false;
        }

        if (
            move.currentPp !== undefined &&
            move.currentPp <= 0
        ) {
            return false;
        }

        return true;
    });
}


// ============================================================
// AI：無効技を除外
// ============================================================

function getAIEffectiveMoves(attacker, defender) {

    const moves =
        getAILegalMoves(
            attacker,
            defender
        );

    return moves.filter(move => {

        if (
            move.category === "status" ||
            !move.power
        ) {
            return true;
        }

        const effectiveness =
            getAITypeEffectiveness(
                move,
                attacker,
                defender
            );

        return effectiveness > 0;
    });
}


// ============================================================
// AI：確定KO技
// ============================================================

function getAIKOMoves(attacker, defender) {

    return getAIEffectiveMoves(
        attacker,
        defender
    ).filter(move =>
        canAIKO(
            move,
            attacker,
            defender
        )
    );
}


// ============================================================
// AI：最も危険な相手の技
// ============================================================

function getAIMostDangerousMove(
    attacker,
    defender
) {

    const moves =
        getAIEffectiveMoves(
            attacker,
            defender
        );

    let best = null;
    let bestScore = -Infinity;

    for (const move of moves) {

        if (
            move.category === "status" ||
            !move.power
        ) {
            continue;
        }

        const damage =
            getAIDamage(
                move,
                attacker,
                defender
            );

        const expected =
            getAIExpectedDamage(
                move,
                attacker,
                defender
            );

        let score =
            expected;

        if (
            damage >= defender.currentHp
        ) {
            score += 100000;
        }

        if (
            (move.priority ?? 0) > 0
        ) {
            score += 100;
        }

        if (score > bestScore) {

            bestScore = score;

            best = {
                move,
                damage,
                expected,
                score
            };
        }
    }

    return best;
}


// ============================================================
// AI：この行動後に生存できるか
// ============================================================

function evaluateAISurvivalAfterMove(
    move,
    attacker,
    defender
) {

    if (!attacker || !defender) {
        return -Infinity;
    }

    let predictedHp =
        attacker.currentHp;

    if (
        move.category !== "status" &&
        move.power
    ) {

        const damage =
            getAIDamage(
                move,
                attacker,
                defender
            );

        predictedHp =
            Math.max(
                0,
                predictedHp
            );
    }

    const enemyBest =
        getAIMostDangerousMove(
            defender,
            attacker
        );

    if (!enemyBest) {
        return 500;
    }

    const incoming =
        enemyBest.damage;

    const remainingHp =
        Math.max(
            0,
            predictedHp - incoming
        );

    if (remainingHp <= 0) {
        return -5000;
    }

    return (
        remainingHp /
        attacker.maxHp
    ) * 1000;
}

// ============================================================
// AI：相手の交代を予測
// ============================================================

function predictOpponentSwitchChance(
    attacker,
    defender
) {

    if (!attacker || !defender) {
        return 0;
    }

    let chance = 0;

    const hpRate =
        getAIHpRate(defender);

    // HPがかなり低い
    if (hpRate <= 0.25) {
        chance += 0.35;
    }

    // こちらがタイプ有利
    const dangerousMove =
        getAIMostDangerousMove(
            attacker,
            defender
        );

    if (dangerousMove) {

        if (
            dangerousMove.damage >=
            defender.currentHp
        ) {
            chance += 0.35;
        }
        else if (
            dangerousMove.damage >=
            defender.maxHp * 0.5
        ) {
            chance += 0.15;
        }
    }

    return Math.min(
        0.90,
        chance
    );
}


// ============================================================
// AI：交代読み
// ============================================================

function getAISwitchReadScore(
    move,
    attacker,
    defender
) {

    const switchChance =
        predictOpponentSwitchChance(
            attacker,
            defender
        );

    if (switchChance <= 0) {
        return 0;
    }

    const effectiveness =
        getAITypeEffectiveness(
            move,
            attacker,
            defender
        );

    // 通常攻撃
    let score = 0;

    // 交代されても刺さりそうな技
    if (effectiveness >= 2) {
        score +=
            switchChance * 500;
    }

    // 無効になる技は読みとして危険
    if (effectiveness === 0) {
        score -=
            switchChance * 700;
    }

    return score;
}

// ============================================================
// AI：人間らしい最終選択
// ============================================================

function chooseHumanLikeAIMove(
    scoredMoves
) {

    if (
        !scoredMoves ||
        scoredMoves.length === 0
    ) {
        return null;
    }

    scoredMoves.sort(
        (a, b) =>
            b.score - a.score
    );

    const best =
        scoredMoves[0];

    // 明確な最善手なら迷わない
    if (
        scoredMoves.length === 1 ||
        best.score -
        scoredMoves[1].score >=
        HUMAN_AI_CONFIG.bestMoveThreshold
    ) {
        return best.move;
    }

    // それ以外は人間らしく少し揺らす
    if (
        Math.random() <
        HUMAN_AI_CONFIG.humanVariance
    ) {

        const candidates =
            scoredMoves.slice(
                0,
                Math.min(
                    3,
                    scoredMoves.length
                )
            );

        const index =
            Math.floor(
                Math.random() *
                candidates.length
            );

        return candidates[index].move;
    }

    return best.move;
}

// ============================================================
// AI：実際に使う技
// ============================================================

function getOpponentMove() {

    const attacker =
        opponentPokemon;

    const defender =
        playerPokemon;

    if (!attacker || !defender) {
        return null;
    }

    const moves =
        getAIEffectiveMoves(
            attacker,
            defender
        );

    if (!moves.length) {
        return null;
    }

    // ========================================================
    // ① 確定KO
    // ========================================================

    const koMoves =
        getAIKOMoves(
            attacker,
            defender
        );

    if (koMoves.length > 0) {

        // 複数のKO技がある場合だけ評価
        if (koMoves.length === 1) {
            return koMoves[0];
        }
    }

    // ========================================================
    // ② 全候補を評価
    // ========================================================

    const scoredMoves =
        moves.map(move => {

            let score =
                evaluateAIMove(
                    move,
                    attacker,
                    defender
                );

            // 未来評価
            const future =
                getAIFutureScore(
                    move
                );

            if (Number.isFinite(future)) {
                score += future;
            }

            // 生存評価
            score +=
                evaluateAISurvivalAfterMove(
                    move,
                    attacker,
                    defender
                );

            // 交代読み
            score +=
                getAISwitchReadScore(
                    move,
                    attacker,
                    defender
                );

            // 性格
            score +=
                getAIPersonalityBonus(
                    move,
                    attacker,
                    defender
                );

            return {
                move,
                score
            };
        });

    // ========================================================
    // ③ 最終決定
    // ========================================================

    return chooseHumanLikeAIMove(
        scoredMoves
    );
}

    async function applyDamage(attacker, defender, damage, move, defenderUI) {

    // まもる
    if (defender.isProtected) {

    // ふかしのこぶしなら貫通
    if (attacker.ability !== "ふかしのこぶし") {

        if (

            updateStatDisplay(

                document.getElementById('opponent-stat-display')
            );

                `${attacker.name} の こうげきが がくっと さがった！`
            );
        }

        await showMessage(
            `${defender.name} は こうげきから みをまもった！`
        );

        return { hit: false };
    }
}

    // みがわり
    if (defender.hasSubstitute && !move.isSound) {
        defender.substituteHp -= damage;
        await showMessage(`${defender.name} の みがわりが こうげきを うけた！`);

        if (defender.substituteHp <= 0) {
            defender.hasSubstitute = false;
            defender.substituteHp = 0;
            updateSubstituteMarkers();
            await showMessage(`${defender.name} の みがわりは こわれた！`);
        }

        return { hit: true };
    }

// 本体ダメージ
defender.currentHp = Math.max(0, defender.currentHp - damage);
defender.lastDamageTaken = damage;
defender.lastDamageCategory = move.category;
defender.lastAttacker = attacker;

    updateHpBars();

    // 瀕死処理は handleAttack 側で一度だけ行う。
    // ここで checkFainted を呼ぶと、攻撃処理の途中で交代が発生して
    // その後の処理と二重進行してしまう。
    if (defender.currentHp <= 0) {
        return { hit: true, fainted: true };
    }

    // ⭐ 接触ダメージ
    if (move.isContact) {
        if (defender.item?.name === 'ゴツゴツメット') {
            const recoil = Math.floor(attacker.maxHp / 6);
            attacker.currentHp = Math.max(0, attacker.currentHp - recoil);
            await showMessage(`${attacker.name} は ゴツゴツメットで ダメージをうけた！`);
        }

            const recoil = Math.floor(attacker.maxHp / 6);
            attacker.currentHp = Math.max(0, attacker.currentHp - recoil);
            await showMessage(`${attacker.name} は 相手の特性で ダメージをうけた！`);
        }

        updateHpBars();

        // ⭐ ここが今回の本質
        if (attacker.currentHp <= 0) {
            const isPlayerAttacker = attacker === playerPokemon;
            await checkFainted(attacker, isPlayerAttacker);
            return { hit: true, fainted: true };
        }
    }

    return { hit: true, fainted: false };
}

async function applyMoody(pokemon) {
    const stats = ['attack', 'defense', 'spAttack', 'spDefense', 'speed'];
    const statLabels = {
        attack: 'こうげき',
        defense: 'ぼうぎょ',
        spAttack: 'とくこう',
        spDefense: 'とくぼう',
        speed: 'すばやさ'
    };

    // 上昇候補（+6除外）
    const incCandidates = stats.filter(s => pokemon.statStages[s] < 6);
    if (incCandidates.length === 0) return;

    const incStat = incCandidates[Math.floor(Math.random() * incCandidates.length)];
    pokemon.statStages[incStat] = Math.min(6, pokemon.statStages[incStat] + 2);

    // 下降候補（今上がった能力と -6除外）
    const decCandidates = stats.filter(s =>
        s !== incStat && pokemon.statStages[s] > -6
    );

    let decStat = null;
    if (decCandidates.length > 0) {
        decStat = decCandidates[Math.floor(Math.random() * decCandidates.length)];
        pokemon.statStages[decStat] = Math.max(-6, pokemon.statStages[decStat] - 1);
    }

    updateStatDisplay(playerPokemon, document.getElementById('player-stat-display'));
    updateStatDisplay(opponentPokemon, document.getElementById('opponent-stat-display'));

    // メッセージ
    let message;
    if (decStat) {
        message = `${pokemon.name}の${statLabels[incStat]}がぐーんと上がって、${statLabels[decStat]}が下がった！`;
    } else {
        message = `${pokemon.name}の${statLabels[incStat]}がぐーんと上がった！`;
    }

    await showMessage(message);
}

// AI：3vs3 通常ターンの交代判断
// 「このまま戦うより交代した方が明確に得」なら交代
// ============================================================

function shouldOpponentSwitch() {

    // 直前のターンに交代した場合、連続して交代しない
    if (opponentSwitchedLastTurn) {
        return false;
    }

    // EASYでは交代判断をしない
    if (difficulty === "easy") {
        return false;
    }

    if (
        !opponentPokemon ||
        !playerPokemon ||
        opponentPokemon.currentHp <= 0 ||
        playerPokemon.currentHp <= 0
    ) {
        return false;
    }

    // 交代候補
    const candidates = opponentTeam
        .map((pokemon, index) => ({
            pokemon,
            index
        }))
        .filter(({ pokemon, index }) =>
            index !== opponentActiveIndex &&
            pokemon.currentHp > 0
        );

    if (candidates.length === 0) {
        return false;
    }

    // ========================================================
    // 現在の対面を評価
    // ========================================================

    const currentAttack =
        getAIBestAttack(
            opponentPokemon,
            playerPokemon
        );

    const currentDefense =
        getAIBestAttack(
            playerPokemon,
            opponentPokemon
        );

    let stayScore = 0;

    if (currentAttack) {
        stayScore +=
            currentAttack.expected;

        // 確定KOできるなら基本的に居座る
        if (
            currentAttack.damage >=
            playerPokemon.currentHp
        ) {
            stayScore += 15000;
        }

        // 2発圏内
        else if (
            currentAttack.damage * 2 >=
            playerPokemon.currentHp
        ) {
            stayScore += 2500;
        }
    }

    if (currentDefense) {

        stayScore -=
            currentDefense.expected * 1.5;

        // 相手に確定KOされる
        if (
            currentDefense.damage >=
            opponentPokemon.currentHp
        ) {
            stayScore -= 15000;
        }

        // 2発圏内
        else if (
            currentDefense.damage * 2 >=
            opponentPokemon.currentHp
        ) {
            stayScore -= 3000;
        }
    }

    // ========================================================
    // 交代候補の中で一番強いポケモンを探す
    // ========================================================

    let bestSwitchIndex = -1;
    let bestSwitchScore = -Infinity;

    for (const candidate of candidates) {

        const pokemon =
            candidate.pokemon;

        let switchScore = 0;

        const attack =
            getAIBestAttack(
                pokemon,
                playerPokemon
            );

        const defense =
            getAIBestAttack(
                playerPokemon,
                pokemon
            );

        // 攻撃性能
        if (attack) {

            switchScore +=
                attack.expected * 2;

            // 確定KO
            if (
                attack.damage >=
                playerPokemon.currentHp
            ) {
                switchScore += 12000;
            }

            // 2発圏内
            else if (
                attack.damage * 2 >=
                playerPokemon.currentHp
            ) {
                switchScore += 3000;
            }

            const effectiveness =
                getAITypeEffectiveness(
                    attack.move,
                    pokemon,
                    playerPokemon
                );

            if (effectiveness >= 4) {
                switchScore += 3000;
            }
            else if (effectiveness >= 2) {
                switchScore += 1400;
            }
            else if (effectiveness <= 0.25) {
                switchScore -= 2000;
            }
            else if (effectiveness <= 0.5) {
                switchScore -= 800;
            }
        }

        // 防御性能
        if (defense) {

            switchScore -=
                defense.expected * 1.8;

            // 出した瞬間に倒される
            if (
                defense.damage >=
                pokemon.currentHp
            ) {
                switchScore -= 12000;
            }

            // 2発圏内
            else if (
                defense.damage * 2 >=
                pokemon.currentHp
            ) {
                switchScore -= 2500;
            }
        }

        // HP
        switchScore +=
            (
                pokemon.currentHp /
                pokemon.maxHp
            ) * 1500;

        if (
            switchScore >
            bestSwitchScore
        ) {
            bestSwitchScore =
                switchScore;

            bestSwitchIndex =
                candidate.index;
        }
    }

    if (bestSwitchIndex === -1) {
        return false;
    }

    // ========================================================
    // 交代する価値が十分あるか
    // ========================================================

    const advantage =
        bestSwitchScore -
        stayScore;

    // ハードなら積極的に交代
    if (
        difficulty === "hard" &&
        advantage >= 2500
    ) {
        return true;
    }

    // ノーマルはかなり明確な有利不利だけ
    if (
        (
            difficulty === "normal" ||
            difficulty === "ノーマル"
        ) &&
        advantage >= 5000
    ) {
        return true;
    }

    return false;
}

// AI：3vs3 最強交代AI
// 自分・相手の残りポケモン全体を評価して交代先を決定
// ============================================================

function chooseBestOpponentSwitch() {

    const candidates = opponentTeam
        .map((pokemon, index) => ({
            pokemon,
            index
        }))
        .filter(({ pokemon, index }) =>
            index !== opponentActiveIndex &&
            pokemon.currentHp > 0
        );

    if (candidates.length === 0) {
        return -1;
    }

    // プレイヤー側の生存ポケモン
    const playerCandidates = playerTeam
        .filter(pokemon =>
            pokemon.currentHp > 0
        );

    let bestIndex = candidates[0].index;
    let bestScore = -Infinity;

    for (const candidate of candidates) {

        const pokemon = candidate.pokemon;

        if (!pokemon) continue;

        let score = 0;

        // ====================================================
        // ① HP
        // ====================================================

        const hpRate =
            pokemon.currentHp /
            pokemon.maxHp;

        score += hpRate * 3500;

        // ====================================================
        // ② 今出ているプレイヤーへの性能
        // ====================================================

        const activeBest =
            getAIBestAttack(
                pokemon,
                playerPokemon
            );

        if (activeBest) {

            const damage =
                activeBest.damage;

            const expected =
                activeBest.expected;

            score += expected * 2;

            // 確定KO
            if (
                damage >=
                playerPokemon.currentHp
            ) {
                score += 12000;
            }

            // 2発以内
            else if (
                damage * 2 >=
                playerPokemon.currentHp
            ) {
                score += 3500;
            }

            // 効果抜群
            const effectiveness =
                getAITypeEffectiveness(
                    activeBest.move,
                    pokemon,
                    playerPokemon
                );

            if (effectiveness >= 4) {
                score += 2500;
            }
            else if (effectiveness >= 2) {
                score += 1200;
            }
            else if (effectiveness <= 0.25) {
                score -= 1800;
            }
            else if (effectiveness <= 0.5) {
                score -= 700;
            }
        }

        // ====================================================
        // ③ プレイヤー側から受ける最大ダメージ
        // ====================================================

        let strongestIncoming = 0;

        for (const player of playerCandidates) {

            const playerBest =
                getAIBestAttack(
                    player,
                    pokemon
                );

            if (!playerBest) {

        // ====================================================

        for (const ally of opponentTeam) {

            if (
                ally === pokemon ||
                ally.currentHp <= 0
            ) {
                continue;
            }

            const allyTypes =
                Array.isArray(ally.types)
                    ? ally.types
                    : [ally.types];

            const myTypes =
                Array.isArray(pokemon.types)
                    ? pokemon.types
                    : [pokemon.types];

            const sharedType =
                myTypes.some(
                    type =>
                        allyTypes.includes(type)
                );

            if (sharedType) {
                score -= 80;
            }
        }

        // ====================================================
        // ⑩ 残りの相手全体に対して最低1匹は強く出られるか
        // ====================================================

        let favorableMatchups = 0;

        for (const player of playerCandidates) {

            let matchupScore = 0;

            // 自分からの最大火力
            const myBest =
                getAIBestAttack(
                    pokemon,
                    player
                );

            if (myBest) {

            // 相手からの最大火力

                getAIBestAttack(
                    player,
                    pokemon

            if (enemyBest) {

            }

            if (matchupScore > 0) {

        // ====================================================

        for (const player of playerCandidates) {

                    player

                getAIBestAttack(

            }

            badMatchups * 2500;

        // ====================================================

        // 10～20
        const loss = Math.floor(Math.random() * 11) + 10;

        // 連敗管理
        loseStreak++;
        winStreak = 0;

        // 連敗ボーナス
        const streakPenalty = loseStreak * 2;

        rating = Math.max(
            1,
            rating - loss - streakPenalty
        );

        loseCount++;

        gameOverText.textContent =
            `めのまえが まっくら になった...`;
    }

    updateRating();
}
