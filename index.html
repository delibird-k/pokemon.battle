// ============================================================

(function () {

    "use strict";

    const AI_V6 = {

        depth: 3,

        // 1ターンあたりに調べる技数
        beamWidth: 8,

        // 交代候補
        switchWidth: 3,

        // 数値の暴走防止
        maxScore: 1000000,

        // 最低ダメージ
        minDamage: 1

    };

    // ========================================================
    // 基本ユーティリティ
    // ========================================================

    function v6Num(v, fallback = 0) {

        const n = Number(v);

        return Number.isFinite(n)
            ? n
            : fallback;

    }

    function v6Clamp(v, min, max) {

        return Math.max(
            min,
            Math.min(max, v)
        );

    }

    function v6Alive(pokemon) {

        return !!pokemon &&
            v6Num(pokemon.currentHp) > 0;

    }

    function v6MaxHp(pokemon) {

        return Math.max(
            1,
            v6Num(
                pokemon?.maxHp,
                v6Num(pokemon?.baseHp, 1)
            )
        );

    }

    function v6Hp(pokemon) {

        return v6Clamp(
            v6Num(pokemon?.currentHp),
            0,
            v6MaxHp(pokemon)
        );

    }

    function v6HpRate(pokemon) {

        return v6Hp(pokemon) /
            v6MaxHp(pokemon);

    }

    function v6Types(pokemon) {

        if (!pokemon) return [];

        if (Array.isArray(pokemon.types)) {
            return pokemon.types;
        }

        if (pokemon.types) {
            return [pokemon.types];
        }

        if (pokemon.type) {
            return Array.isArray(pokemon.type)
                ? pokemon.type
                : [pokemon.type];
        }

        return [];
    }

    function v6MoveType(move) {

        if (!move) return "";

        if (move.dynamicAppliedType) {
            return move.dynamicAppliedType;
        }

        if (Array.isArray(move.type)) {
            return move.type[0];
        }

        return move.type || "";
    }

    function v6IsStatusMove(move) {

        return !move ||
            move.category === "status" ||
            !move.power ||
            v6Num(move.power) <= 0;
    }

    function v6IsDamagingMove(move) {

        return !!move &&
            !v6IsStatusMove(move);
    }

    function v6MovePP(move) {

        if (!move) return 0;

        if (move.currentPp === undefined) {
            return 1;
        }

        return v6Num(move.currentPp);
    }

    function v6Moves(pokemon) {

        if (!pokemon) return [];

        const moves =
            Array.isArray(pokemon.moves)
                ? pokemon.moves
                : [];

        return moves.filter(
            move =>
                move &&
                v6MovePP(move) > 0
        );
    }

    // ========================================================
    // 能力ランク
    // ========================================================

    function v6Stage(stage) {

        stage = v6Num(stage);

        stage = v6Clamp(
            stage,
            -6,
            6
        );

        if (stage >= 0) {

            return (
                2 + stage
            ) / 2;

        }

        return 2 / (
            2 - stage
        );
    }

    function v6Stages(pokemon) {

        if (!pokemon) {

            return {
                attack: 0,
                defense: 0,
                spAttack: 0,
                spDefense: 0,
                speed: 0,
                accuracy: 0,
                evasion: 0
            };

        }

        if (!pokemon.statStages) {

            pokemon.statStages = {};

        }

        return {

            attack:
                v6Num(
                    pokemon.statStages.attack
                ),

            defense:
                v6Num(
                    pokemon.statStages.defense
                ),

            spAttack:
                v6Num(
                    pokemon.statStages.spAttack
                ),

            spDefense:
                v6Num(
                    pokemon.statStages.spDefense
                ),

            speed:
                v6Num(
                    pokemon.statStages.speed
                ),

            accuracy:
                v6Num(
                    pokemon.statStages.accuracy
                ),

            evasion:
                v6Num(
                    pokemon.statStages.evasion
                )

        };

    }

    function v6EffectiveStat(
        pokemon,
        stat
    ) {

        if (!pokemon) return 0;

        const stages =
            v6Stages(pokemon);

        let base =
            v6Num(
                pokemon[stat]
            );

        if (base <= 0) {

            return 0;

        }

        let result =
            base *
            v6Stage(
                stages[stat]
            );

        // ====================================================
        // 状態異常
        // ====================================================

        if (
            stat === "speed" &&
            pokemon.status === "paralyze"
        ) {

            result *= 0.5;

        }

        // ====================================================
        // 持ち物
        // ====================================================

        if (
            stat === "speed" &&
            pokemon.item?.name ===
                "しゅんそくスカーフ"
        ) {

            result *= 1.5;

        }

        if (
            stat === "spDefense" &&
            pokemon.item?.name ===
                "たいきゅうチョッキ"
        ) {

            result *= 1.5;

        }

        // ====================================================
        // 特性
        // ====================================================

        if (
            stat === "speed" &&
            pokemon.ability?.name ===
                "ききかいひ"
        ) {

            result *= 1.25;

        }

        return result;

    }

    // ========================================================
    // コピー
    // ========================================================

    function v6ClonePokemon(original) {

        if (!original) return null;

        let copy;

        try {

            copy =
                JSON.parse(
                    JSON.stringify(original)
                );

        } catch (e) {

            copy =
                Object.assign(
                    {},
                    original
                );

        }

        if (!copy.statStages) {

            copy.statStages = {};

        }

        if (!copy.status) {

            copy.status = "none";

        }

        if (
            copy.currentHp === undefined
        ) {

            copy.currentHp =
                copy.maxHp || 1;

        }

        if (
            copy.maxHp === undefined
        ) {

            copy.maxHp =
                copy.currentHp || 1;

        }

        if (
            copy.hasSubstitute === undefined
        ) {

            copy.hasSubstitute = false;

        }

        if (
            copy.substituteHp === undefined
        ) {

            copy.substituteHp = 0;

        }

        if (
            copy.protectedThisTurn === undefined
        ) {

            copy.protectedThisTurn = false;

        }

        return copy;

    }

    // ========================================================
    // コピーした盤面
    // ========================================================

    function v6CloneBoard() {

        const board = {

            opponent:

                ),

            playerTeam:
                Array.isArray(playerTeam)
                    ? playerTeam.map(

                    )

            opponentTeam:
                Array.isArray(opponentTeam)

            weather:

    // ========================================================
    // タイプ相性
    // ========================================================

    function v6Effectiveness(
        move,
        attacker,
        defender
    ) {

        if (
            typeof getAITypeEffectiveness ===
            "function"
        ) {

            try {

                const value =
                    getAITypeEffectiveness(
                        move,
                        attacker,
                        defender
                    );

                if (
                    Number.isFinite(
                        Number(value)
                    )
                ) {

                    return Number(value);

                }

            } catch (e) {}

        }

        const moveType =
            v6MoveType(move);

        if (!moveType) return 1;

        const defenderTypes =
            v6Types(defender);

        if (
            typeof calculateTypeEffectiveness ===
            "function"
        ) {

            try {

                return calculateTypeEffectiveness(
                    moveType,
                    defenderTypes
                );

            } catch (e) {}

        }

        return 1;

    }

    // ========================================================
    // ダメージ計算
    //
    // 実際の calculateDamage は乱数を含むため、
    // AIでは期待値用に近似する。
    // ========================================================

    function v6Damage(
        move,
        attacker,
        defender
    ) {

        if (
            !move ||
            !attacker ||
            !defender ||
            !v6IsDamagingMove(move)
        ) {

            return 0;

        }

        let damage = 0;

        // ----------------------------------------------------
        // 現在のAIダメージ計算を利用
        // ----------------------------------------------------

        if (
            typeof getAIDamage ===
            "function"
        ) {

            try {

                damage =
                    v6Num(
                        getAIDamage(
                            move,
                            attacker,
                            defender
                        )
                    );

            } catch (e) {}

        }

        // ----------------------------------------------------
        // calculateDamage が利用可能なら利用
        // ----------------------------------------------------

        if (
            damage <= 0 &&
            typeof calculateDamage ===
            "function"
        ) {

            try {

                const result =
                    calculateDamage(
                        move,
                        attacker,
                        defender
                    );

                if (
                    result &&
                    typeof result === "object"
                ) {

                    damage =
                        v6Num(
                            result.damage
                        );

                } else {

                    damage =
                        v6Num(result);

                }

            } catch (e) {}

        }

        // ----------------------------------------------------
        // フォールバック
        // ----------------------------------------------------

        if (damage <= 0) {

            const power =
                v6Num(
                    move.power
                );

            const attack =
                move.category === "special"

                    ? v6EffectiveStat(
                        attacker,
                        "spAttack"
                    )

                    : v6EffectiveStat(
                        attacker,
                        "attack"
                    );

            const defense =
                move.category === "special"

                    ? v6EffectiveStat(
                        defender,
                        "spDefense"
                    )

                    : v6EffectiveStat(
                        defender,
                        "defense"
                    );

            if (
                power > 0 &&
                attack > 0 &&
                defense > 0
            ) {

                damage =
                    Math.floor(
                        (
                            (
                                2 *
                                50 /
                                5 +
                                2
                            ) *
                            power *
                            attack /
                            defense
                        ) /
                        50
                    ) + 2;

                const stab =
                    v6Types(attacker)
                        .includes(
                            v6MoveType(move)
                        )
                        ? 1.5
                        : 1;

                damage *= stab;

                damage *=
                    v6Effectiveness(
                        move,
                        attacker,
                        defender
                    );

            }

        }

        return Math.max(
            0,
            Math.floor(damage)
        );

    }

    // ========================================================
    // 期待ダメージ
    // ========================================================

    function v6ExpectedDamage(
        move,
        attacker,
        defender
    ) {

        const damage =
            v6Damage(
                move,
                attacker,
                defender
            );

        if (damage <= 0) {

            return 0;

        }

        // ポケモンのダメージ乱数
        return damage * 0.925;

    }

    // ========================================================
    // 先制判定
    // ========================================================

    function v6Priority(move) {

        return v6Num(
            move?.priority,
            0
        );

    }

    function v6GoesFirst(
        moveA,
        pokemonA,
        moveB,
        pokemonB
    ) {

        const pA =
            v6Priority(moveA);

        const pB =
            v6Priority(moveB);

        if (pA !== pB) {

            return pA > pB
                ? 1
                : -1;

        }

        const sA =
            v6EffectiveStat(
                pokemonA,
                "speed"
            );

        const sB =
            v6EffectiveStat(
                pokemonB,
                "speed"
            );

        if (sA === sB) {

            return 0;

        }

        return sA > sB
            ? 1
            : -1;

    }

    // ========================================================
    // 状態異常評価

    function v6StatusScore(

                    )
                ) {

        if (

        ) {

            ) {

        if (
            name.includes("やけど")
        ) {

                !defender.status ||

        }

        // ----------------------------------------------------

        if (

        ) {

            if (

            ) {

        }

        // ----------------------------------------------------

        if (

        ) {

            score += 850;

    // ========================================================
    // 能力ランク変化を仮想適用
    // ========================================================

    function v6ChangeStage(
        pokemon,
        stat,
        amount
    ) {

        if (!pokemon) return;

        if (!pokemon.statStages) {

            pokemon.statStages = {};

        }

        const before =
            v6Num(
                pokemon.statStages[stat]
            );

        pokemon.statStages[stat] =
            v6Clamp(
                before + amount,
                -6,
                6
            );

    }

    // ========================================================
    // 回復技
    // ========================================================

    function v6RecoveryAmount(
        pokemon,
        move
    ) {

        if (!pokemon || !move) {

            return 0;

        }

        const name =
            move.name || "";

        if (
            name === "じこさいせい" ||
            name === "はねやすめ" ||
            name === "なまける"
        ) {

            return Math.floor(
                v6MaxHp(pokemon) / 2
            );

        }

        return 0;

    }

    // ========================================================
    // みがわり
    // ========================================================

    function v6UseSubstitute(
        pokemon
    ) {

        if (!pokemon) return false;

        if (
            pokemon.hasSubstitute
        ) {

            return false;

        }

        const cost =
            Math.floor(
                v6MaxHp(pokemon) / 4
            );

        if (
            v6Hp(pokemon) <= cost
        ) {

            return false;

        }

        pokemon.currentHp -= cost;

        pokemon.hasSubstitute =
            true;

        pokemon.substituteHp =
            Math.max(
                1,
                cost
            );

        return true;

    }

    // ========================================================
    // まもる
    // ========================================================

    function v6UseProtect(
        pokemon
    ) {

        if (!pokemon) return;

            true;

    // ========================================================

    function v6AbilityBonus(
        attacker,
        defender,

        if (
            !attacker ||
            !defender ||
            !move
        ) {

            return score;

        }

        const ability =
            attacker.ability;

        // ----------------------------------------------------
        // こんじょう
        // ----------------------------------------------------

        if (
            ability === "こんじょう" &&
            attacker.status &&
            attacker.status !== "none" &&
            move.category === "physical"
        ) {

            score += 500;

        }

        // ----------------------------------------------------
        // テクニシャン
        // ----------------------------------------------------

        if (
            ability === "テクニシャン" &&
            v6Num(move.power) <= 60
        ) {

            score += 250;

        }

        // ----------------------------------------------------
        // はりきり
        // ----------------------------------------------------

        if (
            ability === "はりきり" &&
            move.category === "physical"
        ) {

            score += 300;

        }

        // ----------------------------------------------------
        // ちからもち
        // ----------------------------------------------------

        if (
            ability === "ちからもち" &&
            move.category === "physical"
        ) {

            score += 600;

        }

        // ----------------------------------------------------
        // もうか / げきりゅう / しんりょく
        // ----------------------------------------------------

        if (
            (
                ability === "もうか" &&
                v6MoveType(move) === "ほのお"
            ) ||
            (
                ability === "げきりゅう" &&
                v6MoveType(move) === "みず"
            ) ||
            (
                ability === "しんりょく" &&
                v6MoveType(move) === "くさ"
            )
        ) {

            if (
                v6HpRate(attacker) <= 1 / 3
            ) {

                score += 500;

            }

        }

        return score;

    }

    // ========================================================
    // 技の仮想実行
    // ========================================================

    function v6SimulateMove(
        attacker,
        defender,
        move
    ) {

        const result = {

            damage: 0,

            healing: 0,

            ko: false,

            statusApplied: false,

            statChanged: false,

            substituteCreated: false,

            protected: false,

            typeEffectiveness:
                v6Effectiveness(
                    move,
                    attacker,
                    defender
                )

        };

        if (
            !attacker ||
            !defender ||
            !move
        ) {

            return result;

        }

        // ----------------------------------------------------
        // まもる
        // ----------------------------------------------------

        if (
            move.name === "まもる"
        ) {

            v6UseProtect(
                attacker
            );

            result.protected = true;

            return result;

        }

        // ----------------------------------------------------
        // みがわり
        // ----------------------------------------------------

        if (
            move.name === "みがわり"
        ) {

            if (
                v6UseSubstitute(
                    attacker
                )
            ) {

                result.substituteCreated =
                    true;

            }

            return result;

        }

        // ----------------------------------------------------
        // 回復
        // ----------------------------------------------------

        const recovery =
            v6RecoveryAmount(
                attacker,
                move
            );

        if (
            recovery > 0
        ) {

            attacker.currentHp =
                Math.min(
                    v6MaxHp(attacker),
                    v6Hp(attacker) +
                    recovery
                );

            result.healing =
                recovery;

        }

        // ----------------------------------------------------
        // 攻撃
        // ----------------------------------------------------

        if (
            v6IsDamagingMove(move)
        ) {

            let damage =
                v6Damage(
                    move,
                    attacker,
                    defender
                );

            // ------------------------------------------------
            // みがわり
            // ------------------------------------------------

            if (
                defender.hasSubstitute
            ) {

                const subDamage =
                    Math.min(
                        defender.substituteHp,
                        damage
                    );

                defender.substituteHp -=
                    subDamage;

                damage =
                    subDamage;

                if (
                    defender.substituteHp <= 0
                ) {

                    defender.hasSubstitute =
                        false;

                    defender.substituteHp =
                        0;

                }

            } else {

                defender.currentHp =
                    Math.max(
                        0,
                        v6Hp(defender) -
                        damage
                    );

            }

            result.damage =
                damage;

            result.ko =
                !v6Alive(defender);

            // ----------------------------------------------
            // 吸収技
            // ----------------------------------------------

            if (
                move.name === "ギガドレイン" ||
                move.name === "きゅうけつ" ||
                move.name === "ドレインパンチ" ||
                move.name === "ソウルドレイン"
            ) {

                let heal =
                    Math.floor(
                        damage / 2
                    );

                if (
                    move.name === "ソウルドレイン"
                ) {

                    heal =
                        Math.floor(
                            damage * 3 / 4
                        );

                }

                attacker.currentHp =
                    Math.min(
                        v6MaxHp(attacker),
                        v6Hp(attacker) +
                        heal
                    );

                result.healing =
                    heal;

            }

        }

        // ----------------------------------------------------
        // 状態異常
        // ----------------------------------------------------

        const beforeStatus =
            defender.status;

        v6ApplyStatus(
            defender,
            move
        );

        result.statusApplied =
            beforeStatus !==
            defender.status;

        // ----------------------------------------------------
        // 能力ランク
        // ----------------------------------------------------

        const beforeStages =
            JSON.stringify(
                v6Stages(attacker)
            );

        v6ApplyStatEffects(
            attacker,
            defender,
            move
        );

        const afterStages =
            JSON.stringify(
                v6Stages(attacker)
            );

        result.statChanged =
            beforeStages !==
            afterStages;

        return result;

    }

    // ========================================================
    // 1手の価値
    // ========================================================

    function v6EvaluateMove(
        attacker,
        defender,
        move
    ) {

        if (
            !attacker ||
            !defender ||
            !move
        ) {

            return -AI_V6.maxScore;

        }

        let score = 0;

        // ====================================================
        // 攻撃技
        // ====================================================

        if (
            v6IsDamagingMove(move)
        ) {

            const damage =
                v6Damage(
                    move,
                    attacker,
                    defender
                );

            const expected =
                v6ExpectedDamage(
                    move,
                    attacker,
                    defender
                );

            score +=
                expected * 2;

            // ------------------------------------------------
            // 確定KO
            // ------------------------------------------------

            if (
                damage >=
                v6Hp(defender)
            ) {

                score += 30000;

            }

            // ------------------------------------------------
            // 2HKO
            // ------------------------------------------------

            else if (
                damage * 2 >=
                v6Hp(defender)
            ) {

                score += 6500;

            }

            // ------------------------------------------------
            // 3HKO
            // ------------------------------------------------

            else if (
                damage * 3 >=
                v6Hp(defender)
            ) {

                score += 2500;

            }

            // ------------------------------------------------
            // タイプ相性
            // ------------------------------------------------

            const effectiveness =
                v6Effectiveness(
                    move,
                    attacker,
                    defender
                );

            if (
                effectiveness >= 4
            ) {

                score += 4500;

            } else if (
                effectiveness >= 2
            ) {

                score += 2000;

            } else if (
                effectiveness === 0
            ) {

                score -= 7000;

            } else if (
                effectiveness <= 0.25
            ) {

                score -= 2500;

            } else if (
                effectiveness <= 0.5
            ) {

                score -= 1000;

            }

            // ------------------------------------------------
            // STAB
            // ------------------------------------------------

            if (
                v6Types(attacker)
                    .includes(
                        v6MoveType(move)
                    )
            ) {

                score += 250;

            }

            // ------------------------------------------------
            // 先制技
            // ------------------------------------------------

            if (
                v6Priority(move) > 0
            ) {

                score += 400;

                if (
                    v6Hp(defender) <=
                    damage
                ) {

                    score += 2500;

                }

            }

        }

        // ====================================================
        // 状態異常
        // ====================================================

        score +=
            v6StatusScore(
                attacker,
                defender,
                move
            );

        // ====================================================
        // 能力変化
        // ====================================================

        if (
            move.name === "インファイト"
        ) {

            score -= 450;

            if (
                v6Hp(defender) <=
                v6Damage(
                    move,
                    attacker,
                    defender
                )
            ) {

                score += 2500;

            }

        }

        if (
            move.name === "りゅうせいぐん" ||
            move.name === "サイコブースト"
        ) {

            score -= 350;

        }

        if (
            move.name === "つるぎのまい" ||
            move.name === "りゅうのまい" ||
            move.name === "わるだくみ" ||
            move.name === "めいそう"
        ) {

            score += 700;

            // HPが十分なら積みを高評価
            if (
                v6HpRate(attacker) >= 0.7
            ) {

                score += 600;

            }

        }

        // ====================================================
        // 回復
        // ====================================================

        const recovery =
            v6RecoveryAmount(
                attacker,
                move
            );

        if (
            recovery > 0
        ) {

            const missingHp =
                v6MaxHp(attacker) -
                v6Hp(attacker);

            score +=
                recovery * 2;

            if (
                v6HpRate(attacker) <= 0.35
            ) {

                score += 1800;

            }

            if (
                missingHp <= 0
            ) {

                score -= 1500;

            }

        }

        // ====================================================
        // みがわり
        // ====================================================

        if (
            move.name === "みがわり"
        ) {

            if (
                !attacker.hasSubstitute &&
                v6HpRate(attacker) > 0.35
            ) {

                score += 650;

            } else {

                score -= 800;

            }

        }

        // ====================================================
        // まもる
        // ====================================================

        if (
            move.name === "まもる"
        ) {

            score += 100;

            if (
                v6HpRate(attacker) <= 0.25
            ) {

                score += 700;

            }

        }

        // ====================================================
        // 特性
        // ====================================================

        score +=
            v6AbilityBonus(
                attacker,
                defender,
                move
            );

        // ====================================================
        // 持ち物
        // ====================================================

        score +=
            v6ItemBonus(
                attacker,
                defender,
                move
            );

        // ====================================================
        // 命中率
        // ====================================================

        if (
            move.accuracy !== undefined &&
            v6Num(move.accuracy) > 0
        ) {

            const accuracy =
                v6Num(
                    move.accuracy
                );

            score *=
                accuracy / 100;

        }

        return score;

    }

    // ========================================================
    // 仮想盤面評価
    // ========================================================

    function v6EvaluateBoard(
        board
    ) {

        const me =
            board.opponent;

        const enemy =
            board.player;

        if (!me || !enemy) {

            return 0;

        }

        let score = 0;

        // ====================================================
        // 生存
        // ====================================================

        if (
            !v6Alive(me)
        ) {

            return -50000;

        }

        if (
            !v6Alive(enemy)
        ) {

            return 50000;

        }

        // ====================================================
        // HP
        // ====================================================

        score +=
            (
                v6HpRate(me) -
                v6HpRate(enemy)
            ) * 5000;

        // ====================================================
        // 実数HP
        // ====================================================

        score +=
            (
                v6Hp(me) -
                v6Hp(enemy)
            ) * 1.2;

        // ====================================================
        // 状態異常
        // ====================================================

        if (
            me.status &&
            me.status !== "none"
        ) {

            score -= 500;

        }

        if (
            enemy.status &&
            enemy.status !== "none"
        ) {

            score += 650;

        }

        // ====================================================
        // みがわり
        // ====================================================

        if (
            me.hasSubstitute
        ) {

            score += 650;

        }

        if (
            enemy.hasSubstitute
        ) {

            score -= 650;

        }

        // ====================================================
        // 能力ランク
        // ====================================================

        const myStages =
            v6Stages(me);

        const enemyStages =
            v6Stages(enemy);

        score +=
            (
                myStages.attack +
                myStages.spAttack +
                myStages.speed
            ) * 180;

        score -=
            (
                enemyStages.attack +
                enemyStages.spAttack +
                enemyStages.speed
            ) * 180;

        score +=
            (
                myStages.defense +
                myStages.spDefense
            ) * 120;

        score -=
            (
                enemyStages.defense +
                enemyStages.spDefense
            ) * 120;

        // ====================================================
        // 素早さ
        // ====================================================

        const mySpeed =
            v6EffectiveStat(
                me,
                "speed"
            );

        const enemySpeed =
            v6EffectiveStat(
                enemy,
                "speed"
            );

        if (
            mySpeed > enemySpeed
        ) {

            score += 700;

        } else if (
            mySpeed < enemySpeed
        ) {

            score -= 700;

        }

        // ====================================================
        // 現在の対面
        // ====================================================

        const myMoves =
            v6Moves(me);

        const enemyMoves =
            v6Moves(enemy);

        let myBest = 0;
        let enemyBest = 0;

        for (
            const move of myMoves
        ) {

            myBest =
                Math.max(
                    myBest,
                    v6EvaluateMove(
                        me,
                        enemy,
                        move
                    )
                );

        }

        for (
            const move of enemyMoves
        ) {

            enemyBest =
                Math.max(
                    enemyBest,
                    v6EvaluateMove(
                        enemy,
                        me,
                        move
                    )
                );

        }

        score +=
            myBest * 0.35;

        score -=
            enemyBest * 0.35;

        // ====================================================
        // 残りポケモン数
        // ====================================================

        const myAliveCount =
            board.opponentTeam.filter(
                v6Alive
            ).length;

        const enemyAliveCount =
            board.playerTeam.filter(
                v6Alive
            ).length;

        score +=
            (
                myAliveCount -
                enemyAliveCount
            ) * 4500;

        return v6Clamp(
            score,
            -AI_V6.maxScore,
            AI_V6.maxScore
        );

    }

    // ========================================================
    // 相手の最善手
    // ========================================================

    function v6FindBestEnemyResponse(
        board
    ) {

        const enemy =
            board.player;

        const me =
            board.opponent;

        if (
            !v6Alive(enemy) ||
            !v6Alive(me)
        ) {

            return {
                score:
                    v6EvaluateBoard(board),

                move:
                    null,

                board:
                    board

            };

        }

        const moves =
            v6Moves(enemy);

        if (
            moves.length === 0
        ) {

            return {
                score:
                    v6EvaluateBoard(board),

                move:
                    null,

                board:
                    board

            };

        }

        let bestScore =
            Infinity;

        let bestMove =
            null;

        let bestBoard =
            board;

        for (
            const move of moves
        ) {

            const next =
                v6CloneBoardFrom(
                    board
                );

            v6SimulateMove(
                next.player,
                next.opponent,
                move
            );

            const score =
                v6EvaluateBoard(
                    next
                );

            // プレイヤー側なので
            // AIにとって最も嫌な手を選ぶ
            if (
                score < bestScore
            ) {

                bestScore =
                    score;

                bestMove =
                    move;

                bestBoard =
                    next;

            }

        }

        return {

            score:
                bestScore,

            move:
                bestMove,

            board:
                bestBoard

        };

    }

    // ========================================================
    // 盤面コピー
    // ========================================================

    function v6CloneBoardFrom(
        source
    ) {

        return {

            player:
                v6ClonePokemon(
                    source.player
                ),

            opponent:
                v6ClonePokemon(
                    source.opponent
                ),

            playerTeam:
                source.playerTeam.map(
                    v6ClonePokemon
                ),

            opponentTeam:
                source.opponentTeam.map(
                    v6ClonePokemon
                ),

            weather:
                Object.assign(
                    {},
                    source.weather
                ),

            field:
                Object.assign(
                    {},
                    source.field
                ),

            playerActiveIndex:
                source.playerActiveIndex,

            opponentActiveIndex:
                source.opponentActiveIndex,

            turn:
                source.turn

        };

    }

    // ========================================================
    // V6 2手先探索
    // ========================================================

    function v6Search(
        board,
        depth,
        maximizing
    ) {

        if (
            depth <= 0 ||
            !v6Alive(board.player) ||
            !v6Alive(board.opponent)
        ) {

            return v6EvaluateBoard(
                board
            );

        }

        const actor =
            maximizing
                ? board.opponent
                : board.player;

        const target =
            maximizing
                ? board.player
                : board.opponent;

        const moves =
            v6Moves(actor);

        if (
            moves.length === 0
        ) {

            return v6EvaluateBoard(
                board
            );

        }

        const scoredMoves =
            moves
                .map(
                    move => ({

                        move,

                        score:
                            v6EvaluateMove(
                                actor,
                                target,
                                move
                            )

                    })
                )
                .sort(
                    (a, b) =>
                        b.score -
                        a.score
                )
                .slice(
                    0,
                    AI_V6.beamWidth
                );

        if (maximizing) {

            let best =
                -Infinity;

            for (
                const item of scoredMoves
            ) {

                const next =
                    v6CloneBoardFrom(
                        board
                    );

                v6SimulateMove(
                    next.opponent,
                    next.player,
                    item.move
                );

                const value =
                    v6Search(
                        next,
                        depth - 1,
                        false
                    );

                best =
                    Math.max(
                        best,
                        value
                    );

            }

            return best;

        } else {

            let best =
                Infinity;

            for (
                const item of scoredMoves
            ) {

                const next =
                    v6CloneBoardFrom(
                        board
                    );

                v6SimulateMove(
                    next.player,
                    next.opponent,
                    item.move
                );

                const value =
                    v6Search(
                        next,
                        depth - 1,
                        true
                    );

                best =
                    Math.min(
                        best,
                        value
                    );

            }

            return best;

        }

    }

    // ========================================================
    // V6 最善手
    // ========================================================

    function v6ChooseBestMove() {

        if (
            !opponentPokemon ||
            !playerPokemon
        ) {

            return null;

        }

        const moves =
            v6Moves(
                opponentPokemon
            );

        if (
            moves.length === 0
        ) {

            return null;

        }

        const board =
            v6CloneBoard();

        let bestMove =
            null;

        let bestScore =
            -Infinity;

        // ----------------------------------------------------
        // まず簡易評価
        // ----------------------------------------------------

        const candidates =
            moves
                .map(
                    move => ({

                        move,

                        score:
                            v6EvaluateMove(
                                board.opponent,
                                board.player,
                                move
                            )

                    })
                )
                .sort(
                    (a, b) =>
                        b.score -
                        a.score
                )
                .slice(
                    0,
                    AI_V6.beamWidth
                );

        // ----------------------------------------------------
        // その後、未来を読む
        // ----------------------------------------------------

        for (
            const candidate of candidates
        ) {

            const next =
                v6CloneBoardFrom(
                    board
                );

            v6SimulateMove(
                next.opponent,
                next.player,
                candidate.move
            );

            const future =
                v6Search(
                    next,
                    AI_V6.depth - 1,
                    false
                );

            const immediate =
                candidate.score;

            const finalScore =
                immediate +
                future * 1.15;

            if (
                finalScore >
                bestScore
            ) {

                bestScore =
                    finalScore;

                bestMove =
                    candidate.move;

            }

        }

        // ====================================================
        // デバッグ
        // ====================================================

        window.AI_V6_LAST_MOVE =
            bestMove;

        window.AI_V6_LAST_SCORE =
            bestScore;

        return bestMove;

    }

    // ========================================================
    // V6 交代評価
    // ========================================================

    function v6EvaluateSwitch(
        candidate
    ) {

        if (
            !candidate ||
            !playerPokemon
        ) {

            return -Infinity;

        }

        let score = 0;

        // ====================================================
        // HP
        // ====================================================

        score +=
            v6HpRate(candidate)
            * 1800;

        // ====================================================
        // 相手への最大火力
        // ====================================================

        let bestDamage = 0;
        let bestExpected = 0;

        for (
            const move of
            v6Moves(candidate)
        ) {

            if (
                !v6IsDamagingMove(move)
            ) {

                continue;

            }

            const damage =
                v6Damage(
                    move,
                    candidate,
                    playerPokemon
                );

            const expected =
                v6ExpectedDamage(
                    move,
                    candidate,
                    playerPokemon
                );

            if (
                expected >
                bestExpected
            ) {

                bestExpected =
                    expected;

                bestDamage =
                    damage;

            }

        }

        score +=
            bestExpected * 2.2;

        // ====================================================
        // 確定KO
        // ====================================================

        if (
            bestDamage >=
            v6Hp(playerPokemon)
        ) {

            score += 18000;

        }

        // ====================================================
        // 2HKO
        // ====================================================

        else if (
            bestDamage * 2 >=
            v6Hp(playerPokemon)
        ) {

            score += 5000;

        }

        // ====================================================
        // 相手からの最大火力
        // ====================================================

        let incoming = 0;

        for (
            const move of
            v6Moves(playerPokemon)
        ) {

            if (
                !v6IsDamagingMove(move)
            ) {

                continue;

            }

            incoming =
                Math.max(
                    incoming,
                    v6ExpectedDamage(
                        move,
                        playerPokemon,
                        candidate
                    )
                );

        }

        score -=
            incoming * 2;

        // ====================================================
        // 一撃で倒されるなら大幅減点
        // ====================================================

        let incomingMax = 0;

        for (
            const move of
            v6Moves(playerPokemon)
        ) {

            incomingMax =
                Math.max(
                    incomingMax,
                    v6Damage(
                        move,
                        playerPokemon,
                        candidate
                    )
                );

        }

        if (
            incomingMax >=
            v6Hp(candidate)
        ) {

            score -= 16000;

        }

        // ====================================================
        // タイプ相性
        // ====================================================

        for (
            const move of
            v6Moves(candidate)
        ) {

            if (
                !v6IsDamagingMove(move)
            ) {

                continue;

            }

            const eff =
                v6Effectiveness(
                    move,
                    candidate,
                    playerPokemon
                );

            if (
                eff >= 4
            ) {

                score += 1800;

            } else if (
                eff >= 2
            ) {

                score += 800;

            }

        }

        // ====================================================
        // 相手から受けるタイプ相性
        // ====================================================

        for (
            const move of
            v6Moves(playerPokemon)
        ) {

            if (
                !v6IsDamagingMove(move)
            ) {

                continue;

            }

            const eff =
                v6Effectiveness(
                    move,
                    playerPokemon,
                    candidate
                );

            if (
                eff === 0
            ) {

                score += 1800;

            } else if (
                eff <= 0.5
            ) {

                score += 900;

            } else if (
                eff >= 2
            ) {

                score -= 1500;

            }

        }

        // ====================================================
        // 素早さ
        // ====================================================

        const mySpeed =
            v6EffectiveStat(
                candidate,
                "speed"
            );

        const enemySpeed =
            v6EffectiveStat(
                playerPokemon,
                "speed"
            );

        if (
            mySpeed >
            enemySpeed
        ) {

            score += 600;

        } else {

            score -= 300;

        }

        // ====================================================
        // 状態異常
        // ====================================================

        if (
            candidate.status &&
            candidate.status !== "none"
        ) {

            score -= 700;

        }

        // ====================================================
        // 残りHP
        // ====================================================

        if (
            v6HpRate(candidate) < 0.25
        ) {

            score -= 800;

        }

        return score;

    }

    // ========================================================
    // 最善交代先
    // ========================================================

    function v6ChooseBestSwitch() {

        if (
            !Array.isArray(opponentTeam)
        ) {

            return -1;

        }

        let candidates =
            opponentTeam
                .map(
                    (pokemon, index) => ({
                        pokemon,
                        index
                    })
                )
                .filter(
                    item =>
                        item.index !==
                        opponentActiveIndex &&
                        v6Alive(
                            item.pokemon
                        )
                );

        if (
            candidates.length === 0
        ) {

            return -1;

        }

        candidates =
            candidates
                .map(
                    item => ({

                        ...item,

                        score:
                            v6EvaluateSwitch(
                                item.pokemon
                            )

                    })
                )
                .sort(
                    (a, b) =>
                        b.score -
                        a.score
                )
                .slice(
                    0,
                    AI_V6.switchWidth
                );

        if (
            candidates.length === 0
        ) {

            return -1;

        }

        return candidates[0].index;

    }

    // ========================================================
    // V6 交代するべきか
    // ========================================================

    function v6ShouldSwitch() {

        if (
            difficulty === "easy"
        ) {

            return false;

        }

        if (
            !opponentPokemon ||
            !playerPokemon
        ) {

            return false;

        }

        if (
            !v6Alive(opponentPokemon) ||
            !v6Alive(playerPokemon)
        ) {

            return false;

        }

        if (
            opponentSwitchedLastTurn
        ) {

            return false;

        }

        const switchIndex =
            v6ChooseBestSwitch();

        if (
            switchIndex < 0
        ) {

            return false;

        }

        const candidate =
            opponentTeam[
                switchIndex
            ];

        if (!candidate) {

            return false;

        }

        const switchScore =
            v6EvaluateSwitch(
                candidate
            );

        // ====================================================
        // 現在の対面を評価
        // ====================================================

        let stayScore = 0;

        const currentMove =
            v6ChooseBestMove();

        if (
            currentMove
        ) {

            stayScore =
                v6EvaluateMove(
                    opponentPokemon,
                    playerPokemon,
                    currentMove
                );

        }

        // ====================================================
        // 自分が瀕死なら交代価値を大きく上げる
        // ====================================================

        if (
            v6HpRate(opponentPokemon)
            <= 0.25
        ) {

            if (
                switchScore >
                stayScore
            ) {

                return true;

            }

        }

        // ====================================================
        // 相手から確定KOされるなら交代
        // ====================================================

        let incomingMax = 0;

        for (
            const move of
            v6Moves(playerPokemon)
        ) {

            incomingMax =
                Math.max(
                    incomingMax,
                    v6Damage(
                        move,
                        playerPokemon,
                        opponentPokemon
                    )
                );

        }

        if (
            incomingMax >=
            v6Hp(opponentPokemon)
        ) {

            if (
                switchScore >
                stayScore - 500
            ) {

                return true;

            }

        }

        // ====================================================
        // 通常判定
        // ====================================================

        const advantage =
            switchScore -
            stayScore;

        if (
            difficulty === "hard"
        ) {

            return advantage >= 1400;

        }

        if (
            difficulty === "normal" ||
            difficulty === "ノーマル"
        ) {

            return advantage >= 3000;

        }

        return false;

    }

        // ----------------------------------------------------
        // HPの高い最後の1匹
        // ----------------------------------------------------

        if (
            alive.length > 0
        ) {

            const bestHp =
                Math.max(
                    ...alive.map(
                        v8HpRate
                    )
                );

            score +=
                bestHp *
                2500;

        }

        return score;

    }

    // ========================================================
    // チーム状態評価
    // ========================================================

    function v8EvaluateTeamState(
        myTeam,
        enemyTeam
    ) {

        if (
            !Array.isArray(myTeam) ||
            !Array.isArray(enemyTeam)
        ) {

            return 0;

        }

        let score = 0;

        // ====================================================
        // 生存数
        // ====================================================

        const myAlive =
            v8AliveCount(myTeam);

        const enemyAlive =
            v8AliveCount(enemyTeam);

        score +=
            (
                myAlive -
                enemyAlive
            )
            * AI_V8.aliveWeight;

        // ====================================================
        // 総HP
        // ====================================================

        score +=
            (
                v8TotalHp(myTeam) -
                v8TotalHp(enemyTeam)
            )
            * AI_V8.hpWeight;

        // ====================================================
        // 対面
        // ====================================================

        score +=
            v8TeamMatchup(
                myTeam,
                enemyTeam
            )
            * AI_V8.matchupWeight
            * 0.001;

        // ====================================================
        // KOポテンシャル
        // ====================================================

        score +=
            (
                v8KOPotential(
                    myTeam,
                    enemyTeam
                )
                -
                v8KOPotential(
                    enemyTeam,
                    myTeam
                )
            )
            * AI_V8.koPotentialWeight;

        // ====================================================
        // 終盤性能
        // ====================================================

        score +=
            (
                v8EndgameScore(
                    myTeam,
                    enemyTeam
                )
                -
                v8EndgameScore(
                    enemyTeam,
                    myTeam
                )
            )
            * AI_V8.endgameWeight
            * 0.001;

        // ====================================================
        // 勝敗判定
        // ====================================================

        if (
            enemyAlive === 0 &&
            myAlive > 0
        ) {

            score += 1000000;

        }

        if (
            myAlive === 0 &&
            enemyAlive > 0
        ) {

            score -= 1000000;

        }

        return score;

    }

    // ========================================================

    // ========================================================

    function v8FindBestWinCondition() {

        const myTeam =
            v8GetMyTeam();

        const enemyTeam =
            v8GetEnemyTeam();

        const result = {

            target: null,

            score: -Infinity,

            attacker: null,

            move: null

        };

        for (
            const mine of
            myTeam
        ) {

            if (
                !v8Alive(mine)
            ) continue;

            for (
                const enemy of
                enemyTeam
            ) {

                if (
                    !v8Alive(enemy)
                ) continue;

                for (
                    const move of
                    v8Moves(mine)
                ) {

                    if (
                        v8IsStatus(move)
                    ) continue;

                    const damage =
                        v8Damage(
                            move,
                            mine,
                            enemy
                        );

                    let score =
                        damage;

                    if (
                        damage >=
                        v8Hp(enemy)
                    ) {

                        score += 30000;

                    }

                    if (
                        v8Effectiveness(
                            move,
                            mine,
                            enemy
                        ) >= 2
                    ) {

                        score += 3000;

                    }

                    if (
                        score >
                        result.score
                    ) {

                        result.score =
                            score;

                        result.target =
                            enemy;

                        result.attacker =
                            mine;

                        result.move =
                            move;

                    }

                }

            }

        }

        return result;

    }

    // ========================================================
    // 「このポケモンは絶対に残したい」
    // ========================================================

    function v8PokemonValue(
        pokemon,
        enemyTeam
    ) {

        if (
            !v8Alive(pokemon)
        ) {

            return -Infinity;

        }

        let score = 0;

        // ----------------------------------------------------
        // HP
        // ----------------------------------------------------

        score +=
            v8HpRate(pokemon)
            * 3000;

        // ----------------------------------------------------
        // 相手全員への対面性能
        // ----------------------------------------------------

        if (
            Array.isArray(enemyTeam)
        ) {

            for (
                const enemy of
                enemyTeam
            ) {

                if (
                    !v8Alive(enemy)
                ) continue;

                score +=
                    Math.max(
                        0,
                        v8Matchup(
                            pokemon,
                            enemy
                        )
                    )
                    * 0.15;

            }

        }

        // ----------------------------------------------------
        // 相手を複数匹倒せる可能性
        // ----------------------------------------------------

        let KOCount = 0;

        for (
            const enemy of
            enemyTeam
        ) {

            if (
                !v8Alive(enemy)
            ) continue;

            if (
                v8MaxDamage(
                    pokemon,
                    enemy
                ) >=
                v8Hp(enemy)
            ) {

                KOCount++;

            }

        }

        score +=
            KOCount *
            4000;

        return score;

    }

    // ========================================================
    // 「このポケモンを犠牲にしていいか」
    // ========================================================

    function v8SacrificeValue(
        pokemon,
        myTeam,
        enemyTeam
    ) {

        if (
            !v8Alive(pokemon)
        ) {

            return -Infinity;

        }

        let score = 0;

        const value =
            v8PokemonValue(
                pokemon,
                enemyTeam
            );

        // 価値が低いほど犠牲にしやすい
        score -=
            value;

        // ----------------------------------------------------
        // 相手を削れるなら犠牲価値あり
        // ----------------------------------------------------

        let maxDamage = 0;

        for (
            const enemy of
            enemyTeam
        ) {

            if (
                !v8Alive(enemy)
            ) continue;

            maxDamage =
                Math.max(
                    maxDamage,
                    v8MaxDamage(
                        pokemon,
                        enemy
                    )
                );

        }

        score +=
            maxDamage * 2;

        return score;

    }

    // ========================================================

    // ========================================================

    function v8ClassifyPokemon(
        pokemon,
        enemyTeam
    ) {

        if (
            !pokemon

            return "unknown";

        }

        const hp =
            v8HpRate(pokemon);

        let maxDamage = 0;

        let koCount = 0;

        for (
            const enemy of
            enemyTeam
        ) {

            if (
                !v8Alive(enemy)
            ) continue;

            const damage =
                v8MaxDamage(
                    pokemon,
                    enemy
                );

            maxDamage =
                Math.max(
                    maxDamage,
                    damage
                );

            if (
                damage >=
                v8Hp(enemy)
            ) {

                koCount++;

            }

        }

        // ====================================================
        // フィニッシャー
        // ====================================================

        if (
            koCount >= 2
        ) {

            return "finisher";

        }

        // ====================================================
        // 高火力アタッカー
        // ====================================================

        if (
            maxDamage >= 100
        ) {

            return "attacker";

        }

        // ====================================================
        // 耐久型
        // ====================================================

        if (
            hp >= 0.65
        ) {

            return "wall";

        }

        return "balanced";

        for (

            myTeam

            if (
                pokemon ===

                !v8Alive(pokemon)

            alternatives.push(
                v8PokemonValue(
                    pokemon,
                    enemyTeam
                )
            );

        }

        if (
            alternatives.length === 0
        ) {

            return false;

        }

        const bestAlternative =
            Math.max(
                ...alternatives
            );

        // 現在のポケモンの価値が高い
        if (
            value >

        ) {

        return false;
