    // ========================================================
    // ポケモンID
    // ========================================================

    function pokemonKey(pokemon) {

        if (!pokemon) {

            return "unknown";

        }

        return String(
            pokemon.name ||
            pokemon.species ||
            pokemon.id ||
            "unknown"
        );

    }

    // ========================================================
    // 技ID
    // ========================================================

    function moveKey(move) {

        if (!move) {

            return "unknown";

        }

        return String(
            move.name ||
            move.id ||
            "unknown"
        );

    }

    // ========================================================
    // 状況ID
    //
    // 「誰が誰と戦っていたか」
    // 「HP」
    // 「残り匹数」
    // などをまとめる
    // ========================================================

    function contextKey(
        attacker,
        defender
    ) {

        const a =
            pokemonKey(attacker);

        const d =
            pokemonKey(defender);

        const ah =
            Math.floor(
                hpRate(attacker) * 10
            );

        const dh =
            Math.floor(
                hpRate(defender) * 10
            );

        let myAlive = 0;
        let enemyAlive = 0;

        if (
            Array.isArray(
                opponentTeam
            )
        ) {

            myAlive =
                opponentTeam.filter(
                    alive
                ).length;

        }

        if (
            Array.isArray(
                playerTeam
            )
        ) {

            enemyAlive =
                playerTeam.filter(
                    alive
                ).length;

        }

        return [
            a,
            d,
            ah,
            dh,
            myAlive,
            enemyAlive
        ].join("|");

    }

    // ========================================================
    // カウンター
    // ========================================================

    function addCounter(
        table,
        key,
        amount = 1
    ) {

        if (
            !table[key]
        ) {

            table[key] = 0;

        }

        table[key] += amount;

    }

    // ========================================================
    // 行動記録
    // ========================================================

    function recordAction(data) {

        if (!data) return;

        memory.history.push({

            turn:
                num(
                    data.turn,
                    currentTurn
                ),

            pokemon:
                pokemonKey(
                    data.pokemon
                ),

            opponent:
                pokemonKey(
                    data.opponent
                ),

            move:
                data.move
                    ? moveKey(data.move)
                    : null,

            type:
                data.type || "unknown",

            context:
                data.context || null,

            timestamp:
                Date.now()

        });

        // 古い記録を削除
        while (
            memory.history.length >
            AI_V9.maxHistory
        ) {

            memory.history.shift();

        }

    }

    // ========================================================
    // 技使用を記録
    // ========================================================

    function recordMove(
        pokemon,
        opponent,
        move
    ) {

        if (!move) return;

        const p =
            pokemonKey(pokemon);

        const m =
            moveKey(move);

        if (!memory.moves[p]) {

            memory.moves[p] = {};

        }

        addCounter(
            memory.moves[p],
            m
        );

        const context =
            contextKey(
                pokemon,
                opponent
            );

        if (
            !memory.contexts[context]
        ) {

            memory.contexts[context] = {};

        }

        addCounter(
            memory.contexts[context],
            m
        );

        // ----------------------------------------------------
        // 特殊カテゴリを記録
        // ----------------------------------------------------

        const name =
            move.name || "";

        if (
            name === "でんじは" ||
            name === "おにび" ||
            name === "どくどく" ||
            name === "あくび"
        ) {

            addCounter(
                memory.statuses,
                p
            );

        }

        if (
            name === "つるぎのまい" ||
            name === "りゅうのまい" ||
            name === "わるだくみ" ||
            name === "めいそう"
        ) {

            addCounter(
                memory.setup,
                p
            );

        }

        if (
            name === "じこさいせい" ||
            name === "はねやすめ" ||
            name === "なまける"
        ) {

            addCounter(
                memory.recovery,
                p
            );

        }

        if (
            num(move.priority) > 0
        ) {

            addCounter(
                memory.priority,
                p
            );

        }

        recordAction({

            pokemon,

            opponent,

            move,

            type: "move",

            context

        });

    }

    // ========================================================
    // 交代を記録
    // ========================================================

    function recordSwitch(
        pokemon,
        opponent
    ) {

        const p =
            pokemonKey(pokemon);

        addCounter(
            memory.switches,
            p
        );

        recordAction({

            pokemon,

            opponent,

            type: "switch",

            context:
                contextKey(
                    pokemon,
                    opponent
                )

        });

    }

    // ========================================================
    // 行動カテゴリ
    // ========================================================

    function moveCategory(move) {

        if (!move) {

            return "unknown";

        }

        const name =
            move.name || "";

        if (
            name === "でんじは" ||
            name === "おにび" ||
            name === "どくどく" ||
            name === "あくび"
        ) {

            return "status";

        }

        if (
            name === "つるぎのまい" ||
            name === "りゅうのまい" ||
            name === "わるだくみ" ||
            name === "めいそう"
        ) {

            return "setup";

        }

        if (
            name === "じこさいせい" ||
            name === "はねやすめ" ||
            name === "なまける"
        ) {

            return "recovery";

        }

        if (
            name === "まもる"
        ) {

            return "protect";

        }

        if (
            name === "みがわり"
        ) {

            return "substitute";

        }

        if (
            num(move.priority) > 0
        ) {

            return "priority";

        }

        if (
            num(move.power) > 0
        ) {

            return "attack";

        }

        return "other";

    }

    // ========================================================
    // 学習確率
    // ========================================================

    function learnedMoveProbability(
        pokemon,
        move
    ) {

        const p =
            pokemonKey(pokemon);

        const m =
            moveKey(move);

        const table =
            memory.moves[p];

        if (!table) {

            return 0;

        }

        const total =
            Object.values(table)
                .reduce(
                    (a, b) =>
                        a + num(b),
                    0
                );

        if (
            total <= 0
        ) {

            return 0;

        }

        return (
            num(table[m]) /
            total
        );

    }

    // ========================================================
    // 状況別確率
    // ========================================================

    function contextMoveProbability(
        attacker,
        defender,
        move
    ) {

        const context =
            contextKey(
                attacker,
                defender
            );

        const table =
            memory.contexts[
                context
            ];

        if (!table) {

            return 0;

        }

        const total =
            Object.values(table)
                .reduce(
                    (a, b) =>
                        a + num(b),
                    0
                );

        if (
            total <= 0
        ) {

            return 0;

        }

        return (
            num(
                table[
                    moveKey(move)
                ]
            ) /
            total
        );

    }

    // ========================================================
    // 相手がこの技を使いそうか
    // ========================================================

    function predictMove(
        enemy,
        me,
        move
    ) {

        let score = 0;

        const learned =
            learnedMoveProbability(
                enemy,
                move
            );

        const contextual =
            contextMoveProbability(
                enemy,
                me,
                move
            );

        // ----------------------------------------------------
        // 通常の学習
        // ----------------------------------------------------

        score +=
            learned *
            5000 *
            AI_V9.learningWeight;

        // ----------------------------------------------------
        // 同じ状況での行動
        // ----------------------------------------------------

        score +=
            contextual *
            8000 *
            AI_V9.contextWeight;

        // ----------------------------------------------------
        // カテゴリ別の癖
        // ----------------------------------------------------

        const p =
            pokemonKey(enemy);

        const category =
            moveCategory(move);

        if (
            category === "status"
        ) {

            score +=
                num(
                    memory.statuses[p]
                )
                * 60;

        }

        if (
            category === "setup"
        ) {

            score +=
                num(
                    memory.setup[p]
                )
                * 60;

        }

        if (
            category === "recovery"
        ) {

            score +=
                num(
                    memory.recovery[p]
                )
                * 60;

        }

        if (
            category === "priority"
        ) {

            score +=
                num(
                    memory.priority[p]
                )
                * 40;

        }

        return score;

    }

    // ========================================================
    // 学習込みの相手技ランキング
    // ========================================================

    function rankPredictedEnemyMoves(
        enemy,
        me
    ) {

        return moves(enemy)
            .map(
                move => ({

                    move,

                    learnedScore:
                        predictMove(
                            enemy,
                            me,
                            move
                        )

                })
            )
            .sort(
                (a, b) =>
                    b.learnedScore -
                    a.learnedScore
            );

    }

    // ========================================================
    // 相手の「いつもの行動」を取得
    // ========================================================

    function getLikelyEnemyMove(
        enemy,
        me
    ) {

        const ranked =
            rankPredictedEnemyMoves(
                enemy,
                me
            );

        if (
            ranked.length === 0
        ) {

            return null;

        }

        return ranked[0].move;

    }

    // ========================================================
    // V8連携
    // ========================================================

    function v8ChooseMove() {

        if (
            window.AI_V8_DEBUG &&
            typeof
                window.AI_V8_DEBUG.chooseMove ===
                "function"
        ) {

            try {

                return window.AI_V8_DEBUG
                    .chooseMove();

            } catch (e) {}

        }

        return null;

    }

    function v8ShouldSwitch() {

        if (
            window.AI_V8_DEBUG &&
            typeof
                window.AI_V8_DEBUG.shouldSwitch ===
                "function"
        ) {

            try {

                return window.AI_V8_DEBUG
                    .shouldSwitch();

            } catch (e) {}

        }

        return false;

    }

    // ========================================================
    // 相手の未来行動を学習込みで予測
    // ========================================================

    function predictEnemyAction() {

        if (
            !playerPokemon ||
            !opponentPokemon
        ) {

            return {

                move: null,

                probability: 0,

                category: "unknown"

            };

        }

        const ranked =
            rankPredictedEnemyMoves(
                playerPokemon,
                opponentPokemon
            );

        let bestMove = null;

        let bestScore = -Infinity;

        if (
            ranked.length > 0
        ) {

            bestMove =
                ranked[0].move;

            bestScore =
                ranked[0].learnedScore;

        }

        // ====================================================
        // V7の純粋な戦術評価
        // ====================================================

        if (
            window.AI_V7_DEBUG &&
            typeof
                window.AI_V7_DEBUG.predictMove ===
                "function"
        ) {

            try {

                const v7Move =
                    window.AI_V7_DEBUG
                        .predictMove(
                            playerPokemon,
                            opponentPokemon
                        );

                if (v7Move) {

                    const v7Index =
                        ranked.findIndex(
                            x =>
                                x.move ===
                                v7Move ||
                                (
                                    x.move &&
                                    x.move.name ===
                                    v7Move.name
                                )
                        );

                    if (
                        v7Index >= 0
                    ) {

                        ranked[v7Index]
                            .learnedScore +=
                            5000;

                    }

                    ranked.sort(
                        (a, b) =>
                            b.learnedScore -
                            a.learnedScore
                    );

                    bestMove =
                        ranked[0].move;

                }

            } catch (e) {}

        }

        return {

            move:
                bestMove,

            probability:
                ranked.length > 0
                    ? 1 / ranked.length
                    : 0,

            category:
                moveCategory(
                    bestMove
                )

        };

    }

    // ========================================================
    // AI自身の技に対する
    // 「相手の学習済み反応」を評価
    // ========================================================

    function reactionRisk(
        move
    ) {

        if (
            !move ||
            !playerPokemon ||
            !opponentPokemon
        ) {

            return 0;

        }

        let risk = 0;

        const enemy =
            playerPokemon;

        const me =
            opponentPokemon;

        const enemyMoves =
            moves(enemy);

        for (
            const enemyMove of
            enemyMoves
        ) {

            let predicted =
                predictMove(
                    enemy,
                    me,
                    enemyMove
                );

            // ------------------------------------------------
            // 攻撃
            // ------------------------------------------------

            if (
                num(
                    enemyMove.power
                ) > 0
            ) {

                let damage = 0;

                if (
                    typeof getAIDamage ===
                    "function"
                ) {

                    try {

                        damage =
                            Math.max(
                                0,
                                num(
                                    getAIDamage(
                                        enemyMove,
                                        enemy,
                                        me
                                    )
                                )
                            );

                    } catch (e) {}

                }

                risk +=
                    predicted *
                    damage *
                    0.35;

                // KO
                if (
                    damage >=
                    num(
                        me.currentHp,
                        me.maxHp
                    )
                ) {

                    risk +=
                        predicted *
                        7000;

                }

            }

            // ------------------------------------------------
            // 状態異常
            // ------------------------------------------------

            if (
                moveCategory(
                    enemyMove
                ) === "status"
            ) {

                risk +=
                    predicted *
                    700;

            }

            // ------------------------------------------------
            // 積み技
            // ------------------------------------------------

            if (
                moveCategory(
                    enemyMove
                ) === "setup"
            ) {

                risk +=
                    predicted *
                    1000;

            }

        }

        return risk;

    }

    // ========================================================
    // 学習を考慮した技評価
    // ========================================================

    function evaluateMove(
        move
    ) {

        if (
            !move ||
            !opponentPokemon ||
            !playerPokemon
        ) {

            return -Infinity;

        }

        let score = 0;

        // ====================================================
        // V8
        // ====================================================

        if (
            window.AI_V8_DEBUG &&
            typeof
                window.AI_V8_DEBUG.rankMoves ===
                "function"
        ) {

            try {

                const ranked =
                    window.AI_V8_DEBUG
                        .rankMoves();

                const found =
                    ranked.find(
                        x =>
                            x.move === move ||
                            (
                                x.move &&
                                x.move.name ===
                                move.name
                            )
                    );

                if (found) {

                    score +=
                        found.score;

                }

            } catch (e) {}

        }

        // ====================================================
        // 相手がこの技をどう受けるか
        // ====================================================

        const predictedEnemy =
            getLikelyEnemyMove(
                playerPokemon,
                opponentPokemon
            );

        if (
            predictedEnemy
        ) {

            // ------------------------------------------------
            // まもる
            // ------------------------------------------------

            if (
                move.name ===
                "まもる"
            ) {

                if (
                    num(
                        predictedEnemy.power
                    ) > 0
                ) {

                    score +=
                        3500;

                }

            }

            // ------------------------------------------------
            // 先制技への対策
            // ------------------------------------------------

            if (
                num(
                    predictedEnemy.priority
                ) > 0 &&
                num(
                    move.priority
                ) > 0
            ) {

                score +=
                    500;

            }

        }

        // ====================================================
        // 相手の学習済み反撃
        // ====================================================

        score -=
            reactionRisk(
                move
            )
            * 0.45;

        // ====================================================
        // 同じ状況で過去に成功した技
        // ====================================================

        const context =
            contextKey(
                opponentPokemon,
                playerPokemon
            );

        const contextTable =
            memory.contexts[
                context
            ];

        if (
            contextTable &&
            contextTable[
                moveKey(move)
            ]
        ) {

            score +=
                num(
                    contextTable[
                        moveKey(move)
                    ]
                )
                * 300;

        }

        return score;

    }

    // ========================================================
    // 最終技
    // ========================================================

    function chooseBestMove() {

        const candidates =
            moves(
                opponentPokemon
            );

        if (
            candidates.length === 0
        ) {

            return null;

        }

        const ranked =
            candidates
                .map(
                    move => ({

                        move,

                        score:
                            evaluateMove(
                                move
                            )

                    })
                )
                .sort(
                    (a, b) =>
                        b.score -
                        a.score
                );

        window.AI_V9_MOVE_ANALYSIS =
            ranked;

        return ranked[0].move;

    }

    // ========================================================
    // 交代学習
    // ========================================================

    function learnedSwitchScore(
        pokemon
    ) {

        const p =
            pokemonKey(pokemon);

        return num(
            memory.switches[p]
        ) * 100;

    }

    // ========================================================
    // 交代評価
    // ========================================================

    function evaluateSwitch(
        pokemon
    ) {

        if (
            !pokemon ||
            !alive(pokemon)
        ) {

            return -Infinity;

        }

        let score = 0;

        // ====================================================
        // V8
        // ====================================================

        if (
            window.AI_V8_DEBUG &&
            typeof
                window.AI_V8_DEBUG.pokemonValue ===
                "function"
        ) {

            try {

                score +=
                    window.AI_V8_DEBUG
                        .pokemonValue(
                            pokemon,
                            Array.isArray(
                                playerTeam
                            )
                                ? playerTeam
                                : []
                        );

            } catch (e) {}

        }

        // ====================================================
        // 交代先への相手火力
        // ====================================================

        if (
            typeof getAIDamage ===
            "function"
        ) {

            for (
                const move of
                moves(playerPokemon)
            ) {

                if (
                    num(move.power) <= 0
                ) continue;

                try {

                    const damage =
                        num(
                            getAIDamage(
                                move,
                                playerPokemon,
                                pokemon
                            )
                        );

                    score -=
                        damage * 2;

                    if (
                        damage >=
                        num(
                            pokemon.currentHp,
                            pokemon.maxHp
                        )
                    ) {

                        score -=
                            12000;

                    }

                } catch (e) {}

            }

        }

        // ====================================================
        // 学習
        // ====================================================

        score +=
            learnedSwitchScore(
                pokemon
            );

        return score;

    }

    // ========================================================
    // 最善交代
    // ========================================================

    function chooseBestSwitch() {

        if (
            !Array.isArray(
                opponentTeam
            )
        ) {

            return -1;

        }

        const candidates =
            opponentTeam
                .map(
                    (pokemon, index) => ({

                        pokemon,

                        index,

                        score:
                            evaluateSwitch(
                                pokemon
                            )

                    })
                )
                .filter(
                    item =>
                        item.index !==
                        opponentActiveIndex &&
                        alive(
                            item.pokemon
                        )
                )
                .sort(
                    (a, b) =>
                        b.score -
                        a.score
                );

        if (
            candidates.length === 0
        ) {

            return -1;

        }

        window.AI_V9_SWITCH_ANALYSIS =
            candidates;

        return candidates[0].index;

    }

    // ========================================================
    // 交代判断
    // ========================================================

    function shouldSwitch() {

        if (
            !opponentPokemon ||
            !playerPokemon
        ) {

            return false;

        }

        if (
            opponentSwitchedLastTurn
        ) {

            return false;

        }

        const switchIndex =
            chooseBestSwitch();

        if (
            switchIndex < 0
        ) {

            return false;

        }

        const candidate =
            opponentTeam[
                switchIndex
            ];

        if (!candidate) {

            return false;

        }

        let stayScore =
            -Infinity;

        const currentMove =
            chooseBestMove();

        if (
            currentMove
        ) {

            stayScore =
                evaluateMove(
                    currentMove
                );

        }

        const switchScore =
            evaluateSwitch(
                candidate
            );

        // ====================================================
        // 確定KOされる場合
        // ====================================================

        let incoming = 0;

        for (
            const move of
            moves(playerPokemon)
        ) {

            if (
                num(move.power) <= 0
            ) continue;

            if (
                typeof getAIDamage ===
                "function"
            ) {

                try {

                    incoming =
                        Math.max(
                            incoming,
                            num(
                                getAIDamage(
                                    move,
                                    playerPokemon,
                                    opponentPokemon
                                )
                            )
                        );

                } catch (e) {}

            }

        }

        if (
            incoming >=
            num(
                opponentPokemon.currentHp,
                opponentPokemon.maxHp
            )
        ) {

            return (
                switchScore >
                stayScore * 0.55
            );

        }

        // ====================================================
        // 通常判定
        // ====================================================

        return (
            switchScore >
            stayScore + 1800
        );

    }

    // ========================================================
    // 行動記録を外部から呼べるようにする
    // ========================================================

    window.AI_V9_RECORD = {

        move:
            recordMove,

        switch:
            recordSwitch,

        action:
            recordAction

    };

    // ========================================================
    // デバッグ
    // ========================================================

    window.AI_V9_DEBUG = {

        memory,

        chooseMove,

        chooseSwitch:
            chooseBestSwitch,

        shouldSwitch,

        predictMove:
            getLikelyEnemyMove,

        rankPredictedMoves:
            rankPredictedEnemyMoves,

        learnedProbability:
            learnedMoveProbability,

        contextProbability:
            contextMoveProbability,

        evaluateMove,

        evaluateSwitch,

        reactionRisk

    };

    // ========================================================
    // 既存AIを保存
    // ========================================================

    const oldGetOpponentMove =
        typeof getOpponentMove ===
        "function"
            ? getOpponentMove
            : null;

    const oldShouldOpponentSwitch =
        typeof shouldOpponentSwitch ===
        "function"
            ? shouldOpponentSwitch
            : null;

    const oldChooseBestOpponentSwitch =
        typeof chooseBestOpponentSwitch ===
        "function"
            ? chooseBestOpponentSwitch
            : null;

    // ========================================================
    // 技選択
    // ========================================================

    getOpponentMove =
        function () {

            try {

                if (
                    difficulty ===
                    "easy"
                ) {

                    if (
                        oldGetOpponentMove
                    ) {

                        return
                            oldGetOpponentMove();

                    }

                    return null;

                }

                const move =
                    chooseBestMove();

                if (move) {

                    return move;

                }

            } catch (error) {

                console.error(
                    "AI V9 move error:",
                    error
                );

            }

            if (
                oldGetOpponentMove
            ) {

                return
                    oldGetOpponentMove();

            }

            return null;

        };

    // ========================================================
    // 交代
    // ========================================================

    shouldOpponentSwitch =
        function () {

            try {

                if (
                    difficulty ===
                    "easy"
                ) {

                    return false;

                }

         * これによって alpha-beta pruning の効率を上げる。

                        getActive(

                        depth - 1,

                        alpha,
                        beta

                    Math.max(
                        value,
                        score
                    );

                alpha =
                    Math.max(
                        alpha,
                        value
                    );

                if (beta <= alpha) {
                    break;

            }

            return value;

        } else {

            for (const action of actions) {

                const next =
                    applyAction(
                        state,
                        actorName,
                        action
                    );

                    search(

                        depth - 1,

                        alpha,
                        beta
                    );

                        value,
                        score

                beta =
                    Math.min(

                        value
