// ============================================================
// AI ULTIMATE v1
// index (32).html 専用
// ============================================================
//
// 特徴
// ・確定KO最優先
// ・相手の確定KOを回避
// ・2ターン先まで評価
// ・相手の最善反撃を考慮
// ・タイプ相性
// ・HP残量
// ・素早さ
// ・先制技
// ・状態異常
// ・能力変化
// ・みがわり
// ・まもる
// ・交代可能性
// ・3vs3の残りポケモン
//
// ※実際のゲーム状態を直接変更せず、
//   現在あるAI計算関数を利用して仮想評価する。
// ============================================================


const ULTIMATE_AI_CONFIG = {

    // 探索の深さ
    depth: 3,

    // 候補技を何個まで深く読むか
    maxMoveCandidates: 4,

    // 候補交代先
    maxSwitchCandidates: 3,

    // ランダム性
    hardRandom: 0,

    // 各種重み
    ko: 1000000,
    death: 900000,
    damage: 12,
    hp: 7,
    speed: 180,
    typeAdvantage: 2500,
    typeDisadvantage: 3000,
    status: 1800,
    setup: 1300,
    priority: 700,
    switchAdvantage: 3500,
    remainingPokemon: 5000
};


// ============================================================
// 基本ユーティリティ
// ============================================================

function ultimateAIClamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );

}


function ultimateAIHpRate(pokemon) {

    if (
        !pokemon ||
        !Number.isFinite(pokemon.currentHp) ||
        !Number.isFinite(pokemon.maxHp) ||
        pokemon.maxHp <= 0
    ) {
        return 0;
    }

    return pokemon.currentHp / pokemon.maxHp;

}


function ultimateAIAlive(team) {

    if (!Array.isArray(team)) {
        return 0;
    }

    return team.filter(
        p => p && p.currentHp > 0
    ).length;

}


// ============================================================
// 技が使用可能か
// ============================================================

function ultimateAIUsableMoves(attacker, defender) {

    if (!attacker || !defender) {
        return [];
    }

    let moves = [];

    try {

        moves =
            getAIEffectiveMoves(
                attacker,
                defender
            ) || [];

    } catch (e) {

        moves =
            (attacker.moves || []).filter(
                move =>
                    move &&
                    (move.currentPp ?? 0) > 0
            );

    }

    return moves.filter(
        move =>
            move &&
            (move.currentPp ?? 0) > 0
    );

}


// ============================================================
// ダメージ安全取得
// ============================================================

function ultimateAIDamage(
    move,
    attacker,
    defender
) {

    if (
        !move ||
        !attacker ||
        !defender ||
        move.category === "status" ||
        !move.power
    ) {
        return 0;
    }

    try {

        const damage =
            getAIDamage(
                move,
                attacker,
                defender
            );

        if (Number.isFinite(damage)) {
            return Math.max(0, damage);
        }

    } catch (e) {}

    return 0;

}


function ultimateAIExpectedDamage(
    move,
    attacker,
    defender
) {

    const damage =
        ultimateAIDamage(
            move,
            attacker,
            defender
        );

    let accuracy =
        Number(move.accuracy);

    if (!Number.isFinite(accuracy)) {
        accuracy = 100;
    }

    accuracy =
        ultimateAIClamp(
            accuracy,
            0,
            100
        ) / 100;

    return damage * accuracy;

}


// ============================================================
// タイプ相性
// ============================================================

function ultimateAITypeEffectiveness(
    move,
    attacker,
    defender
) {

    try {

        const value =
            getAITypeEffectiveness(
                move,
                attacker,
                defender
            );

        if (Number.isFinite(value)) {
            return value;
        }

    } catch (e) {}

    return 1;

}


// ============================================================
// 先制・素早さ
// ============================================================

function ultimateAIGoesFirst(
    moveA,
    pokemonA,
    moveB,
    pokemonB
) {

    try {

        return doesAIMoveGoFirst(
            moveA,
            pokemonA,
            moveB,
            pokemonB
        );

    } catch (e) {}

    const priorityA =
        Number(moveA?.priority || 0);

    const priorityB =
        Number(moveB?.priority || 0);

    if (priorityA !== priorityB) {
        return priorityA > priorityB;
    }

    let speedA = 0;
    let speedB = 0;

    try {

        speedA =
            pokemonA.speed *
            getStatModifier(
                pokemonA.statStages?.speed || 0
            );

        speedB =
            pokemonB.speed *
            getStatModifier(
                pokemonB.statStages?.speed || 0
            );

    } catch (e) {

        speedA =
            Number(pokemonA.speed || 0);

        speedB =
            Number(pokemonB.speed || 0);

    }

    return speedA >= speedB;

}


// ============================================================
// KO判定
// ============================================================

function ultimateAIIsKO(
    move,
    attacker,
    defender
) {

    if (
        !move ||
        !attacker ||
        !defender
    ) {
        return false;
    }

    if (move.category === "status") {
        return false;
    }

    const damage =
        ultimateAIDamage(
            move,
            attacker,
            defender
        );

    return damage >= defender.currentHp;

}


// ============================================================
// 2発KO
// ============================================================

function ultimateAIIsTwoHKO(
    move,
    attacker,
    defender
) {

    if (
        !move ||
        move.category === "status"
    ) {
        return false;
    }

    const damage =
        ultimateAIDamage(
            move,
            attacker,
            defender
        );

    return damage > 0 &&
           damage * 2 >= defender.currentHp;

}


// ============================================================
// 相手が自分をKOできるか
// ============================================================

function ultimateAIEnemyCanKO(
    attacker,
    defender
) {

    const enemyMoves =
        ultimateAIUsableMoves(
            attacker,
            defender
        );

    for (const move of enemyMoves) {

        if (
            ultimateAIIsKO(
                move,
                attacker,
                defender
            )
        ) {
            return true;
        }

    }

    return false;

}


// ============================================================
// 相手の最強攻撃
// ============================================================

function ultimateAIBestAttack(
    attacker,
    defender
) {

    const moves =
        ultimateAIUsableMoves(
            attacker,
            defender
        );

    let best = null;

    for (const move of moves) {

        if (
            move.category === "status" ||
            !move.power
        ) {
            continue;
        }

        const damage =
            ultimateAIDamage(
                move,
                attacker,
                defender
            );

        const expected =
            ultimateAIExpectedDamage(
                move,
                attacker,
                defender
            );

        const ko =
            damage >= defender.currentHp;

        let score =
            expected;

        if (ko) {
            score += 1000000;
        }

        if (
            !best ||
            score > best.score
        ) {

            best = {
                move,
                damage,
                expected,
                score
            };

        }

    }

    return best;

}


// ============================================================
// 技そのものの評価
// ============================================================

function ultimateAIMoveScore(
    move,
    attacker,
    defender
) {

    if (
        !move ||
        !attacker ||
        !defender
    ) {
        return -Infinity;
    }

    let score = 0;

    const isStatus =
        move.category === "status";

    const damage =
        ultimateAIDamage(
            move,
            attacker,
            defender
        );

    const expected =
        ultimateAIExpectedDamage(
            move,
            attacker,
            defender
        );

    const effectiveness =
        ultimateAITypeEffectiveness(
            move,
            attacker,
            defender
        );


    // ========================================================
    // ① KO
    // ========================================================

    if (
        !isStatus &&
        damage >= defender.currentHp
    ) {

        score +=
            ULTIMATE_AI_CONFIG.ko;

    }


    // ========================================================
    // ② ダメージ
    // ========================================================

    score +=
        expected *
        ULTIMATE_AI_CONFIG.damage;


    if (defender.maxHp > 0) {

        score +=
            (
                expected /
                defender.maxHp
            ) *
            10000;

    }


    // ========================================================
    // ③ 2HKO
    // ========================================================

    if (
        !isStatus &&
        damage * 2 >= defender.currentHp
    ) {

        score += 15000;

    }


    // ========================================================
    // ④ タイプ相性
    // ========================================================

    if (effectiveness >= 4) {

        score +=
            ULTIMATE_AI_CONFIG.typeAdvantage *
            2;

    }
    else if (effectiveness >= 2) {

        score +=
            ULTIMATE_AI_CONFIG.typeAdvantage;

    }
    else if (effectiveness === 0) {

        score -= 30000;

    }
    else if (effectiveness <= 0.25) {

        score -=
            ULTIMATE_AI_CONFIG.typeDisadvantage;

    }
    else if (effectiveness <= 0.5) {

        score -=
            ULTIMATE_AI_CONFIG.typeDisadvantage /
            2;

    }


    // ========================================================
    // ⑤ 命中率
    // ========================================================

    let accuracy =
        Number(move.accuracy);

    if (!Number.isFinite(accuracy)) {
        accuracy = 100;
    }

    if (accuracy < 100) {

        score *=
            accuracy / 100;

    }


    // ========================================================
    // ⑥ 先制技
    // ========================================================

    const priority =
        Number(move.priority || 0);

    if (priority > 0) {

        score +=
            priority *
            ULTIMATE_AI_CONFIG.priority;

        if (
            ultimateAIEnemyCanKO(
                defender,
                attacker
            )
        ) {

            score += 10000;

        }

    }


    // ========================================================
    // ⑦ 状態異常
    // ========================================================

    if (
        move.secondary &&
        move.secondary.effect
    ) {

        const effect =
            move.secondary.effect;

        if (
            effect === "status" ||
            effect === "flinch"
        ) {

            score +=
                ULTIMATE_AI_CONFIG.status;

        }

        if (
            effect === "stat"
        ) {

            score +=
                ULTIMATE_AI_CONFIG.setup;

        }

    }


    // ========================================================
    // ⑧ 技自身による能力下降
    // ========================================================

    if (
        move.self &&
        move.self.stats
    ) {

        for (
            const stat of move.self.stats
        ) {

            if (
                Number(stat.stage) < 0
            ) {

                score +=
                    Number(stat.stage) *
                    1000;

            }

        }

    }


    // ========================================================
    // ⑨ 反動
    // ========================================================

    try {

        score -=
            getAIRecoilPenalty(
                move,
                attacker,
                defender
            );

    } catch (e) {}


    // ========================================================
    // ⑩ 既存AI評価も利用
    // ========================================================

    try {

        const oldScore =
            evaluateAIMove(
                move,
                attacker,
                defender
            );

        if (
            Number.isFinite(oldScore)
        ) {

            score +=
                oldScore * 0.75;

        }

    } catch (e) {}


    return score;

}


// ============================================================
// 「この技を使ったあと、自分が生き残るか」
// ============================================================

function ultimateAISurvivalScore(
    move,
    attacker,
    defender
) {

    let score = 0;

    const damage =
        ultimateAIDamage(
            move,
            attacker,
            defender
        );

    const predictedEnemyHp =
        Math.max(
            0,
            defender.currentHp -
            damage
        );


    // 相手を倒せるなら超重要
    if (
        predictedEnemyHp <= 0
    ) {

        score += 50000;

        return score;

    }


    const enemyBest =
        ultimateAIBestAttack(
            defender,
            attacker
        );

    if (!enemyBest) {
        return score;
    }


    const enemyDamage =
        enemyBest.damage;


    // 次のターンに確実に死ぬ
    if (
        enemyDamage >=
        attacker.currentHp
    ) {

        score -= 50000;

    }
    else {

        const remain =
            attacker.currentHp -
            enemyBest.expected;

        score +=
            (
                remain /
                Math.max(
                    1,
                    attacker.maxHp
                )
            ) *
            15000;

    }


    return score;

}


// ============================================================
// 状態異常・補助技評価
// ============================================================

function ultimateAIStatusScore(
    move,
    attacker,
    defender
) {

    if (
        !move ||
        move.category !== "status"
    ) {
        return 0;
    }

    let score = 0;

    const name =
        move.name || "";


    // --------------------------------------------------------
    // まもる
    // --------------------------------------------------------

    if (
        name === "まもる" ||
        name === "キングシールド"
    ) {

        const enemyBest =
            ultimateAIBestAttack(
                defender,
                attacker
            );

        if (
            enemyBest &&
            enemyBest.damage >=
            attacker.currentHp
        ) {

            score += 30000;

        }
        else {

            score += 300;

        }

    }


    // --------------------------------------------------------
    // みがわり
    // --------------------------------------------------------

    if (
        name === "みがわり"
    ) {

        if (
            !attacker.hasSubstitute
        ) {

            if (
                attacker.currentHp >
                attacker.maxHp * 0.30
            ) {

                score += 3500;

            }

        }
        else {

            score -= 5000;

        }

    }


    // --------------------------------------------------------
    // めいそう
    // --------------------------------------------------------

    if (
        name === "めいそう"
    ) {

        score += 3000;

        if (
            ultimateAIEnemyCanKO(

function ultimateAIEvaluateMove(
    move,
    attacker,
    defender
) {

        !attacker ||
        !defender
    ) {
        return -Infinity;
    }

    let score =
        ultimateAIMoveScore(
            move,
            attacker,
            defender
        );


    score +=
        ultimateAISurvivalScore(
            move,
            attacker,
            defender
        );


    score +=
        ultimateAIStatusScore(
            move,
            attacker,
            defender
        );


    // --------------------------------------------------------
    // 既存未来評価
    // --------------------------------------------------------

    try {

        const future =
            getAIFutureScore(
                move
            );

        if (
            Number.isFinite(future)
        ) {

            score +=
                future * 0.8;

        }

    } catch (e) {}


    // --------------------------------------------------------
    // 既存交代読み
    // --------------------------------------------------------

    try {

        score +=
            getAISwitchReadScore(
                move,
                attacker,
                defender
            ) * 0.7;

    } catch (e) {}


    // --------------------------------------------------------

    // --------------------------------------------------------

    try {

        score +=
            getAIPersonalityBonus(
                move,
                attacker,
                defender
            );

    } catch (e) {}


    return score;

}


// ============================================================
// 相手の「最悪の返し」を読む
// ============================================================

function ultimateAIWorstResponse(
    myMove,
    attacker,
    defender
) {

    const enemyMoves =
        ultimateAIUsableMoves(
            defender,
            attacker
        );

    if (
        enemyMoves.length === 0
    ) {
        return 0;
    }


    let worst =
        Infinity;


    for (
        const enemyMove of enemyMoves
    ) {

        let responseScore = 0;


        const enemyDamage =
            ultimateAIDamage(
                enemyMove,
                defender,
                attacker
            );


        const enemyExpected =
            ultimateAIExpectedDamage(
                enemyMove,
                defender,
                attacker
            );


        // 自分が次ターンに死ぬ
        if (
            enemyDamage >=
            attacker.currentHp
        ) {

            responseScore -=
                100000;

        }


        responseScore -=
            enemyExpected * 15;


        // 相手が先制できる場合は危険
        if (
            ultimateAIGoesFirst(
                enemyMove,
                defender,
                myMove,
                attacker
            )
        ) {

            responseScore -=
                3000;

        }


        // 相手の状態異常
        if (
            enemyMove.category ===
            "status"
        ) {

            responseScore -=
                ultimateAIStatusScore(
                    enemyMove,
                    defender,
                    attacker
                ) * 0.7;

        }


        worst =
            Math.min(
                worst,
                responseScore
            );

    }


    return worst === Infinity
        ? 0
        : worst;

}

    ) *

// ============================================================
// 現在の盤面評価
// ============================================================

function ultimateAIBoardEvaluation() {

    if (
        !opponentPokemon ||
        !playerPokemon
    ) {
        return 0;
    }

    let score = 0;


    // --------------------------------------------------------
    // HP
    // --------------------------------------------------------

    score +=
        ultimateAIHpRate(
            opponentPokemon
        ) *
        ULTIMATE_AI_CONFIG.hp *
        1000;


    score -=
        ultimateAIHpRate(
            playerPokemon
        ) *
        ULTIMATE_AI_CONFIG.hp *
        1000;


    // --------------------------------------------------------
    // KO済み
    // --------------------------------------------------------

    if (
        playerPokemon.currentHp <= 0
    ) {

        score +=
            ULTIMATE_AI_CONFIG.ko;

    }


    if (
        opponentPokemon.currentHp <= 0
    ) {

        score -=
            ULTIMATE_AI_CONFIG.death;

    }


    // --------------------------------------------------------
    // 素早さ
    // --------------------------------------------------------

    try {

        const mySpeed =
            opponentPokemon.speed *
            getStatModifier(
                opponentPokemon.statStages?.speed || 0
            );

        const enemySpeed =
            playerPokemon.speed *
            getStatModifier(
                playerPokemon.statStages?.speed || 0
            );

        if (
            mySpeed > enemySpeed
        ) {

            score +=
                ULTIMATE_AI_CONFIG.speed;

        }
        else if (
            mySpeed < enemySpeed
        ) {

            score -=
                ULTIMATE_AI_CONFIG.speed;

        }

    } catch (e) {}


    // --------------------------------------------------------
    // 残りポケモン
    // --------------------------------------------------------

    score +=
        ultimateAITeamValue();


    return score;

}


// ============================================================
// 仮想1手評価
// ============================================================

function ultimateAISimulateMoveScore(
    move,
    attacker,
    defender
) {

    if (
        !move ||
        !attacker ||
        !defender
    ) {
        return -Infinity;
    }


    let score =
        ultimateAIEvaluateMove(
            move,
            attacker,
            defender
        );


    // --------------------------------------------------------
    // 仮想HP
    // --------------------------------------------------------

    const damage =
        ultimateAIDamage(
            move,
            attacker,
            defender
        );


    const enemyHpAfter =
        Math.max(
            0,
            defender.currentHp -
            damage
        );


    score +=
        (
            defender.currentHp -
            enemyHpAfter
        ) *
        10;


    // KO
    if (
        enemyHpAfter <= 0
    ) {

        score +=
            ULTIMATE_AI_CONFIG.ko;

    }


    // --------------------------------------------------------
    // 相手の最善反撃
    // --------------------------------------------------------

    score +=
        ultimateAIWorstResponse(
            move,
            attacker,
            defender
        );


    return score;

}


// ============================================================
// 深さ2～3の探索
// ============================================================

function ultimateAIMinimax(
    attacker,
    defender,
    depth,
    maximizing
) {

    if (
        !attacker ||
        !defender
    ) {
        return 0;
    }


    if (
        depth <= 0
    ) {

        return ultimateAIBoardEvaluation();

    }


    const moves =
        ultimateAIUsableMoves(
            attacker,
            defender
        );


    if (
        moves.length === 0
    ) {

        return ultimateAIBoardEvaluation();

    }


    // --------------------------------------------------------
    // 候補を事前評価
    // --------------------------------------------------------

    const ranked =
        moves
            .map(move => ({

                move,

                score:
                    ultimateAIEvaluateMove(
                        move,
                        attacker,
                        defender
                    )

            }))
            .sort(
                (a, b) =>
                    b.score -
                    a.score
            )
            .slice(
                0,
                ULTIMATE_AI_CONFIG.maxMoveCandidates
            );


    let best =
        maximizing
            ? -Infinity
            : Infinity;


    for (
        const candidate of ranked
    ) {

        const move =
            candidate.move;


        let immediate =
            ultimateAISimulateMoveScore(
                move,
                attacker,
                defender
            );


        // ----------------------------------------------------
        // 深読み
        //
        // 実際のHPは変更しない。
        // 現在の盤面評価＋最善反撃で近似。
        // ----------------------------------------------------

        const enemyBest =
            ultimateAIBestAttack(
                defender,
                attacker
            );


        if (enemyBest) {

            const incoming =
                enemyBest.expected;


            if (
                incoming >=
                attacker.currentHp
            ) {

                immediate -=
                    ULTIMATE_AI_CONFIG.death;

            }
            else {

                immediate -=
                    incoming * 10;

            }

        }


        if (
            maximizing
        ) {

            best =
                Math.max(
                    best,
                    immediate
                );

        }
        else {

            best =
                Math.min(
                    best,
                    immediate
                );

        }

    }


    return best;

}


// ============================================================
// 最終候補評価
// ============================================================

function ultimateAIFinalMoveScore(
    move,
    attacker,
    defender
) {

    let score =
        ultimateAIEvaluateMove(
            move,
            attacker,
            defender
        );


    // --------------------------------------------------------
    // Minimax
    // --------------------------------------------------------

    const mini =
        ultimateAIMinimax(
            attacker,
            defender,
            ULTIMATE_AI_CONFIG.depth,
            true
        );


    if (
        Number.isFinite(mini)
    ) {

        score +=
            mini * 0.45;

    }


    // --------------------------------------------------------
    // 相手の最善反撃
    // --------------------------------------------------------

    score +=
        ultimateAIWorstResponse(
            move,
            attacker,
            defender
        ) *
        1.25;


    // --------------------------------------------------------
    // 確定KOは絶対優先
    // --------------------------------------------------------

    if (
        ultimateAIIsKO(
            move,
            attacker,
            defender
        )
    ) {

        score +=
            1000000;

    }


    // --------------------------------------------------------
    // 自分が死ぬなら大幅減点
    // --------------------------------------------------------

    if (
        ultimateAIEnemyCanKO(
            defender,
            attacker
        ) &&
        !ultimateAIIsKO(
            move,
            attacker,
            defender
        )
    ) {

        const priority =
            Number(
                move.priority || 0
            );

        if (priority <= 0) {

            score -=
                40000;

        }

    }


    return score;

}


// ============================================================
// AI ULTIMATE：最終的な技選択
// ============================================================

function getOpponentMoveUltimateAI() {

    const attacker =
        opponentPokemon;

    const defender =
        playerPokemon;


    if (
        !attacker ||
        !defender
    ) {
        return null;
    }


    const moves =
        ultimateAIUsableMoves(
            attacker,
            defender
        );


    if (
        moves.length === 0
    ) {
        return null;
    }


    // ========================================================
    // 最優先：確定KO
    // ========================================================

    const koMoves =
        moves.filter(
            move =>
                ultimateAIIsKO(
                    move,
                    attacker,
                    defender
                )
        );


    if (
        koMoves.length > 0
    ) {

        let bestKO =
            koMoves[0];

        let bestKOScore =
            -Infinity;


        for (
            const move of koMoves
        ) {

            let score = 0;


            const damage =
                ultimateAIDamage(
                    move,
                    attacker,
                    defender
                );


            const accuracy =
                Number(
                    move.accuracy ?? 100
                );


            const priority =
                Number(
                    move.priority || 0
                );


            score +=
                damage * 10;

            score +=
                accuracy * 50;

            score +=
                priority * 500;


            if (
                score >
                bestKOScore
            ) {

                bestKOScore =
                    score;

                bestKO =
                    move;

            }

        }


        return bestKO;

    }


    // ========================================================
    // 全技を探索
    // ========================================================

    const scored =
        moves.map(
            move => ({

                move,

                score:
                    ultimateAIFinalMoveScore(
                        move,
                        attacker,
                        defender
                    )

            })
        );


    scored.sort(
        (a, b) =>
            b.score -
            a.score
    );


    if (
        scored.length === 1
    ) {
        return scored[0].move;
    }


    // ========================================================
    // HARD
    // ========================================================

    if (
        difficulty === "hard"
    ) {

        return scored[0].move;

    }


    // ========================================================
    // NORMAL
    // 強い候補だけから選択
    // ========================================================

    if (
        difficulty === "normal"
    ) {

        const best =
            scored[0].score;

        const candidates =
            scored.filter(
                item =>
                    item.score >=
                    best * 0.90
            );


        if (
            candidates.length > 0
        ) {

            return
                candidates[
                    Math.floor(
                        Math.random() *
                        candidates.length
                    )
                ].move;

        }

        return scored[0].move;

    }


    // ========================================================
    // EASY
    // ========================================================

    const easyCandidates =
        scored.slice(
            0,
            Math.min(
                3,
                scored.length
            )
        );


    return
        easyCandidates[
            Math.floor(
                Math.random() *
                easyCandidates.length
            )
        ].move;

}

// ============================================================
// ULTIMATE AI 交代評価
// ============================================================

function ultimateAIChooseSwitch() {

    if (
        !Array.isArray(opponentTeam) ||
        !Array.isArray(playerTeam)
    ) {
        return -1;
    }


    const candidates =
        opponentTeam
            .map(
                (pokemon, index) => ({
                    pokemon,
                    index
                })
            )
            .filter(
                ({ pokemon, index }) =>
                    index !==
                        opponentActiveIndex &&
                    pokemon &&
                    pokemon.currentHp > 0
            );


    if (
        candidates.length === 0
    ) {
        return -1;
    }


    let bestIndex =
        -1;

    let bestScore =
        -Infinity;


    for (
        const candidate of candidates
    ) {

        const pokemon =
            candidate.pokemon;

        let score = 0;


        // ====================================================
        // HP
        // ====================================================

        score +=
            ultimateAIHpRate(
                pokemon
            ) *
            5000;


        // ====================================================
        // 今の相手への攻撃性能
        // ====================================================

        const attack =
            ultimateAIBestAttack(
                pokemon,
                playerPokemon
            );


        if (attack) {

            score +=
                attack.expected * 15;


            if (
                attack.damage >=
                playerPokemon.currentHp
            ) {

                score +=
                    150000;

            }


            const effectiveness =
                ultimateAITypeEffectiveness(
                    attack.move,
                    pokemon,
                    playerPokemon
                );


            if (
                effectiveness >= 2
            ) {

                score +=
                    12000;

            }


            if (
                effectiveness >= 4
            ) {

                score +=
                    10000;

            }


            if (
                effectiveness === 0
            ) {

                score -=
                    30000;

            }

        }


        // ====================================================
        // 出した瞬間に倒されないか
        // ====================================================

        const incoming =
            ultimateAIBestAttack(
                playerPokemon,
                pokemon
            );


        if (incoming) {

            score -=
                incoming.expected * 12;


            if (
                incoming.damage >=
                pokemon.currentHp
            ) {

                score -=
                    180000;

            }
            else if (
                incoming.damage * 2 >=
                pokemon.currentHp
            ) {

                score -=
                    25000;

            }

        }


        // ====================================================
        // タイプ相性を全残りポケモンで確認
        // ====================================================

        for (
            const enemy of playerTeam
        ) {

            if (
                !enemy ||
                enemy.currentHp <= 0
            ) {
                continue;
            }


            const bestAttack =
                ultimateAIBestAttack(
                    pokemon,
                    enemy
                );


            if (
                !bestAttack
            ) {
                continue;
            }


            score +=
                bestAttack.expected *
                2;


            if (
                bestAttack.damage >=
                enemy.currentHp
            ) {

                score +=
                    20000;

            }

        }


        // ====================================================
        // 残りポケモン数
        // ====================================================

        score +=
            ultimateAIAlive(
                opponentTeam
            ) *
            1000;


        // ====================================================
        // 現在の交代候補として最終評価
        // ====================================================

        if (
            score >
            bestScore
        ) {

            bestScore =
                score;

            bestIndex =
                candidate.index;

        }

    }


    return bestIndex;

}

// ============================================================
// 安全な数値
// ============================================================

function aiV2Number(value, fallback = 0) {

    return Number.isFinite(Number(value))
        ? Number(value)
        : fallback;

}


// ============================================================
// HP割合
// ============================================================

function aiV2HpRate(pokemon) {

    if (
        !pokemon ||
        !pokemon.maxHp ||
        pokemon.maxHp <= 0
    ) {
        return 0;
    }

    return Math.max(
        0,
        Math.min(
            1,
            pokemon.currentHp /
            pokemon.maxHp
        )
    );

}


// ============================================================
// 生存ポケモン数
// ============================================================

function aiV2AliveCount(team) {

    if (!Array.isArray(team)) {
        return 0;
    }

    return team.filter(
        p =>
            p &&
            p.currentHp > 0
    ).length;

}


// ============================================================
// 使用可能技
// ============================================================

function aiV2GetMoves(
    attacker,
    defender
) {

    if (
        !attacker ||
        !defender
    ) {
        return [];
    }

    let moves = [];

    try {

        moves =
            getAIEffectiveMoves(
                attacker,
                defender
            ) || [];

    }
    catch (e) {

        moves =
            (attacker.moves || [])
                .filter(
                    move =>
                        move &&
                        (move.currentPp ?? 0) > 0
                );

    }

    return moves.filter(
        move =>
            move &&
            (move.currentPp ?? 0) > 0
    );

}


// ============================================================
// ダメージ
// ============================================================

function aiV2Damage(
    move,
    attacker,
    defender
) {

    if (
        !move ||
        !attacker ||
        !defender
    ) {
        return 0;
    }

    if (
        move.category === "status" ||
        !move.power
    ) {
        return 0;
    }

    try {

        const value =
            getAIDamage(
                move,
                attacker,
                defender
            );

        return Math.max(
            0,
            aiV2Number(value)
        );

    }
    catch (e) {

        return 0;

    }

}


// ============================================================
// 命中率
// ============================================================

function aiV2Accuracy(move) {

    let accuracy =
        aiV2Number(
            move?.accuracy,
            100
        );

    return Math.max(
        0,
        Math.min(
            100,
            accuracy
        )
    ) / 100;

}


// ============================================================
// 期待ダメージ
// ============================================================

function aiV2ExpectedDamage(
    move,
    attacker,
    defender
) {

    return (
        aiV2Damage(
            move,
            attacker,
            defender
        ) *
        aiV2Accuracy(move)
    );

}

// KO
// ============================================================

function aiV2KO(
    move,
    attacker,
    defender
) {

    return (
        aiV2Damage(
            move,
            attacker,
            defender
        ) >=
        defender.currentHp
    );

}


// ============================================================
// 2発KO
// ============================================================

function aiV2TwoHKO(
    move,
    attacker,
    defender
) {

    const damage =
        aiV2Damage(
            move,
            attacker,
            defender
        );

    return (
        damage > 0 &&
        damage * 2 >=
        defender.currentHp
    );

}


// ============================================================
// 相性
// ============================================================

function aiV2Effectiveness(
    move,
    attacker,
    defender
) {

    try {

        return getAITypeEffectiveness(
            move,
            attacker,
            defender
        );

    }
    catch (e) {

        return 1;

    }

}


// ============================================================
// 相手の最強攻撃
// ============================================================

function aiV2BestEnemyAttack(
    attacker,
    defender
) {

    const moves =
        aiV2GetMoves(
            attacker,
            defender
        );

    let best = null;


    for (
        const move of moves
    ) {

        if (
            move.category ===
            "status"
        ) {
            continue;
        }


        const damage =
            aiV2Damage(
                move,
                attacker,
                defender
            );

        const expected =
            aiV2ExpectedDamage(
                move,
                attacker,
                defender
            );


        let score =
            expected;


        if (
            damage >=
            defender.currentHp
        ) {

            score +=
                ULTIMATE_AI_V2.guaranteedKO;

        }


        if (
            !best ||
            score > best.score
        ) {

            best = {

                move,
                damage,
                expected,
                score

            };

        }

    }


    return best;

}


// ============================================================
// 相手が確定KOを持っているか
// ============================================================

function aiV2EnemyHasKO(
    attacker,
    defender
) {

    const best =
        aiV2BestEnemyAttack(
            attacker,
            defender
        );

    return (
        best &&
        best.damage >=
        defender.currentHp
    );

}


// ============================================================
// 先制判定
// ============================================================

function aiV2First(
    moveA,
    pokemonA,
    moveB,
    pokemonB
) {

    try {

        return doesAIMoveGoFirst(
            moveA,
            pokemonA,
            moveB,
            pokemonB
        );

    }
    catch (e) {}


    const priorityA =
        aiV2Number(
            moveA?.priority
        );

    const priorityB =
        aiV2Number(
            moveB?.priority
        );


    if (
        priorityA !==
        priorityB
    ) {

        return (
            priorityA >
            priorityB
        );

    }


    const speedA =
        aiV2Number(
            pokemonA?.speed
        );

    const speedB =
        aiV2Number(
            pokemonB?.speed
        );


    return (
        speedA >=
        speedB
    );

}


// ============================================================
// 技の基本評価
// ============================================================

function aiV2EvaluateAttack(
    move,
    attacker,
    defender
) {

    let score = 0;


    const damage =
        aiV2Damage(
            move,
            attacker,
            defender
        );

    const expected =
        aiV2ExpectedDamage(
            move,
            attacker,
            defender
        );


    // --------------------------------------------------------
    // ダメージ
    // --------------------------------------------------------

    score +=
        expected *
        ULTIMATE_AI_V2.damage;


    if (
        defender.maxHp > 0
    ) {

        score +=
            (
                expected /
                defender.maxHp
            ) *
            15000;

    }


    // --------------------------------------------------------
    // 確定KO
    // --------------------------------------------------------

    if (
        damage >=
        defender.currentHp
    ) {

        score +=
            ULTIMATE_AI_V2.guaranteedKO;

    }


    // --------------------------------------------------------
    // 2発KO
    // --------------------------------------------------------

    else if (
        damage * 2 >=
        defender.currentHp
    ) {

        score +=
            ULTIMATE_AI_V2.likelyKO;

    }


    // --------------------------------------------------------
    // タイプ相性
    // --------------------------------------------------------

    const effectiveness =
        aiV2Effectiveness(
            move,
            attacker,
            defender
        );


    if (
        effectiveness >= 4
    ) {

        score +=
            ULTIMATE_AI_V2.superEffective *
            2;

    }
    else if (
        effectiveness >= 2
    ) {

        score +=
            ULTIMATE_AI_V2.superEffective;

    }
    else if (
        effectiveness === 0
    ) {

        score -=
            50000;

    }
    else if (
        effectiveness <= 0.25
    ) {

        score -=
            ULTIMATE_AI_V2.resistance;

    }
    else if (
        effectiveness <= 0.5
    ) {

        score -=
            ULTIMATE_AI_V2.resistance / 2;

    }


    // --------------------------------------------------------
    // 命中率
    // --------------------------------------------------------

    score *=
        aiV2Accuracy(move);


    // --------------------------------------------------------
    // 先制技
    // --------------------------------------------------------

    const priority =
        aiV2Number(
            move.priority
        );


    if (
        priority > 0
    ) {

        score +=
            priority *
            1200;


        // 相手のKO技を先制で止められる
        if (
            aiV2EnemyHasKO(
                defender,
                attacker
            )
        ) {

            score +=
                20000;

        }

    }


    // --------------------------------------------------------
    // 既存AI
    // --------------------------------------------------------

    try {

        score +=
            evaluateAIMove(
                move,
                attacker,
                defender
            ) * 0.75;

    }
    catch (e) {}


    return score;

}


// ============================================================
// 補助技評価
// ============================================================

function aiV2EvaluateStatus(
    move,
    attacker,
    defender
) {

    let score = 0;

    const name =
        move.name || "";

        // ========================================================
    // 【追加】無意味な補助技を使わない判定
    // ========================================================

    // --------------------------------------------------------
    // おにび
    // すでに状態異常なら基本的に使う価値なし
    // ほのおタイプにも無効
    // --------------------------------------------------------
    if (name === "おにび") {

        if (defender.status) {
            score -= 30000;
        }

        if (
            defender.types &&
            defender.types.includes("ほのお")
        ) {
            score -= 30000;
        }
    }


    // --------------------------------------------------------
    // どくどく・でんじは・ねむり系
    // すでに状態異常なら再使用しない
    // --------------------------------------------------------
    if (
        name === "どくどく" ||
        name === "でんじは" ||
        name === "キノコのほうし" ||
        name === "ねむりごな" ||
        name === "さいみんじゅつ"
    ) {

        if (defender.status) {
            score -= 30000;
        }
    }


    // --------------------------------------------------------
    // 積み技
    // 能力が+6なら、それ以上使う意味がない
    // --------------------------------------------------------
    const stage =
        attacker.statStages || {};

    if (name === "こうそくいどう") {

        const speedStage =
            Number(stage.speed ?? 0);

        if (speedStage >= 6) {
            score -= 30000;
        }
    }


    if (name === "つるぎのまい") {

        const attackStage =
            Number(stage.attack ?? 0);

        if (attackStage >= 6) {
            score -= 30000;
        }
    }


    if (name === "わるだくみ") {

        const spAttackStage =
            Number(stage.spAttack ?? 0);

        if (spAttackStage >= 6) {
            score -= 30000;
        }
    }


    if (name === "めいそう") {

        const spAttackStage =
            Number(stage.spAttack ?? 0);

        const spDefenseStage =
            Number(stage.spDefense ?? 0);

        if (
            spAttackStage >= 6 &&
            spDefenseStage >= 6
        ) {
            score -= 30000;
        }
    }


    if (name === "りゅうのまい") {

        const attackStage =
            Number(stage.attack ?? 0);

        const speedStage =
            Number(stage.speed ?? 0);

        if (
            attackStage >= 6 &&
            speedStage >= 6
        ) {
            score -= 30000;
        }
    }


    if (name === "てっぺき") {

        const defenseStage =
            Number(stage.defense ?? 0);

        if (defenseStage >= 6) {
            score -= 30000;
        }
    }


    if (name === "ドわすれ") {

        const spDefenseStage =
            Number(stage.spDefense ?? 0);

        if (spDefenseStage >= 6) {
            score -= 30000;
        }
    }


    if (name === "ビルドアップ") {

        const attackStage =
            Number(stage.attack ?? 0);

        const defenseStage =
            Number(stage.defense ?? 0);

        if (
            attackStage >= 6 &&
            defenseStage >= 6
        ) {
            score -= 30000;
        }
    }

    // --------------------------------------------------------
    // まもる
    // --------------------------------------------------------

    if (
        name === "まもる" ||
        name === "キングシールド"
    ) {

        const enemy =
            aiV2BestEnemyAttack(
                defender,
                attacker
            );


        if (
            enemy &&
            enemy.damage >=
            attacker.currentHp
        ) {

            score += 60000;

        }
        else {

            score += 500;

        }

    }


    // --------------------------------------------------------
    // みがわり
    // --------------------------------------------------------

    if (
        name === "みがわり"
    ) {

        if (
            attacker.hasSubstitute
        ) {

            score -= 10000;

        }
        else if (
            attacker.currentHp >
            attacker.maxHp * 0.30
        ) {

            score += 5000;

        }

    }


    // --------------------------------------------------------
    // 積み技
    // --------------------------------------------------------

    const setupMoves = [

        "つるぎのまい",
        "わるだくみ",
        "めいそう",
        "りゅうのまい",
        "ちょうのまい",
        "てっぺき",
        "ドわすれ",
        "こうそくいどう"

    ];


    if (
        setupMoves.includes(name)
    ) {

        score +=
            ULTIMATE_AI_V2.setup;


        // 死ぬなら積まない
        if (
            aiV2EnemyHasKO(
                defender,
                attacker
            )
        ) {

            score -=
                30000;

        }

    }


    // --------------------------------------------------------
    // 状態異常
    // --------------------------------------------------------

    if (
        name === "どくどく" ||
        name === "でんじは" ||
        name === "キノコのほうし" ||
        name === "ねむりごな"
    ) {

        if (
            !defender.status
        ) {

            score +=
                ULTIMATE_AI_V2.status;

        }

    }


    // --------------------------------------------------------
    // やどりぎ
    // --------------------------------------------------------

    if (
        name === "やどりぎのたね"
    ) {

        score +=
            4500;

    }


    // --------------------------------------------------------
    // ステルスロック
    // --------------------------------------------------------

    if (
        name === "ステルスロック"
    ) {

        if (
            !opponentStealthRock
        ) {

            score +=
                6000;

        }
        else {

            score -=
                5000;

        }

    }


    // --------------------------------------------------------
    // 回復
    // --------------------------------------------------------

    const recoveryMoves = [

        "じこさいせい",
        "はねやすめ",
        "なまける",
        "つきのひかり",
        "あさのひざし"

    ];


    if (
        recoveryMoves.includes(name)
    ) {

        ) {

    // --------------------------------------------------------

            );

    }
    catch (e) {}


    return score;

}


// ============================================================
// 「この技を撃ったあと」の評価
// ============================================================

function aiV2EvaluateMove(
    move,
    attacker,
    defender
) {

    let score = 0;


    if (
        move.category === "status"
    ) {

        score +=
            aiV2EvaluateStatus(
                move,
                attacker,
                defender
            );

    }
    else {

        score +=
            aiV2EvaluateAttack(
                move,
                attacker,
                defender
            );

    }


    // ========================================================
    // 自分の生存
    // ========================================================

    const enemyBest =
        aiV2BestEnemyAttack(
            defender,
            attacker
        );


    if (enemyBest) {

        // 相手が次ターンに確定KO
        if (
            enemyBest.damage >=
            attacker.currentHp
        ) {

            // 今の技で倒せるなら問題なし
            if (
                !aiV2KO(
                    move,
                    attacker,
                    defender
                )
            ) {

                score -=
                    ULTIMATE_AI_V2.avoidDeath;

            }

        }
        else {

            const remain =
                Math.max(
                    0,
                    attacker.currentHp -
                    enemyBest.expected
                );


            score +=
                (
                    remain /
                    Math.max(
                        1,
                        attacker.maxHp
                    )
                ) *
                ULTIMATE_AI_V2.hp;

        }

    }


    // ========================================================
    // 未来評価
    // ========================================================

    try {

        const future =
            getAIFutureScore(
                move
            );


        if (
            Number.isFinite(future)
        ) {

            score +=
                future *
                ULTIMATE_AI_V2.future;

        }

    }
    catch (e) {}


    // ========================================================
    // Minimax
    // ========================================================

    try {

        const minimax =
            getAIMinimaxScore(
                move
            );


        if (
            Number.isFinite(minimax)
        ) {

            score +=
                minimax *
                0.65;

        }

    }
    catch (e) {}


    // ========================================================
    // 交代読み
    // ========================================================

    try {

        score +=
            getAISwitchReadScore(
                move,
                attacker,
                defender
            ) * 0.7;

    }
    catch (e) {}


    // ========================================================
    // 性格
    // ========================================================

    try {

        score +=
            getAIPersonalityBonus(
                move,
                attacker,
                defender
            );

    }
    catch (e) {}


    return score;

}


// ============================================================
// 交代先評価
// ============================================================

function aiV2EvaluateSwitch(
    switchPokemon,
    currentPokemon,
    enemyPokemon
) {

    if (
        !switchPokemon ||
        !enemyPokemon
    ) {
        return -Infinity;
    }


    let score = 0;


    // ========================================================
    // HP
    // ========================================================

    score +=
        aiV2HpRate(
            switchPokemon
        ) *
        10000;


    // ========================================================
    // 交代先からの攻撃
    // ========================================================

    const attack =
        aiV2BestEnemyAttack(
            switchPokemon,
            enemyPokemon
        );


    if (attack) {

        score +=
            attack.expected *
            15;


        if (
            attack.damage >=
            enemyPokemon.currentHp
        ) {

            score +=
                150000;

        }
        else if (
            attack.damage * 2 >=
            enemyPokemon.currentHp
        ) {

            score +=
                25000;

        }


        const effectiveness =
            aiV2Effectiveness(
                attack.move,
                switchPokemon,
                enemyPokemon
            );


        if (
            effectiveness >= 4
        ) {

            score +=
                15000;

        }
        else if (
            effectiveness >= 2
        ) {

            score +=
                8000;

        }

    }


    // ========================================================
    // 交代先が即死しないか
    // ========================================================

    const enemyAttack =
        aiV2BestEnemyAttack(
            enemyPokemon,
            switchPokemon
        );


    if (enemyAttack) {

        score -=
            enemyAttack.expected *
            12;


        if (
            enemyAttack.damage >=
            switchPokemon.currentHp
        ) {

            score -=
                180000;

        }
        else if (
            enemyAttack.damage * 2 >=
            switchPokemon.currentHp
        ) {

            score -=
                30000;

        }

    }


    // ========================================================
    // 素早さ
    // ========================================================

    if (
        aiV2Number(
            switchPokemon.speed
        ) >
        aiV2Number(
            enemyPokemon.speed
        )
    ) {

        score +=
            ULTIMATE_AI_V2.speed;

    }


    // ========================================================
    // 交代したことで現在のポケモンを温存できる
    // ========================================================

    if (
        currentPokemon &&
        currentPokemon.currentHp >
        0
    ) {

        score +=
            aiV2HpRate(
                currentPokemon
            ) *
            3000;

    }


    return score;

}


// ============================================================
// 交代候補
// ============================================================

function aiV2GetSwitchCandidates() {

    if (
        !Array.isArray(opponentTeam)
    ) {
        return [];
    }


    return opponentTeam
        .map(
            (pokemon, index) => ({
                pokemon,
                index
            })
        )
        .filter(
            ({ pokemon, index }) =>
                pokemon &&
                pokemon.currentHp > 0 &&
                index !==
                    opponentActiveIndex
        );

}


// ============================================================
// 最強交代先
// ============================================================

function aiV2BestSwitch() {

    const candidates =
        aiV2GetSwitchCandidates();


    if (
        candidates.length === 0
    ) {
        return -1;
    }


    let bestIndex =
        -1;

    let bestScore =
        -Infinity;


    for (
        const candidate of candidates
    ) {

        const score =
            aiV2EvaluateSwitch(
                candidate.pokemon,
                opponentPokemon,
                playerPokemon
            );


        if (
            score >
            bestScore
        ) {

            bestScore =
                score;

            bestIndex =
                candidate.index;

        }

    }


    return bestIndex;

}


// ============================================================
// 「居座る」vs「交代」を比較
// ============================================================

function aiV2ShouldSwitch() {

    if (
        difficulty === "easy"
    ) {
        return false;
    }


    if (
        !opponentPokemon ||
        !playerPokemon
    ) {
        return false;
    }


    const switchIndex =
        aiV2BestSwitch();


    if (
        switchIndex === -1
    ) {
        return false;
    }


    // ========================================================
    // 現在のポケモンで戦う
    // ========================================================

    const moves =
        aiV2GetMoves(
            opponentPokemon,
            playerPokemon
        );


    let bestStay =
        -Infinity;


    for (
        const move of moves
    ) {

        const score =
            aiV2EvaluateMove(
                move,
                opponentPokemon,
                playerPokemon
            );


        bestStay =
            Math.max(
                bestStay,
                score
            );

    }


    // ========================================================
    // 交代
    // ========================================================

    const nextPokemon =
        opponentTeam[
            switchIndex
        ];


    const switchScore =
        aiV2EvaluateSwitch(
            nextPokemon,
            opponentPokemon,
            playerPokemon
        );


    // 交代には少しコストを設定
    const finalSwitchScore =
        switchScore -
        ULTIMATE_AI_V2.switchPenalty;


    // ========================================================
    // 現在のポケモンが確定KOできるなら居座る
    // ========================================================

    const currentBest =
        aiV2BestEnemyAttack(
            opponentPokemon,
            playerPokemon
        );


    if (
        currentBest &&
        currentBest.damage >=
        playerPokemon.currentHp
    ) {

        return false;

    }


    // ========================================================
    // 現在のポケモンが確定で倒されるなら交代
    // ========================================================

    const incoming =
        aiV2BestEnemyAttack(
            playerPokemon,
            opponentPokemon
        );


    if (
        incoming &&
        incoming.damage >=
        opponentPokemon.currentHp
    ) {

        return true;

    }


    // ========================================================
    // 明確に交代有利な場合のみ
    // ========================================================

    return (
        finalSwitchScore >
        bestStay + 3500
    );

}


// ============================================================
// 技と交代を全部まとめて比較
// ============================================================

function aiV2GetAllActions() {

    const actions = [];


    // ========================================================
    // 技
    // ========================================================

    const moves =
        aiV2GetMoves(
            opponentPokemon,
            playerPokemon
        );


    for (
        const move of moves
    ) {

        actions.push({

            type: "move",

            move,

            index: -1,

            score:
                aiV2EvaluateMove(
                    move,
                    opponentPokemon,
                    playerPokemon
                )

        });

    }


    // ========================================================
    // 交代
    // ========================================================

    const switchCandidates =
        aiV2GetSwitchCandidates();


    for (
        const candidate of
        switchCandidates
    ) {

        actions.push({

            type: "switch",

            move: null,

            index:
                candidate.index,

            score:
                aiV2EvaluateSwitch(
                    candidate.pokemon,
                    opponentPokemon,
                    playerPokemon
                ) -
                ULTIMATE_AI_V2.switchPenalty

        });

    }


    return actions;

}


// ============================================================
// 最終行動選択
// ============================================================

function getOpponentActionUltimateV2() {

    if (
        !opponentPokemon ||
        !playerPokemon
    ) {
        return {

            type: "move",

            move: null,

            index: -1

        };
    }


    // ========================================================
    // ① 確定KO技
    // ========================================================

    const moves =
        aiV2GetMoves(
            opponentPokemon,
            playerPokemon
        );


    const koMoves =
        moves.filter(
            move =>
                aiV2KO(
                    move,
                    opponentPokemon,
                    playerPokemon
                )
        );


    if (
        koMoves.length > 0
    ) {

        let best =
            koMoves[0];

        let bestScore =
            -Infinity;


        for (
            const move of koMoves
        ) {

            const score =
                aiV2EvaluateMove(
                    move,
                    opponentPokemon,
                    playerPokemon
                );


            if (
                score >
                bestScore
            ) {

                bestScore =
                    score;

                best =
                    move;

            }

        }


        return {

            type: "move",

            move: best,

            index: -1

        };

    }


    // ========================================================
    // ② 交代すべきか
    // ========================================================

    if (
        aiV2ShouldSwitch()
    ) {

        const switchIndex =
            aiV2BestSwitch();


        if (
            switchIndex !== -1
        ) {

            return {

                type: "switch",

                move: null,

                index:
                    switchIndex

            };

        }

    }


    // ========================================================
    // ③ 全行動を比較
    // ========================================================

    const actions =
        aiV2GetAllActions();


    if (
        actions.length === 0
    ) {

        return {

            type: "move",

            move: null,

            index: -1

        };

    }


    actions.sort(
        (a, b) =>
            b.score -
            a.score
    );


    // ========================================================
    // HARD
    // ========================================================

    if (
        difficulty === "hard"
    ) {

        return actions[0];

    }


    // ========================================================
    // NORMAL
    // ========================================================

    if (
        difficulty === "normal"
    ) {

        const best =
            actions[0].score;


        const candidates =
            actions.filter(
                action =>
                    action.score >=
                    best * 0.90
            );


        return
            candidates[
                Math.floor(
                    Math.random() *
                    candidates.length
                )
            ];

    }


    // ========================================================
    // EASY
    // ========================================================

    const candidates =
        actions.slice(
            0,
            Math.min(
                3,
                actions.length
            )
        );


    return
        candidates[
            Math.floor(
                Math.random() *
                candidates.length
            )
        ];

}

const ULTIMATE_AI_V3 = {

// ============================================================
// 安全な数値
// ============================================================

function aiV3Num(value, fallback = 0) {

    const n = Number(value);

    return Number.isFinite(n)
        ? n
        : fallback;
}


// ============================================================
// HP割合
// ============================================================

function aiV3HpRate(pokemon) {

    if (!pokemon || !pokemon.maxHp) {
        return 0;
    }

    return Math.max(
        0,
        Math.min(
            1,
            aiV3Num(pokemon.currentHp) /
            aiV3Num(pokemon.maxHp)
        )
    );
}


// ============================================================
// 生存ポケモン数
// ============================================================

function aiV3AliveCount(team) {

    if (!Array.isArray(team)) {
        return 0;
    }

    return team.filter(
        pokemon =>
            pokemon &&
            aiV3Num(pokemon.currentHp) > 0
    ).length;
}


// ============================================================
// 技が攻撃技か
// ============================================================

function aiV3IsAttack(move) {

    if (!move) {
        return false;
    }

    return move.category !== "status";
}


// ============================================================
// 技が補助技か
// ============================================================

function aiV3IsStatus(move) {

    if (!move) {
        return false;
    }

    return move.category === "status";
}


// ============================================================
// タイプ相性
// ============================================================

function aiV3Effectiveness(
    move,
    attacker,
    defender
) {

    try {

        return aiV3Num(
            getAITypeEffectiveness(
                move,
                attacker,
                defender
            ),
            1
        );

    } catch (e) {

        return 1;
    }
}


// ============================================================
// ダメージ
// ============================================================

function aiV3Damage(
    move,
    attacker,
    defender
) {

    try {

        return Math.max(
            0,
            aiV3Num(
                getAIDamage(
                    move,
                    attacker,
                    defender
                )
            )
        );

    } catch (e) {

        return 0;
    }
}


// ============================================================
// 期待ダメージ
// ============================================================

function aiV3ExpectedDamage(
    move,
    attacker,
    defender
) {

    const damage =
        aiV3Damage(
            move,
            attacker,
            defender
        );

    const accuracy =
        aiV3Num(
            getAIAccuracy(move),
            1
        );

    return damage * accuracy;
}


// ============================================================
// その技でKOできるか
// ============================================================

function aiV3IsKO(
    move,
    attacker,
    defender
) {

    if (!move || !attacker || !defender) {
        return false;
    }

    return (
        aiV3Damage(
            move,
            attacker,
            defender
        ) >=
        aiV3Num(defender.currentHp)
    );
}


// ============================================================
// 何発で倒せるか
// ============================================================

function aiV3HitsToKO(
    move,
    attacker,
    defender
) {

    const damage =
        aiV3Damage(
            move,
            attacker,
            defender
        );

    if (damage <= 0) {
        return Infinity;
    }

    return Math.ceil(
        aiV3Num(defender.currentHp) /
        damage
    );
}


// ============================================================
// 相手の最強攻撃
// ============================================================

function aiV3BestEnemyAttack(
    attacker,
    defender
) {

    if (!attacker || !defender) {
        return null;
    }

    const moves =
        getAIEffectiveMoves(
            attacker,
            defender
        ) || [];

    let best = null;

    for (const move of moves) {

        if (!aiV3IsAttack(move)) {
            continue;
        }

        const damage =
            aiV3Damage(
                move,
                attacker,
                defender
            );

        const expected =
            aiV3ExpectedDamage(
                move,
                attacker,
                defender
            );

        const ko =
            damage >=
            aiV3Num(defender.currentHp);

        let score =
            expected * 2;

        if (ko) {
            score += 50000;
        }

        const effectiveness =
            aiV3Effectiveness(
                move,
                attacker,
                defender
            );

        if (effectiveness >= 2) {
            score += 1000;
        }

        if (
            !best ||
            score > best.score
        ) {

            best = {
                move,
                damage,
                expected,
                score,
                ko
            };
        }
    }

    return best;
}


// ============================================================
// 状態異常評価
// ============================================================

function aiV3StatusValue(
    move,
    attacker,
    defender
) {

    if (!move || !attacker || !defender) {
        return 0;
    }

    let score = 0;

    try {

        score += aiV3Num(
            getAIStatusMoveScore(
                move,
                attacker,
                defender
            )
        );

    } catch (e) {}

    try {

        score += aiV3Num(
            getAIStatusScore(
                move,
                attacker,
                defender
            )
        );

    } catch (e) {}


    // すでに状態異常なら状態異常技の価値を下げる

    if (
        defender.status &&
        defender.status !== "none"
    ) {

        score -= 3000;
    }


    // HPが少ない相手への状態異常は価値を下げる

    if (
        aiV3HpRate(defender) < 0.25
    ) {

        score -= 1500;
    }


    return score;
}


// ============================================================
// 補助技評価
// ============================================================

function aiV3StatusMoveScore(

    attacker,
    defender
) {

    let score =
        aiV3StatusValue(

    ) {

            );

        if (

        ) {

        } else if (
            enemyAttack &&
            enemyAttack.expected >
            aiV3Num(attacker.currentHp) * 0.4
        ) {

            score += 5000;

        } else {

            score -= 1500;
        }
    }


    // みがわり

    if (
        move.name === "みがわり"
    ) {

        if (
            aiV3HpRate(attacker) > 0.4 &&
            !attacker.hasSubstitute
        ) {

            score += 5000;
        }

        if (
            aiV3HpRate(attacker) < 0.3
        ) {

            score -= 5000;
        }
    }


    // 積み技

    const setupMoves = [
        "つるぎのまい",
        "わるだくみ",
        "めいそう",
        "てっぺき",
        "りゅうのまい",
        "こうそくいどう",

    ];

    if (
        setupMoves.includes(move.name)
    ) {

        const enemyAttack =
            aiV3BestEnemyAttack(
                defender,
                attacker
            );

        if (
            enemyAttack &&
            enemyAttack.ko
        ) {

            score -= 25000;

        } else {

            if (

            ) {
